ticket:
  key: WEB-0309
  from: sam
  title: "The WhatsApp basket loses repeated items"
  body: >
    Raju here. Mrs. D'Souza ordered three keychains on WhatsApp, and the basket said she had one. When a basket is
    empty, the order screen shows a blank line instead of saying so. The basket is a list of item codes, like
    ["KEY", "CST", "KEY"]. Can you fix it in src/basket.js?
hints:
  - "basket.includes(code) is true when the code is anywhere in the array."
  - "For countOf, loop with for...of and add 1 each time an item === code. For addItem, call basket.push(code); then return basket;"
  - "For codesLine, check basket.length === 0 first and return \"Basket is empty\". Otherwise return basket.join(\", \")."
review: true

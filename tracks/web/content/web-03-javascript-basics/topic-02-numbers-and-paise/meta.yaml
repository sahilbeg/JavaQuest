  title: "Split the bill asks for a third of a paisa"
  body: >
    Raju here. Three college friends wanted to split ₹1,000 for a birthday gift. Our calculator told each of them
    to pay an amount with a long tail of 3s after the dot, and UPI won't send that. It also can't tell me how many
    whole rupees and paise are in an amount. Can you fix src/paise.js?
hints:
  - "Every amount in this file is whole paise. lineTotal is a single multiplication."
  - "Math.floor(paise / 100) gives the whole rupees, and paise % 100 gives the paise left over."
  - "For shareEach, divide and then round down: return Math.floor(totalPaise / people);"
review: true

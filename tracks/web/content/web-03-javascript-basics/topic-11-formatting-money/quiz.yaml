topic: web-03-javascript-basics/topic-11-formatting-money
drawCount: 6
passPercent: 80
questions:
  - id: q01
    type: predict-output
    concept: to-fixed
    code: |
      console.log((15050 / 100).toFixed(2));
    answer: "150.50"
    explain: "15050 / 100 is 150.5, and toFixed(2) always shows two decimals."
    reteach: "### Syntax: toFixed"

  - id: q02
    type: predict-output
    concept: to-fixed
    code: |
      console.log(typeof (899).toFixed(2));
    answer: "string"
    explain: "toFixed hands back text, ready to show, not a number."
    reteach: "### toFixed gives text"

  - id: q03
    type: mcq
    concept: intl-number-format
    prompt: "What does new Intl.NumberFormat(\"en-IN\", { style: \"currency\", currency: \"INR\" }).format(1299) give?"
    choices: ["₹1,299.00", "₹1299", "INR 1,299", "1,299.00 ₹"]
    answer: 0
    explain: "The en-IN currency formatter adds the ₹ sign, the comma and two decimals."
    reteach: "### Syntax: Intl.NumberFormat"

  - id: q04
    type: predict-output
    concept: indian-grouping
    code: |
      console.log(new Intl.NumberFormat("en-IN").format(1234567));
    answer: "12,34,567"
    explain: "After the first three digits, en-IN puts a comma every two digits: 12 lakh, 34 thousand, 567."
    reteach: "### Indian grouping: lakhs and crores"

  - id: q05
    type: mcq
    concept: paise-to-rupees
    prompt: "Why does the code divide by 100 before calling format?"
    choices: ["The formatter expects rupees, but the code stores paise", "format can't handle numbers above 10000", "Dividing removes the floating-point error", "It makes the number a string"]
    answer: 0
    explain: "Prices are stored in paise. The formatter shows whatever number it gets as rupees, so 89900 would show as ₹89,900.00."
    reteach: "### From paise to rupees"

  - id: q06
    type: predict-output
    concept: padding
    code: |
      console.log("7".padStart(3, "0"));
    answer: "007"
    explain: "padStart adds the fill character in front until the text is 3 characters long."
    reteach: "### Syntax: padStart and padEnd"

  - id: q07
    type: predict-output
    concept: padding
    code: |
      console.log("KEY".padEnd(6).length);
      console.log("Keychain".padEnd(4));
    answer: "6\nKeychain"
    explain: "padEnd(6) adds 3 spaces to make 6 characters. Keychain is already longer than 4, so it stays as it is."
    reteach: "### Syntax: padStart and padEnd"

  - id: q08
    type: fill-blank
    concept: to-fixed
    goal: "Show the rupee amount with exactly two digits after the decimal point."
    prompt: "const text = rupees.___(2);"
    answers: ["toFixed"]
    explain: "toFixed(2) gives a string with exactly two decimals."
    reteach: "### Syntax: toFixed"

  - id: q09
    type: spot-the-bug
    concept: paise-to-rupees
    code: |
      const inr = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR" });
      const paise = 89900;
      console.log(inr.format(paise));
    bugLine: 3
    explain: "This shows ₹89,900.00 for a ₹899 bag. Divide the paise by 100 before formatting."
    reteach: "## Common mistakes"

  - id: q10
    type: predict-output
    concept: to-fixed
    code: |
      console.log((1.005).toFixed(2));
    answer: "1.00"
    explain: "1.005 is stored as a guess just below 1.005, so it rounds down. Keep money in whole paise."
    reteach: "## Common mistakes"

  - id: q11
    type: mcq
    concept: paise-to-rupees
    prompt: "When should the calculator turn paise into a ₹ string?"
    choices: ["Only at the very end, when showing the amount", "Before adding up the lines", "Before working out the discount", "As soon as an amount has paise in it"]
    answer: 0
    explain: "Formatted text can't be added up safely. Do every sum in paise, then format once."
    reteach: "### toFixed gives text"

  - id: q12
    type: predict-output
    concept: to-fixed
    code: |
      const a = (150).toFixed(2);
      const b = (30).toFixed(2);
      console.log(a + b);
    answer: "150.0030.00"
    explain: "Both are strings, so + glues them together instead of adding."
    reteach: "### toFixed gives text"

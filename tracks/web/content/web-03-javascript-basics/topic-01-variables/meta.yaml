ticket:
  key: WEB-0301
  from: maya
  title: "The stall counter forgets everything"
  body: >
    Raju wants a tiny counter for the FC Road stall. It should know the shop's name and city, and keep count
    of the coaster sets in the stock box as they sell on Sunday. Right now every value in src/stall.js is empty.
    Can you give it some memory?
hints:
  - "Use const for values that never change, like the shop's name. Use let for values that do, like a count."
  - "For TODO 1 and 2, only the text inside the quotes changes: export const SHOP_NAME = \"Dhaaga & Co.\";"
  - "For TODO 3, write let coasters = 12; then coasters = coasters - 3; and so on for each sale or delivery. End with return coasters;"
review: true

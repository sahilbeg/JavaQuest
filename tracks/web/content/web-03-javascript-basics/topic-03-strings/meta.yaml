ticket:
  key: WEB-0303
  from: sam
  title: "\" ami \" is not an item code, says the calculator"
  body: >
    Raju here. Customers type item codes on WhatsApp like " ami " or "Bag", and the calculator finds nothing.
    Mr. Fernandes also wants his granddaughter's initials stitched on her baby booties, and I work them out by hand.
    Our item labels and "ready" messages look messy too. Can you tidy up the text in src/labels.js?
hints:
  - "A template literal uses backticks and ${...}, like `${code}: ${name}`."
  - "trim() removes the spaces at both ends, and toUpperCase() makes capitals. You can chain them: typed.trim().toUpperCase()."
  - "first[0] is the first letter of first. Join the two first letters with +, then call toUpperCase() on the result."
review: true

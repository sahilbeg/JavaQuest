topic: web-03-javascript-basics/topic-03-strings
drawCount: 6
passPercent: 80
questions:
  - id: q01
    type: predict-output
    concept: concatenation
    code: |
      console.log("150" + 30);
    answer: "15030"
    explain: "One side is a string, so + glues the 30 on as text instead of adding."
    reteach: "### Text and numbers mixed"

  - id: q02
    type: predict-output
    concept: concatenation
    code: |
      console.log(150 + 30 + " paise");
    answer: "180 paise"
    explain: "JavaScript works left to right. 150 + 30 adds to 180 first, then meets the text and glues."
    reteach: "### Text and numbers mixed"

  - id: q03
    type: predict-output
    concept: template-literals
    code: |
      const item = "Keychain";
      const qty = 2;
      console.log(`${qty} x ${item}`);
    answer: "2 x Keychain"
    explain: "Each ${...} is replaced by the value in that box."
    reteach: "### Syntax: template literals"

  - id: q04
    type: fill-blank
    concept: string-methods
    goal: "Remove the spaces at both ends of what the customer typed."
    prompt: "const clean = typed.___();"
    answers: ["trim"]
    explain: "trim() hands back a new string without the spaces at the start and the end."
    reteach: "### Syntax: string methods"

  - id: q05
    type: mcq
    concept: template-literals
    prompt: "Which kind of quote fills in ${...} with a value?"
    choices: ["Backticks: `...`", "Double quotes: \"...\"", "Single quotes: '...'", "All three of them"]
    answer: 0
    explain: "Only a template literal, written in backticks, fills in ${...}."
    reteach: "### Syntax: template literals"

  - id: q06
    type: predict-output
    concept: indexing
    code: |
      const code = "DC-1042";
      console.log(code.length);
      console.log(code[0]);
      console.log(code.slice(3));
    answer: "7\nD\n1042"
    explain: "DC-1042 has 7 characters. Index 0 is D, and slice(3) keeps everything from index 3 on."
    reteach: "### Syntax: length and index"

  - id: q07
    type: predict-output
    concept: string-methods
    code: |
      let code = "bag";
      code.toUpperCase();
      console.log(code);
    answer: "bag"
    explain: "toUpperCase() hands back a new string, but nothing stored it. code still holds bag."
    reteach: "### Strings never change"

  - id: q08
    type: spot-the-bug
    concept: template-literals
    code: |
      const name = "Asha";
      const message = "Hi ${name}, your order is ready.";
      console.log(message);
    bugLine: 2
    explain: "${...} only works inside backticks. In double quotes it prints as it is."
    reteach: "## Common mistakes"

  - id: q09
    type: mcq
    concept: string-methods
    prompt: "Which expression is true when the item id in the variable id begins with DC-?"
    choices: ['id.startsWith("DC-")', 'id.toUpperCase("DC-")', 'id.trim("DC-")', 'id.slice("DC-")']
    answer: 0
    explain: "startsWith checks the beginning of a string and gives true or false."
    reteach: "### Syntax: string methods"

  - id: q10
    type: predict-output
    concept: string-methods
    code: |
      console.log("  ami ".trim().toUpperCase());
    answer: "AMI"
    explain: "trim() removes the spaces, then toUpperCase() runs on that new string."
    reteach: "### Syntax: string methods"

  - id: q11
    type: mcq
    concept: indexing
    prompt: "What is \"Tote bag\".length?"
    choices: ["8", "7", "2", "9"]
    answer: 0
    explain: "length counts every character, and the space counts too: 4 + 1 + 3 is 8."
    reteach: "### Syntax: length and index"

  - id: q12
    type: order
    concept: strings
    prompt: "Put the lines in order so the program prints Hi Asha!"
    items:
      - "const first = \"Asha\";"
      - "const greeting = `Hi ${first}!`;"
      - "console.log(greeting);"
    explain: "Make the name, build the greeting from it, then print the greeting."
    reteach: "## Concept"

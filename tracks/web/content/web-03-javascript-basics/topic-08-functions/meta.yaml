  title: "Gift wrap and names are added by hand"
  body: >
    Every time a customer wants gift wrap or a name stitched on, Raju adds the extra by hand, and he forgot it twice
    last week. Let's give the calculator small functions, one per job: a line total, the extras for one item, an
    item's full cost and the delivery fee. They're waiting in src/extras.js.
hints:
  - "A default parameter looks like function lineTotal(paise, qty = 1). The 1 is used only when qty is left out."
  - "In extrasFor, start with let extra = 0; then add 3000 if giftWrap is truthy, and 5000 if name is truthy. A missing name is undefined, which is falsy."
  - "itemCost can be one line: return lineTotal(paise, qty) + extrasFor(giftWrap, name) * qty; and deliveryFor can be (subtotalPaise) => subtotalPaise > 99900 ? 0 : 6000"
review: true

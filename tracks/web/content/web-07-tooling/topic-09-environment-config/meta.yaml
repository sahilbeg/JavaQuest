ticket:
  key: WEB-0709
  from: maya
  title: "The test site sent orders to the live shop"
  body: >
    The orders API address is typed straight into cart.js, so last week the test copy of the site sent
    three practice orders to the real shop, and Raju nearly posted them. Turning the Diwali banner on also
    means editing code. Please move these settings into one config module that reads the environment,
    fills in safe defaults, and refuses to start when something important is missing.
hints:
  - "Every environment value is text, or missing. The finished read(env, name) helper gives you the trimmed text, or undefined when it is missing or blank."
  - "Text \"false\" is truthy. Compare with === \"true\" and === \"false\", and throw for anything else. Turn digits into a number with Number, after checking them with /^\\d+$/."
  - "Only production must have VITE_API_URL: throw an Error that names it. Elsewhere, fall back to DEFAULTS.apiUrl. Remove trailing slashes with .replace(/\\/+$/, \"\"), and Object.freeze the result."
review: true

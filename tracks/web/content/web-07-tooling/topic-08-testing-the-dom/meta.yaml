ticket:
  key: WEB-0708
  from: sana
  title: "The sold-out button keeps coming back"
  body: >
    Twice now, a change to the product card brought back the Add to cart button on sold-out items, and
    a customer paid for baby booties we didn't have. Kavya says the card needs checks that click it the
    way a customer does. Can you rebuild the card so those checks pass?
hints:
  - "Read test/productCard.test.js first. Each test sets up an empty #shelf, draws a card into it, then looks inside with querySelector."
  - "Build each part with document.createElement and set its text with textContent. Give the price and stock paragraphs the classes price and stock."
  - "Set button.disabled = product.stock === 0, add a click listener that calls onAdd(product.id), and finish with container.replaceChildren(article)."
review: true

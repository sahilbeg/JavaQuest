ticket:
  key: WEB-0502
  from: sam
  title: "The price checker says ₹450 for everything"
  body: >
    Raju here. The price checker on the counter tablet shows ₹450 whatever I look up, which is Golu's price.
    Mrs. Kapoor nearly paid ₹450 for a ₹120 keychain this morning. Can you make it find the right item and the
    right price?
hints:
  - "Every function gets a root to search in. Use root.querySelector for one element and root.querySelectorAll for all of them, with the same selectors you write in CSS."
  - "A search for .price from the root finds the first price on the whole page. Find the product's card first, then search for .price inside that card."
  - "findProduct is root.querySelector(`.product[data-id=\"${id}\"]`). priceOf calls it, returns \"\" for null, then card.querySelector(\".price\").textContent.trim(). Spread querySelectorAll into an array before you map."
review: true

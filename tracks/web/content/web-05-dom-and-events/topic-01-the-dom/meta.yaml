ticket:
  key: WEB-0501
  from: maya
  title: "How many items are on the catalogue page?"
  body: >
    Before we build the cart, I want a tiny page inspector. Raju keeps asking how many items the catalogue page shows
    and which one comes first. Write a few functions that read the page and answer him. They'll fill the summary line
    under the product list.
hints:
  - "Every function gets an element. Ask that element about its family: its children, its first and last child, its parent."
  - "children holds only elements. childNodes also holds the spaces between tags, as text nodes. Count with children."
  - "list.children.length counts. [...list.children].map((item) => item.textContent.trim()) gives the names. list.firstElementChild is null when the list is empty. element.parentElement.id gives the parent's id."
review: true

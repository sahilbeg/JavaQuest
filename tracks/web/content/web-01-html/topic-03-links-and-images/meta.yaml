ticket:
  key: WEB-0103
  from: sam
  title: "Customers want to see Golu and order him"
  body: >
    Raju here. Three people at the stall on Sunday said they saw the page but couldn't see Golu,
    and couldn't find how to order him. Can the page show his photo, link to his own page, and have
    a WhatsApp button? A link at the top straight to the catalogue would help too.
hints:
  - "A link is an a element with an href attribute. A photo is an img element with src and alt."
  - "href=\"#catalogue\" jumps to the element whose id is catalogue. A link to another file on the site can be relative, like items/dc-1042.html."
  - "Try: <img src=\"images/golu.jpg\" alt=\"Golu, a small crocheted elephant in Rani pink yarn\" width=\"300\" height=\"300\">"
review: true

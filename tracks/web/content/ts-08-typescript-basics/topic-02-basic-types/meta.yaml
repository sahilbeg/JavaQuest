ticket:
  key: TSX-0802
  from: maya
  title: "The calculator's first TypeScript file"
  body: >
    We're moving the price calculator to TypeScript, one file at a time. I've started src/basics.ts: the types
    are in and it type-checks, but every function still returns a placeholder. Fill them in without changing
    the types. Raju needs parseQty most, because customers type all sorts of things in the quantity box.
hints:
  - "The types tell you what to return. toPaise and parseQty give a number, rupeesText and stockLabel give a string, canMakeToys gives a boolean."
  - "Number(typed.trim()) turns text into a number. Number.isInteger(qty) && qty >= 0 tells you if it's a usable quantity."
  - "rupeesText is \"₹\" + (paise / 100).toFixed(2). canMakeToys is grams >= toys * TOY_GRAMS."
review: true

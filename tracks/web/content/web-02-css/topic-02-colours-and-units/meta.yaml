hints:
  - "Each colour goes in as a hex code after the property, like color: #2e3a8c; Background colours use the property background-color."
  - "Sizes for text use rem: 1rem is the reader's normal text size, so 2rem is twice that."
  - "Try: body { background-color: #faf7f0; color: #2e3a8c; } and .buy { background-color: #f2a81d; color: #2e3a8c; }"

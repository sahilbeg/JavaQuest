topic: web-02-css/topic-08-grid
drawCount: 6
passPercent: 80
questions:
  - id: q01
    type: mcq
    concept: grid-container
    prompt: "Which line turns the products list into a grid container?"
    choices: [".products { display: grid; }", ".product { display: grid; }", ".products { grid: yes; }", ".products { grid-column: 3; }"]
    answer: 0
    explain: "display: grid goes on the parent. Its direct children, the cards, become grid items."
    reteach: "### Grid containers"

  - id: q02
    type: mcq
    concept: grid-template-columns
    prompt: "How many columns does grid-template-columns: 10rem 1fr 10rem; make?"
    choices: ["3", "1", "2", "21"]
    answer: 0
    explain: "Each size separated by a space is one column. Three sizes make three columns."
    reteach: "### Syntax: grid-template-columns"

  - id: q03
    type: mcq
    concept: fr-unit
    prompt: "A grid has grid-template-columns: 2fr 1fr;. How do the two columns compare?"
    choices: ["The first is twice as wide as the second", "Both are the same width", "The second is twice as wide", "The first is 2px wider"]
    answer: 0
    explain: "fr shares the free space. 2fr gets two shares and 1fr gets one."
    reteach: "### Syntax: the fr unit"

  - id: q04
    type: predict-output
    concept: fr-unit
    code: |
      const width = 640;
      const gap = 20;
      const columns = 3;
      const free = width - gap * (columns - 1);
      console.log(free / columns);
    answer: "200"
    explain: "Two gaps use 40px, leaving 600px. Three equal shares of 600 are 200 each."
    reteach: "### Syntax: the fr unit"

  - id: q05
    type: fill-blank
    concept: repeat
    goal: "Make four equal columns in one short value, without writing 1fr four times."
    prompt: ".products { grid-template-columns: ___(4, 1fr); }"
    answers: ["repeat"]
    explain: "repeat(4, 1fr) is short for 1fr 1fr 1fr 1fr."
    reteach: "### Syntax: repeat()"

  - id: q06
    type: spot-the-bug
    concept: repeat
    code: |
      .products {
        display: grid;
        grid-template-columns: repeat(3 1fr);
        gap: 1.5rem;
      }
    bugLine: 3
    explain: "repeat needs a comma between the count and the size: repeat(3, 1fr). Without it, the value is dropped."
    reteach: "### Syntax: repeat()"

  - id: q07
    type: mcq
    concept: spanning
    prompt: "Golu's card should take two columns of the grid. Where does grid-column: span 2; go?"
    choices: ["On Golu's card, .featured", "On the list, .products", "On the body", "On every card"]
    answer: 0
    explain: "grid-column is set on the item that should span. The container only draws the tracks."
    reteach: "### Syntax: spanning several columns"

  - id: q08
    type: mcq
    concept: spanning
    prompt: "Which value also makes an item cover the first two columns?"
    choices: ["grid-column: 1 / 3;", "grid-column: 1 / 2;", "grid-column: 2;", "grid-column: 0 / 2;"]
    answer: 0
    explain: "Grid lines are numbered from 1. From line 1 to line 3 covers columns 1 and 2."
    reteach: "### Syntax: spanning several columns"

  - id: q09
    type: mcq
    concept: grid-vs-flex
    prompt: "Which job suits grid better than flexbox?"
    choices: ["Cards in rows and columns that line up with each other", "Two nav links in a row", "A logo and a nav in one header line", "Pushing one button to the bottom of a card"]
    answer: 0
    explain: "Grid handles rows and columns together, so every card lines up. The others are single rows or columns, flexbox's strength."
    reteach: "### Grid or flexbox?"

  - id: q10
    type: mcq
    concept: grid-container
    prompt: "The CSS says display: flex; and grid-template-columns: repeat(3, 1fr);. What happens?"
    choices: ["The columns are ignored, because it's not a grid container", "A 3-column grid appears", "Flexbox makes 3 rows", "The browser uses both at once"]
    answer: 0
    explain: "grid-template-columns only works with display: grid. Change flex to grid."
    reteach: "## Common mistakes"

  - id: q11
    type: mcq
    concept: grid-template-columns
    prompt: "Why does 33.33% 33.33% 33.33% with a 1.5rem gap stick out past the edge?"
    choices: ["The columns already fill 100%, and the gaps are added on top", "Percentages don't work in grids", "Gaps double the columns", "The browser rounds 33.33% up to 50%"]
    answer: 0
    explain: "Percentages ignore the gaps. fr shares only the space left after the gaps."
    reteach: "## Common mistakes"

  - id: q12
    type: mcq
    concept: fr-unit
    prompt: "What does repeat(auto-fill, minmax(14rem, 1fr)) do?"
    choices: ["Fits as many columns of at least 14rem as the row has room for", "Always makes 14 columns", "Makes one column 14rem wide", "Fills the page with empty cells"]
    answer: 0
    explain: "minmax sets each column to at least 14rem and at most one share, and auto-fill fits as many as will go."
    reteach: "### Columns that fit the screen"

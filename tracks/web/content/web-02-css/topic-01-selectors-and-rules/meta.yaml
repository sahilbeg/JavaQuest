  from: sana
  title: "The catalogue looks like a school notice"
  body: >
    Sana here. I showed the catalogue page to Meera Aunty and she said it looks like a circular from her old school.
    Black text, white page, nothing that says Dhaaga. Before I hand over the brand colours, can you wire up a stylesheet
    and give the headings, prices, nav links and the Visit us footer their first styles?
hints:
  - "First make the page load your CSS: a <link> in the <head> that points at style.css. Then fill in one rule per TODO."
  - "A class selector starts with a dot (.price), an id selector with a hash (#visit), and a type selector is just the tag name (h1)."
  - "Try: .price { font-weight: bold; } and h2, h3 { color: darkblue; } and nav a { color: darkred; }"
review: true

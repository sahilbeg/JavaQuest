questions:
  - id: q01
    type: mcq
    concept: debounce
    variants:
      - { prompt: "What does debouncing a function do?", choices: ["Delays it until calls have stopped for a set time, so only the last call in a burst runs", "Runs it twice to be safe", "Runs it at most once every so often, at a steady beat", "Makes it run on another thread"], answer: 0 }
      - { prompt: "A customer types golu into a debounced search box. How many searches run?", choices: ["One, for golu, after the pause", "Four, one per letter", "None until she presses Enter", "Two: g and golu"], answer: 0 }
    explain: "Each call cancels the waiting one and starts the wait again. Only a call followed by a quiet gap runs."
    reteach: "### What debouncing is"

  - id: q02
    type: predict-output
    concept: debounce
    code: |
      function debounce(fn, ms) {
        let timer = null;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => fn(...args), ms);
        };
      }
      const search = debounce((text) => console.log(text), 10);
      search("k");
      search("ke");
      search("key");
    answer: "key"
    explain: "The first two calls are cancelled by the next ones. Only the last call's timer runs out."
    reteach: "### Watch the timer reset"

  - id: q03
    type: predict-output
    concept: timer-reset
    code: |
      function debounce(fn, ms) {
        let timer = null;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => fn(...args), ms);
        };
      }
      const save = debounce((n) => console.log(`saved ${n}`), 10);
      save(1);
      save(2);
      setTimeout(() => save(3), 30);
    answer: "saved 2\nsaved 3"
    explain: "1 and 2 come in one burst, so only 2 is saved. After a pause, 3 starts a new burst and is saved too."
    reteach: "### Watch the timer reset"

  - id: q04
    type: predict-output
    concept: timer-reset
    code: |
      function debounce(fn, ms) {
        return (...args) => {
          let timer = null;
          clearTimeout(timer);
          timer = setTimeout(() => fn(...args), ms);
        };
      }
      const search = debounce((text) => console.log(text), 10);
      search("g");
      search("go");
    answer: "g\ngo"
    explain: "timer is new on every call, so clearTimeout never cancels the earlier wait. Both calls run."
    reteach: "## Common mistakes"


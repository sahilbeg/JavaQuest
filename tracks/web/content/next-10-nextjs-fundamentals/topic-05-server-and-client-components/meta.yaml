ticket:
  key: NXT-1005
  from: maya
  title: "The home page should list the catalogue, with working Add to cart buttons"
  body: >
    The new home page should list every piece in the catalogue with its price. I tried putting a useState and an
    onClick straight into the page, and Next.js stopped with an error about client components. Could you build it
    properly? The list should be drawn on the server, and only the Add to cart button should run in the browser.
hints:
  - "A server component can be async. Write export default async function HomePage(), then const items = await getItems();"
  - "Draw one <li> per item: <h2>{item.name}</h2>, <p>{rupees(item.paise)}</p> and <AddToCartButton itemId={item.id} name={item.name} />, with key={item.id}."
  - "AddToCartButton.jsx must start with \"use client\";. Inside, const [count, setCount] = useState(0); the button adds 1, and when count > 0 a <p> says `${count} in your cart`."
review: true

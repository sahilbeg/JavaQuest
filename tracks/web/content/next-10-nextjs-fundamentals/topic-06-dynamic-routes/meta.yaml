ticket:
  key: NXT-1006
  from: sana
  title: "Shop by colour: one page per colour"
  body: >
    On Instagram, people keep asking "do you have this in Indigo?". I'd love pages like dhaaga.in/colours/indigo
    that show every piece in that colour, cheapest first when they ask. Five colours, one design. Please don't
    make five copies of the page! And dhaaga.in/colours/purple should say we don't have that, not crash.
hints:
  - "The folder [colour] makes params.colour. In Next.js 16, params is a Promise: const { colour: slug } = await params; then colourBySlug(slug), and notFound() if it's null."
  - "Filter the items whose colour equals colour.name. If (await searchParams).sort is \"price\", sort a copy by paise: [...list].sort((a, b) => a.paise - b.paise)."
  - "generateStaticParams returns COLOURS.map((c) => ({ colour: c.slug })). Each row is <li><Link href={`/items/${item.id}`}>{item.name}</Link> {rupees(item.paise)}</li>."
review: true

hints:
  - "Bronze: the browser has to be told how the letters in this file are stored. One line in <head> does it."
  - "Silver: browsers only look for that line near the very top of the file. Move it above the <title> and the long <style> block."
  - "Gold: write <html lang=\"en\">, and add <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> inside <head>."

ticket:
  key: WEB-0003
  from: sam
  title: "The coaster photo won't show on the test page"
  body: >
    Raju here. Mrs. Deshpande opened our test page and says the coaster photo is just a little broken icon.
    It's the same on my phone. Kavya says every browser has a hidden toolbox that shows why.
    Can you learn to use it and tell me what's wrong?
hints:
  - "Open the toolbox with Cmd+Option+I on a Mac, or F12 on Windows. Right-click and Inspect works too."
  - "Elements shows the page's HTML. Console shows messages and errors. Network shows every request and its status."
  - "A broken image is usually a 404 in the Network panel. Compare the file name asked for with the real file name."
review: true

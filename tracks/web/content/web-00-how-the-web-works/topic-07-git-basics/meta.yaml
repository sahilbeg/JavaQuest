  title: "Save points for the Dhaaga site"
  body: >
    Yesterday I changed the hours on the test page and broke the heading without noticing. I had no copy of the
    old version, so fixing it took an hour. From today, the Dhaaga site lives in Git. Learn the basics, so every
    change you make can be seen and undone.
hints:
  - "Git is a logbook for your folder. Each entry, called a commit, is a snapshot of your files with a message."
  - "Changes travel in three steps: you edit in the working folder, git add puts them on the tray, and git commit saves them."
  - "git status shows where your changes are. git log --oneline lists commits. git diff shows the lines that changed."
review: true

  title: "Get ready for the TypeScript loop"
  body: >
    Dhaaga is hiring two more frontend engineers for dhaaga.in, and you'll be on the interview panel soon.
    Before that, Arjun will run a mock TypeScript loop for you, so you know how it feels from the other chair.
    Brush up on the questions every TypeScript interview asks, and practise typing a function out loud.
hints:
  - "Know the classic pairs: type vs interface, any vs unknown vs never, and why { id, paise, name } fits where { id, paise } is expected."
  - "Generic questions are about keeping the link between input and output: function first<T>(items: readonly T[]): T | undefined."
  - "In a live round: ask questions, write the types first, try an example by hand, then code, then test the edges out loud."

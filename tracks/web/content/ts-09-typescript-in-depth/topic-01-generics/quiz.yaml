topic: ts-09-typescript-in-depth/topic-01-generics
drawCount: 6
passPercent: 80
questions:
  - id: q01
    type: mcq
    concept: type-parameters
    prompt: "What does <T> after a function's name declare?"
    choices:
      - "A type parameter: a placeholder for a type, filled in at each call"
      - "A variable called T that holds the first argument"
      - "A rule that the function only accepts text"
      - "A comment that TypeScript ignores"
    answer: 0
    explain: "<T> declares a type parameter. Each call fills it in, usually by inference from the arguments."
    reteach: "### Syntax: a generic function"

  - id: q02
    type: predict-output
    concept: generic-functions
    code: |
      function first<T>(list: T[]): T | undefined {
        return list[0];
      }
      console.log(first(["Indigo", "Mint"]));
      console.log(first([]));
    answer: "Indigo\nundefined"
    explain: "The first call returns the first string. An empty array has no element 0, so the second call gives undefined."
    reteach: "### Syntax: a generic function"

  - id: q03
    type: mcq
    concept: inference
    variants:
      - { prompt: "function first<T>(list: T[]): T | undefined. What type does const p = first([15000, 12000]); give p?", choices: ["number | undefined", "number", "any", "unknown"], answer: 0 }
      - { prompt: "function first<T>(list: T[]): T | undefined. What type does const c = first([\"CST\", \"KEY\"]); give c?", choices: ["string | undefined", "string", "any", "unknown"], answer: 0 }
    explain: "TypeScript infers T from the array's elements, and the return type is T | undefined."
    reteach: "### TypeScript fills in T for you"

  - id: q04
    type: fill-blank
    concept: type-parameters
    goal: "Declare a function that takes a list of one type and gives back an element of that same type."
    prompt: "function last___(list: T[]): T | undefined {"
    answers: ["<T>"]
    explain: "The type parameter goes in angle brackets between the name and the opening bracket."
    reteach: "### Syntax: a generic function"

  - id: q05
    type: mcq
    concept: any-vs-generics
    prompt: "Why is first(list: any[]): any worse than first<T>(list: T[]): T | undefined?"
    choices:
      - "With any, TypeScript stops checking what you do with the result, so typos go unnoticed"
      - "any makes the code run slower in the browser"
      - "any only works for arrays of numbers"
      - "There is no difference once the code runs, so neither is better"
    answer: 0
    explain: "any switches checking off. A type parameter keeps the element's type, so a typo in a field name is caught."
    reteach: "### The problem: one function, three copies"

  - id: q06
    type: spot-the-bug
    concept: type-parameters
    code: |
      function label<T>(value: T): string {
        if (T === "number") {
          return "a price";
        }
        return "something else";
      }
    bugLine: 2
    explain: "T is a type, and types are gone when the code runs. Check the value instead: typeof value === \"number\"."
    reteach: "## Common mistakes"

  - id: q07
    type: predict-output
    concept: generic-functions
    code: |
      function mapList<T, U>(list: T[], change: (item: T) => U): U[] {
        return list.map((item) => change(item));
      }
      const rupees = mapList([15000, 12000], (paise) => paise / 100);
      console.log(rupees.join(" and "));
    answer: "150 and 120"
    explain: "T is number and U is number. Each price in paise is divided by 100."
    reteach: "### Syntax: more than one type parameter"

  - id: q08
    type: mcq
    concept: generic-types
    prompt: "Which type is a Map from item ids (text) to stock counts (numbers)?"
    choices: ["Map<string, number>", "Map<number, string>", "Map[string, number]", "Map(string, number)"]
    answer: 0
    explain: "Map takes two type arguments in angle brackets: the key type, then the value type."
    reteach: "### Syntax: generic types"

  - id: q09
    type: fill-blank
    concept: generic-types
    goal: "Fill in the type argument so this shelf holds text."
    prompt: 'const keychains: Shelf___ = { name: "Keychains", things: ["Mint"] };'
    answers: ["<string>"]
    explain: "A generic type gets its type argument in angle brackets: Shelf<string> is a shelf whose things are strings."
    reteach: "### Syntax: generic types"

  - id: q10
    type: mcq
    concept: inference
    prompt: "When do you need to write the type argument yourself, as in first<number>([])?"
    choices:
      - "When there is nothing for TypeScript to infer T from, such as an empty array"
      - "Every time you call a generic function"
      - "Only when the function has two type parameters"
      - "Never: TypeScript refuses type arguments at a call"
    answer: 0
    explain: "Inference needs a value to look at. An empty array, or a function with no arguments, gives it nothing, so T would become unknown."
    reteach: "### Syntax: writing T yourself"

  - id: q11
    type: order
    concept: generic-functions
    prompt: "Put the lines in order to write countBy, which counts the elements of any list by a key."
    items:
      - "function countBy<T>(list: T[], keyOf: (item: T) => string) {"
      - "  const counts = new Map<string, number>();"
      - "  list.forEach((item) => counts.set(keyOf(item), (counts.get(keyOf(item)) ?? 0) + 1));"
      - "  return counts;"
      - "}"
    explain: "The type parameter comes first, then a typed Map, then the loop that fills it, and the Map is returned."
    reteach: "## Worked example"

  - id: q12
    type: mcq
    concept: any-vs-generics
    prompt: "first returns unknown instead of T. What happens at const price = first([15000]); price.toFixed(2);?"
    choices:
      - "An error: price is of type unknown, so you must check it before using it"
      - "It works, because unknown is the same as any"
      - "It works, because TypeScript remembers the number"
      - "It prints undefined"
    answer: 0
    explain: "unknown is safe but forgets the type. A type parameter would keep it, so price would be a number."
    reteach: "### Why not unknown?"

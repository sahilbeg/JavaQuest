ticket:
  key: TSX-0903
  from: sana
  title: "Three copies of the Item type, and they don't agree"
  body: >
    Sana here. The edit form, the product card and the new-item form each have their own copy of the Item type.
    Kavya renamed colour on Item last week, and the card's copy still says color, so the card shows nothing.
    Kavya says these types should be built from Item itself. Can you finish items.ts so the form, the card and the stock board all work?
hints:
  - "The types at the top are already built from Item. Partial makes every field optional, Pick keeps some fields, Omit drops some, and Record<Code, number> has one number per code."
  - "updateItem is one spread: { ...item, ...changes }. toCard builds a new object with exactly id, name and paise. createItem is { ...input, id: `DC-${nextNumber}` }."
  - "stockByCode: start with const totals: StockByCode = { CST: 0, KEY: 0, AMI: 0, BAG: 0, BTY: 0 }, then for each item do totals[item.code] += item.stock."
review: true

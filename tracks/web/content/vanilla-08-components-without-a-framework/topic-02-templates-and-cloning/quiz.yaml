topic: vanilla-08-components-without-a-framework/topic-02-templates-and-cloning
drawCount: 6
passPercent: 80
questions:
  - id: q01
    type: mcq
    concept: template-element
    prompt: "A page has <template id=\"product-card\"> holding an <li>. What does the customer see of it?"
    choices: ["Nothing: a template's content is not shown until code copies it onto the page", "One empty card", "The raw HTML as text", "One card, but greyed out"]
    answer: 0
    explain: "A template's markup is parsed and kept, but it isn't shown. Code clones it and puts the copy on the page."
    reteach: "### Syntax: the template element"

  - id: q02
    type: mcq
    concept: inert-content
    prompt: "A template holds <img src=\"photos/DC-1042.jpg\">. When does the browser download that photo?"
    choices: ["Only once a copy of it is put on the page", "As soon as the page loads", "Never, even after copying", "When the template is found with querySelector"]
    answer: 0
    explain: "Template content is inert: its images don't load and its scripts don't run until a copy joins the page."
    reteach: "### Syntax: the template element"

  - id: q03
    type: mcq
    concept: inert-content
    prompt: "The card <li class=\"product\"> exists only inside a <template>. What does document.querySelector(\".product\") return?"
    choices: ["null: the template's content isn't part of the page", "The li inside the template", "An empty DocumentFragment", "An error"]
    answer: 0
    explain: "querySelector searches the page, and a template's content is kept apart from it. Reach it through template.content."
    reteach: "### Syntax: the template element"

  - id: q04
    type: fill-blank
    concept: clone-node
    goal: "Make a deep copy of the template's markup, with every element inside it."
    prompt: "const copy = template.content.cloneNode(___);"
    answers: ["true"]
    explain: "cloneNode(true) copies the fragment and everything inside it. Without true, you get only an empty fragment."
    reteach: "### Syntax: cloning the content"

  - id: q05
    type: mcq
    concept: clone-node
    prompt: "What does template.content.cloneNode() give, with no argument?"
    choices: ["An empty DocumentFragment, so firstElementChild is null", "A full copy of the card", "The template element itself", "An error"]
    answer: 0
    explain: "Without true, cloneNode copies only the node itself, not its children. The fragment comes back empty."
    reteach: "## Common mistakes"

  - id: q06
    type: mcq
    concept: document-fragment
    prompt: "You append a filled DocumentFragment to the list. What is left in the fragment afterwards?"
    choices: ["Nothing: its children moved into the list", "The same children, now on the page twice", "A copy of the children", "The template"]
    answer: 0
    explain: "Appending a fragment moves its children to the new place, and the fragment is left empty."
    reteach: "### Fragments empty themselves"

  - id: q07
    type: mcq
    concept: document-fragment
    prompt: "Why does the lesson take firstElementChild from the clone?"
    choices: ["To hold the card's <li> itself, an element you can return, test and append, instead of a fragment that empties itself", "Because cloneNode only works on the first child", "To make the copy inert", "To make the copy deep"]
    answer: 0
    explain: "The fragment is only a box. firstElementChild gives the real card element to fill and return."
    reteach: "### Fill the copy, not the template"

  - id: q08
    type: spot-the-bug
    concept: fill-the-copy
    prompt: "Every card on the page ends up with the same name. Which line is wrong?"
    code: |
      function cardFromTemplate(template, product) {
        template.content.querySelector(".name").textContent = product.name;
        const card = template.content.cloneNode(true).firstElementChild;
        card.dataset.id = product.id;
        return card;
      }
    bugLine: 2
    explain: "It writes into the template instead of the copy. Clone first, then fill: card.querySelector(\".name\").textContent = product.name."
    reteach: "### Fill the copy, not the template"

  - id: q09
    type: mcq
    concept: fill-the-copy
    prompt: "card is a fresh clone, not yet on the page. Which line finds its price element?"
    choices: ["card.querySelector(\".price\")", "document.querySelector(\".price\")", "template.querySelector(\".price\")", "document.getElementById(\"price\")"]
    answer: 0
    explain: "The new card is detached, so searching the page can't find its parts. Search inside the card."
    reteach: "### Fill the copy, not the template"

  - id: q10
    type: predict-output
    concept: clone-node
    prompt: "Plain objects copy shallow or deep, like cloneNode() and cloneNode(true). What does this print?"
    code: |
      const blank = { name: "", tags: [] };
      const shallow = { ...blank };
      const deep = structuredClone(blank);
      deep.tags.push("Diwali");
      shallow.tags.push("Gift");
      console.log(blank.tags.join(","));
      console.log(deep.tags.join(","));
    answer: "Gift\nDiwali"
    explain: "The shallow copy shares its tags array with blank, so Gift lands in blank too. The deep copy has its own array, holding only Diwali."
    reteach: "## Try it"

  - id: q11
    type: mcq
    concept: template-element
    prompt: "Sana edits the card's markup every week, and the shape barely depends on the data. Which fits best?"
    choices: ["A <template> in the page, cloned and filled by the code", "An h() call that she edits in JavaScript", "A string of HTML set with innerHTML", "One hand-written card per product"]
    answer: 0
    explain: "A template keeps mostly fixed markup in the page, readable and editable as HTML."
    reteach: "### Template or h?"

  - id: q12
    type: order
    concept: fill-the-copy
    prompt: "Put the steps for drawing one card from a template in order."
    items:
      - "Find the template once with document.querySelector"
      - "Clone its content with cloneNode(true)"
      - "Take the copy's firstElementChild"
      - "Fill the parts with textContent"
      - "Put the card on the page"
    explain: "Find, copy, take the card, fill it while detached, then put it on the page."
    reteach: "## Worked example"

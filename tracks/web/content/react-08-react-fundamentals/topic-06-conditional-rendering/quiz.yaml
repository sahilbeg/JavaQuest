topic: react-08-react-fundamentals/topic-06-conditional-rendering
drawCount: 6
passPercent: 80
questions:
  - id: q01
    type: mcq
    concept: return-null
    prompt: "What does a component show when it returns null?"
    choices:
      - "Nothing at all"
      - "The word null"
      - "An empty box with a border"
      - "An error message"
    answer: 0
    explain: "Returning null tells React to draw nothing for that component."
    reteach: "### Returning null shows nothing"

  - id: q02
    type: order
    concept: early-return
    prompt: "Put the lines in order: a note that shows nothing for an empty cart."
    items:
      - "function DeliveryNote({ totalPaise }) {"
      - "  if (totalPaise === 0) {"
      - "    return null;"
      - "  }"
      - "  return <p>Delivery inside Pune: ₹60.00</p>;"
      - "}"
    explain: "The early return comes first. The last return runs only when the cart is not empty."
    reteach: "### Syntax: an early return"

  - id: q03
    type: mcq
    concept: early-return
    prompt: "Why can't you write {if (stock > 0) { ... }} inside JSX?"
    choices:
      - "if is a statement, and curly braces only take values"
      - "React does not allow conditions at all"
      - "if only works with strings"
      - "It works, but only inside a fragment"
    answer: 0
    explain: "Curly braces take expressions. Use a ternary inside them, or an if before the return."
    reteach: "### Syntax: the ternary in JSX"

  - id: q04
    type: fill-blank
    concept: ternary
    goal: "Show the Notify me button when the item is out of stock, completing the two-way choice."
    prompt: "{stock > 0 ? <button type=\"button\">Add to cart</button> ___ <button type=\"button\">Notify me</button>}"
    answers: [":"]
    explain: "A ternary is condition ? first : second. The colon separates the two choices."
    reteach: "### Syntax: the ternary in JSX"

  - id: q05
    type: mcq
    concept: ternary
    prompt: "Which line shows Sold out when stock is 0, and the price otherwise?"
    choices:
      - "{stock === 0 ? \"Sold out\" : rupees(paise)}"
      - "{stock === 0 && \"Sold out\" || rupees(paise) && \"Sold out\"}"
      - "{if (stock === 0) \"Sold out\" else rupees(paise)}"
      - "{stock === 0 ? \"Sold out\"}"
    answer: 0
    explain: "A ternary picks one of two values. The others are a muddle, an if inside braces, or a ternary with no second part."
    reteach: "### Syntax: the ternary in JSX"

  - id: q06
    type: predict-output
    concept: logical-and
    code: |
      const giftWrap = true;
      const noteForGolu = false;
      console.log(giftWrap && "Gift wrap available");
      console.log(noteForGolu && "Name stitched on");
    answer: "Gift wrap available\nfalse"
    explain: "When the left side is true, && gives the right side. When it is false, && gives false, and React would draw nothing."
    reteach: "### Syntax: && for \"this or nothing\""

  - id: q07
    type: mcq
    concept: logical-and
    prompt: "Which of these values does React draw on the page?"
    choices:
      - "0"
      - "false"
      - "null"
      - "undefined"
    answer: 0
    explain: "React draws numbers and text, including 0. It skips false, true, null and undefined."
    reteach: "### Syntax: && for \"this or nothing\""

  - id: q08
    type: predict-output
    concept: zero-trap
    code: |
      const stock = 0;
      console.log(stock && "In stock");
      console.log(stock > 0 && "In stock");
    answer: "0\nfalse"
    explain: "0 is falsy, so && gives back the 0 itself. Comparing first gives a real false, which React skips."
    reteach: "### The 0 trap"

  - id: q09
    type: spot-the-bug
    concept: zero-trap
    prompt: "When Golu sells out, the card shows a stray 0. Which line causes it?"
    code: |
      function ItemCard({ name, stock }) {
        return (
          <article>
            <h3>{name}</h3>
            {stock && <p>In stock</p>}
          </article>
        );
      }
    bugLine: 5
    explain: "0 && ... gives 0, and React draws numbers. Write {stock > 0 && <p>In stock</p>}."
    reteach: "### The 0 trap"

  - id: q10
    type: mcq
    concept: zero-trap
    prompt: "count holds how many items are in the cart. Which line safely shows the badge only when count is more than 0?"
    choices:
      - "{count > 0 && <span className=\"badge\">{count}</span>}"
      - "{count && <span className=\"badge\">{count}</span>}"
      - "{count || <span className=\"badge\">{count}</span>}"
      - "{<span className=\"badge\">{count}</span> && count}"
    answer: 0
    explain: "count > 0 is a real true or false. With count on its own, an empty cart would show 0."
    reteach: "### The 0 trap"

  - id: q11
    type: mcq
    concept: return-null
    prompt: "StockBadge returns null when stock is 10. What happens to ItemCard, which shows <StockBadge stock={10} />?"
    choices:
      - "The card shows as normal, just with no badge"
      - "The whole card disappears"
      - "The card shows the text null"
      - "React throws an error"
    answer: 0
    explain: "null only means the badge itself draws nothing. The rest of the card is unaffected."
    reteach: "### Returning null shows nothing"

  - id: q12
    type: predict-output
    concept: ternary
    code: |
      function deliveryLabel(totalPaise) {
        if (totalPaise === 0) return "none";
        return totalPaise > 99900 ? "free" : "₹60.00";
      }
      console.log(deliveryLabel(0));
      console.log(deliveryLabel(99900));
      console.log(deliveryLabel(104900));
    answer: "none\n₹60.00\nfree"
    explain: "An empty cart returns early. ₹999 exactly is not above ₹999, so it pays ₹60. ₹1,049 is free."
    reteach: "## Worked example"

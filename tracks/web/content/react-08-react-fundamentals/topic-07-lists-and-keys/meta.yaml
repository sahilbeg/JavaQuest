ticket:
  key: WEB-0807
  from: maya
  title: "Draw the catalogue from the product data"
  body: >
    Meera Aunty adds new items every week, and someone has to hand-write a card for each one. Let's draw the
    list straight from the product data instead. She also wants a "Gifts under ₹500" shelf for Rakhi, cheapest
    first. Keep the console clean: no key warnings.
hints:
  - "Turn the array into elements with map: {products.map((p) => <li key={p.id}>...</li>)}. The key goes on the outermost element the map returns."
  - "Use the product's id as the key. It is unique and never changes, unlike its position in the list."
  - "In GiftsUnder, filter first, then sort a copy: [...products].filter(...) or products.filter(...) already makes a new array, then .sort((a, b) => a.paise - b.paise)."
review: true

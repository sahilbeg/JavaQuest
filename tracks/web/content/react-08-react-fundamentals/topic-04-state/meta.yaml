ticket:
  key: WEB-0804
  from: sam
  title: "The + button on the quantity picker does nothing"
  body: >
    Raju here. Mrs. Bhosale from Kothrud wanted three Marigold coaster sets for her daughter's wedding,
    but the + button on the item page never moves past 1. She ordered on WhatsApp in the end. Can you make
    the picker count up and down, and show the right price for the quantity?
hints:
  - "A plain let variable starts again at 1 every time React calls the component, and changing it does not tell React to redraw."
  - "Write const [qty, setQty] = useState(1); at the top of the component. Then the buttons call setQty(qty + 1) and setQty(qty - 1)."
  - "Disable with disabled={qty === 1} on the minus button and disabled={qty === stock} on the plus button. The total is rupees(paise * qty)."
review: true

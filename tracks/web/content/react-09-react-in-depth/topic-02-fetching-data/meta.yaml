ticket:
  key: WEB-0902
  from: sam
  title: "The order status page says Loading forever"
  body: >
    Raju here. Mrs. Deshpande ordered baby booties for her granddaughter, and she calls every day to ask
    whether order-17 has shipped. We made her an order status page, but it only ever says "Loading order-17...".
    Can it show what the server says, and a clear message when an order doesn't exist?
hints:
  - "Fetching is a side effect, so it goes in useEffect. Put an async function inside the effect and call it, because the effect itself can't be async."
  - "Check res.ok before reading the JSON. Wrap the request in try/catch, and set the error text in the catch."
  - "List [orderId] as the dependency. Start the effect with let ignore = false, only call setOrder when !ignore, and return () => { ignore = true; }."
review: true

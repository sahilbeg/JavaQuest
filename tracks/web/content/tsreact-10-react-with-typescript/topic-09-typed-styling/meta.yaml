ticket:
  key: TSX-1009
  from: sana
  title: "Every button on the site is styled by hand"
  body: >
    Sana here. I count eleven different blues on dhaaga.in buttons, and someone typed "btn--primay" last week. I'd
    like one Button with a small set of variants and sizes, and the yarn swatches drawn in our exact colours. If
    TypeScript can refuse a variant I never designed, even better.
hints:
  - 'Destructure with defaults: { variant = "primary", size = "md", className, type = "button", ...rest }. rest holds children, onClick, disabled and everything else.'
  - 'Build the classes as ["btn", `btn--${variant}`, `btn--${size}`, className].filter(Boolean).join(" "), then return <button type={type} className={classes} {...rest} />.'
  - "For the swatch, write const style: CSSProperties = { backgroundColor: SWATCH_HEX[colour], width: size, height: size }; and pass style={style}. React adds px to the numbers."
review: true

ticket:
  key: TSX-1004
  from: sam
  title: "The counter screen ignores Enter"
  body: >
    Raju here. On Sunday the stall queue went past the chai stall. On the new counter screen I type an item code like
    "ami" and press Enter, and nothing happens. I have to type capitals and tap Add every single time. Can you make it
    take Enter, accept small letters, and tell me when I mistype a code?
hints:
  - "Write function handleChange(e: ChangeEvent<HTMLInputElement>) that calls setText(e.target.value.toUpperCase()). Use it as the input's onChange."
  - 'Write function handleKeyDown(e: KeyboardEvent<HTMLInputElement>) that runs addTyped() when e.key === "Enter", and give the input onKeyDown={handleKeyDown}.'
  - 'In addTyped, trim the text. Empty: "Type a code first". isItemCode(code): call onAdd(code), set "Added " + ITEM_NAMES[code] and setText(""). Otherwise: "Unknown code: " + code.'
review: true

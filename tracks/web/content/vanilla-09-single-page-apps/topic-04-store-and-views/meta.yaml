ticket:
  key: VAN-0904
  from: maya
  title: "The cart badge says 0 on the item page"
  body: >
    Now that screens come and go, each one keeps its own copy of the cart. Add Golu on his item page,
    and the header badge still says 0 until you open the cart screen.
    Let's keep the cart in the one store, and make the badge follow it, redrawing only when the count really changes.
hints:
  - "Never change the old state. Return { ...state, lines: newLines }, and build newLines with map, filter or [...state.lines, newLine]."
  - "watch keeps the last selected value in a variable. In its subscribe listener, select again and call onChange only when next !== last."
  - "mountCartBadge is one line: return watch(store, itemCount, (count) => { el.textContent = String(count); });"
review: true

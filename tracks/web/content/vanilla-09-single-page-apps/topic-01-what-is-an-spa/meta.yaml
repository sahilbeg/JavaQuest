ticket:
  key: VAN-0901
  from: maya
  title: "Before we turn dhaaga.in into an app"
  body: >
    Every tap on dhaaga.in loads a whole new page, so the cart badge blinks and the header redraws on Meera Aunty's old phone.
    We're going to make the store a single-page app, with plain JavaScript and no framework.
    Read the KB page on what that changes, good and bad, and pass the onboarding check before we start on the router.
hints:
  - "Ask yourself what the browser asks the server for. A whole new HTML page, or only some data?"
  - "The app shell is the part that stays put on every screen. Only the outlet in the middle changes."
  - "A single-page app must still change the URL for every screen. Otherwise Back, refresh and shared links all break."
review: true

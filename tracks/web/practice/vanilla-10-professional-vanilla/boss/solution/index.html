<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock loop | Dhaaga &amp; Co.</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main>
    <h1>The mock interview loop</h1>

    <section aria-labelledby="round-1">
      <h2 id="round-1">Round 1: promiseAll</h2>
      <pre id="all-result"></pre>
    </section>

    <section aria-labelledby="round-2">
      <h2 id="round-2">Round 2: rate Golu the elephant</h2>
      <div id="rating"></div>
      <p id="rating-status" role="status"></p>
    </section>

    <section aria-labelledby="round-3">
      <h2 id="round-3">Round 3: the stock cache</h2>
      <button id="ask" type="button">Ask for Golu's stock</button>
      <p id="cache-status" role="status"></p>
    </section>
  </main>
</body>
</html>

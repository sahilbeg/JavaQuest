<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golu the elephant | Dhaaga &amp; Co.</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #FAF7F0; color: #2E3A8C; margin: 1rem; max-width: 36rem; }
    .tabs__list { display: flex; gap: 0.25rem; border-bottom: 2px solid #2E3A8C; }
    .tabs__list button { font: inherit; background: none; border: 0; padding: 0.5rem 1rem; color: inherit; border-bottom: 3px solid transparent; }
    .tabs__list button.is-selected,
    .tabs__list [aria-selected="true"] { border-bottom-color: #F2A81D; font-weight: 700; }
    section { padding: 1rem 0; }
  </style>
  <script type="module" src="main.js"></script>
</head>
<body>
  <h1>Golu the elephant</h1>
  <p>₹450.00</p>
  <div class="tabs" id="item-tabs">
    <div class="tabs__list" aria-label="About Golu the elephant">
      <button type="button" id="tab-details" data-panel="panel-details">Details</button>
      <button type="button" id="tab-care" data-panel="panel-care">Care</button>
      <button type="button" id="tab-delivery" data-panel="panel-delivery">Delivery</button>
    </div>
    <section id="panel-details"><p>Crocheted in Indigo cotton, about 15 cm tall. Modelled on Golu, who sits on our counter.</p></section>
    <section id="panel-care"><p>Hand wash in cold water and dry flat in the shade.</p></section>
    <section id="panel-delivery"><p>₹60 inside Pune, free on orders above ₹999.</p></section>
  </div>
</body>
</html>

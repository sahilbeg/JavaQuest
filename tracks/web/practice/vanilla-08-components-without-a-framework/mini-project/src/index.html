<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue | Dhaaga &amp; Co.</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #FAF7F0; color: #2E3A8C; margin: 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; }
    cart-count { background: #F2A81D; border-radius: 999px; padding: 0.25rem 0.75rem; }
    #catalogue { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); margin-top: 1rem; }
    button { font: inherit; }
  </style>
  <script type="module" src="main.js"></script>
</head>
<body>
  <header>
    <h1>Dhaaga &amp; Co.</h1>
    <span id="count-spot"></span>
  </header>
  <button type="button" id="refresh">Refresh stock</button>
  <div id="catalogue"></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue | Dhaaga &amp; Co.</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #FAF7F0; color: #2E3A8C; margin: 1rem; }
    .products { list-style: none; padding: 0; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }
    .product { background: #fff; border: 2px solid #2E3A8C; border-radius: 12px; padding: 1rem; }
    .product h3 { margin: 0 0 0.25rem; }
    .add { background: #F2A81D; border: 0; border-radius: 8px; padding: 0.5rem 1rem; font: inherit; }
    .sold-out { opacity: 0.6; }
  </style>
  <script type="module" src="main.js"></script>
</head>
<body>
  <h1>Dhaaga &amp; Co.</h1>
  <div id="catalogue"></div>
  <p id="status" role="status"></p>
</body>
</html>

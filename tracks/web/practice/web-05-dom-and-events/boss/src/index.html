<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diwali sale | Dhaaga &amp; Co.</title>
  <script type="module" src="main.js"></script>
</head>
<body>
  <main id="app">
    <h1>Dhaaga &amp; Co. Diwali sale</h1>
    <ul id="products">
      <li class="product" data-id="DC-1042">
        <h3>Golu the elephant</h3>
        <p class="price">₹450.00</p>
        <button class="add" type="button">Add to cart</button>
      </li>
      <li class="product" data-id="DC-1001">
        <h3>Marigold coaster set</h3>
        <p class="price">₹150.00</p>
        <button class="add" type="button">Add to cart</button>
      </li>
      <li class="product" data-id="DC-1013">
        <h3>Rani pink keychain</h3>
        <p class="price">₹120.00</p>
        <button class="add" type="button">Add to cart</button>
      </li>
    </ul>

    <section id="cart">
      <h2>Your cart</h2>
      <ul id="cart-lines"></ul>
      <p id="cart-empty">Your cart is empty.</p>
      <p>Total: <strong id="cart-total">₹0.00</strong></p>
      <p><small>Reload this preview: your cart should still be here.</small></p>
    </section>
  </main>
</body>
</html>

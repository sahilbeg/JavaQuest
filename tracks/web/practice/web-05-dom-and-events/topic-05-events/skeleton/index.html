<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rani pink keychain | Dhaaga &amp; Co.</title>
  <script type="module" src="main.js"></script>
</head>
<body>
  <h1>Rani pink keychain</h1>
  <p>₹120.00, crocheted by hand in Pune.</p>

  <div class="stepper">
    <button class="minus" type="button" aria-label="One less">−</button>
    <span class="qty">1</span>
    <button class="plus" type="button" aria-label="One more">+</button>
  </div>

  <label>Gift note (press Escape to clear) <input id="note" type="text"></label>

  <button id="add" type="button">Add to cart</button>
  <p id="status" role="status"></p>
</body>
</html>

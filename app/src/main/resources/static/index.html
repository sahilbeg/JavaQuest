<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>JavaQuest</title>
  <meta name="description" content="JavaQuest: learn Java from zero to professional as an intern at Spoke, with short animated lessons, real code checks and a friendly owl.">
  <link rel="preload" href="/vendor/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Dark first: the light theme is one click away and remembered.
    document.documentElement.dataset.theme = (() => { try { return localStorage.getItem("jq-theme") === "light" ? "light" : "dark"; } catch { return "dark"; } })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="wordmark" href="#/" aria-label="JavaQuest home">
      <span id="wordmark-byte"></span>
      <span class="wordmark-name">Java<em>Quest</em></span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="#/" data-nav="journey"><svg class="icon" aria-hidden="true"><use href="/vendor/icons/icons.svg#i-map"/></svg><span>Course</span></a>
      <a href="#/career" data-nav="career"><svg class="icon" aria-hidden="true"><use href="/vendor/icons/icons.svg#i-sparkles"/></svg><span>Career</span></a>
    </nav>
    <span id="daily-limit-slot"></span>
    <div class="topbar-end">
      <span id="career-chip"></span>
      <button type="button" class="icon-button" id="tour-button" aria-label="Show me around this page">
        <svg class="icon" aria-hidden="true"><use href="/vendor/icons/icons.svg#i-circle-help"/></svg>
      </button>
      <button type="button" class="icon-button theme-toggle" id="theme-toggle" aria-label="Switch theme">
        <svg class="icon icon-sun" aria-hidden="true"><use href="/vendor/icons/icons.svg#i-sun"/></svg>
        <svg class="icon icon-moon" aria-hidden="true"><use href="/vendor/icons/icons.svg#i-moon"/></svg>
      </button>
    </div>
  </header>
  <p class="author-banner" id="author-banner" hidden>Author mode: every ticket is open. Learners get them one at a time.</p>
  <p class="connection-banner" id="connection" role="alert" hidden>
    Lost the connection to JavaQuest. Is <code>./run.sh</code> still running in your terminal? This page reconnects on its own.
  </p>
  <main id="view" tabindex="-1"></main>
  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>

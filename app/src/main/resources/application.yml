server:
  address: 127.0.0.1
  port: 2026

spring:
  application:
    name: javaquest
  main:
    banner-mode: off
  # App files change with every build: browsers always check for a newer copy (a cheap 304 when unchanged),
  # so a new icon, script or style shows up after a restart instead of an old cached one.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  datasource:
    url: jdbc:h2:file:${javaquest.data-dir}/progress
    username: sa
    password: ""

javaquest:
  root: .
  data-dir: ${user.home}/.javaquest
  unlock-all: false
  runner:
    timeout: 10s
    heap-megabytes: 256
    max-output-bytes: 65536
    classpath-file: practice/target/runner-classpath.txt

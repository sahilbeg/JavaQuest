server:
  address: 127.0.0.1
  port: 2026

spring:
  application:
    name: javaquest
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:file:${javaquest.data-dir}/progress
    username: sa
    password: ""

javaquest:
  root: .
  data-dir: ${user.home}/.javaquest
  unlock-all: false
  runner:
    timeout: 10s
    heap-megabytes: 256
    max-output-bytes: 65536
    classpath-file: practice/target/runner-classpath.txt

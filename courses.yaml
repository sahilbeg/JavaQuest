      - { id: web-06-async-javascript, title: Async JavaScript }
      - { id: web-07-tooling, title: Tooling }
      - { id: react-08-react-fundamentals, title: React fundamentals }
      - { id: react-09-react-in-depth, title: React in depth }
      - { id: next-10-nextjs-fundamentals, title: Next.js fundamentals }

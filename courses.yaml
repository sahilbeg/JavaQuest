# Every course a learner can pick. See content-model/.../CourseLibrary.java.
# A pool is a content folder. A course is either a whole pool (the Java course) or a list of modules from pools.
# Planned modules are listed before they are written, so the learner sees the whole path.
# Courses appear on the picker in this order, so list each goal's stacks in the order they are best studied.

pools:
  - id: java
    content: content
    practice: practice
  - id: web
    content: tracks/web/content
    practice: tracks/web/practice

objectives:
  - id: software-engineering
    title: "Software engineer"
    summary: "Programming from zero to a professional engineer, with one language all the way through."
  - id: frontend
    title: "Frontend developer"
    summary: "Build what people see and use in the browser, from the first web page to a full online store."
  - id: backend
    title: "Backend developer"
    summary: "Build the servers, APIs and databases behind apps."
  - id: fullstack
    title: "Full-stack developer"
    summary: "Build both sides of a web app, the browser and the server."

courses:
  - id: java-swe
    objective: software-engineering
    title: "Software engineering in Java"
    summary: "Java from your first program to Spring Boot, architecture, DevOps and data."
    stack: [Java, Spring Boot, SQL, Docker]
    status: ready
    pool: java
    ladder: [Intern, Junior Developer, Developer, Software Engineer, Senior Engineer, Staff Engineer, Architect, Principal Engineer]

  - id: frontend-vanilla
    objective: frontend
    title: "Frontend with plain JavaScript"
    summary: "Start here. HTML, CSS and JavaScript with no framework, all the way to a fast, accessible store."
    stack: [HTML, CSS, JavaScript]
    status: ready
    modules:
      - { id: web-00-how-the-web-works, title: How the web works }
      - { id: web-01-html, title: HTML }
      - { id: web-02-css, title: CSS }
      - { id: web-03-javascript-basics, title: JavaScript basics }
      - { id: web-04-javascript-in-depth, title: JavaScript in depth }
      - { id: web-05-dom-and-events, title: The DOM and events }
      - { id: web-06-async-javascript, title: Async JavaScript }
      - { id: web-07-tooling, title: Tooling }
      - { id: vanilla-08-components-without-a-framework, title: Components without a framework }
      - { id: vanilla-09-single-page-apps, title: Single-page apps }
      - { id: vanilla-10-professional-vanilla, title: Professional frontend without a framework }
    ladder: [Frontend Intern, Junior Frontend Developer, Frontend Developer, Frontend Engineer, Senior Frontend Engineer, Staff Frontend Engineer, Frontend Architect, Principal Frontend Engineer]

  - id: frontend-react
    objective: frontend
    title: "Frontend with JavaScript and React"
    summary: "Next step: the same web basics, then React, until you launch Dhaaga's online store."
    stack: [HTML, CSS, JavaScript, React]
    status: ready
    modules:
      - { id: web-00-how-the-web-works, title: How the web works }
      - { id: web-01-html, title: HTML }
      - { id: web-02-css, title: CSS }
      - { id: web-03-javascript-basics, title: JavaScript basics }
      - { id: web-04-javascript-in-depth, title: JavaScript in depth }
      - { id: web-05-dom-and-events, title: The DOM and events }
      - { id: web-06-async-javascript, title: Async JavaScript }
      - { id: web-07-tooling, title: Tooling }
      - { id: react-08-react-fundamentals, title: React fundamentals }
      - { id: react-09-react-in-depth, title: React in depth }
      - { id: react-10-professional-frontend, title: Professional frontend }
    ladder: [Frontend Intern, Junior Frontend Developer, Frontend Developer, Frontend Engineer, Senior Frontend Engineer, Staff Frontend Engineer, Frontend Architect, Principal Frontend Engineer]

  - id: frontend-react-ts
    objective: frontend
    title: "Frontend with TypeScript and React"
    summary: "After React: the React course with TypeScript's types from the start."
    stack: [HTML, CSS, TypeScript, React]
    status: ready
    modules:
      - { id: web-00-how-the-web-works, title: How the web works }
      - { id: web-01-html, title: HTML }
      - { id: web-02-css, title: CSS }
      - { id: web-03-javascript-basics, title: JavaScript basics }
      - { id: web-04-javascript-in-depth, title: JavaScript in depth }
      - { id: web-05-dom-and-events, title: The DOM and events }
      - { id: web-06-async-javascript, title: Async JavaScript }
      - { id: web-07-tooling, title: Tooling }
      - { id: ts-08-typescript-basics, title: TypeScript basics }
      - { id: ts-09-typescript-in-depth, title: TypeScript in depth }
      - { id: tsreact-10-react-with-typescript, title: React with TypeScript }
      - { id: tsreact-11-typed-react-in-depth, title: Typed React in depth }
      - { id: tsreact-12-professional-typescript, title: Professional TypeScript }
    ladder: [Frontend Intern, Junior Frontend Developer, Frontend Developer, Frontend Engineer, Senior Frontend Engineer, Staff Frontend Engineer, Frontend Architect, Principal Frontend Engineer]

  - id: frontend-next
    objective: frontend
    title: "Frontend with Next.js"
    summary: "After React: React with Next.js routing, server rendering and deployment."
    stack: [HTML, CSS, JavaScript, React, Next.js]
    status: ready
    modules:
      - { id: web-00-how-the-web-works, title: How the web works }

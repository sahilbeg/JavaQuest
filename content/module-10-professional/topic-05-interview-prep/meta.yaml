  title: "Your full-time loop is next week"
  body: >
    Good news: Spoke wants to turn your internship into a full-time SDE 2 offer.
    You still go through the full interview loop, like any outside candidate: two coding rounds, a design round for classes, a system design round and a behavioural round.
    It is next week. I booked you a mock coding round with three problems, so you can practise thinking out loud against a clock.
    Treat it like the real thing.
hints:
  - "Before you code, say the brute force and its cost. Then ask what is already sorted, what repeats, and what only moves forward in time."
  - "RideTimeline: each bike's list is sorted by time, so binary search for the last sighting at or before the second. RentalCounter: bucket second % 300 holds one second; reset it when it holds an older second, and count a bucket only while second - bucketSecond < 300."
  - "GroupBooking: keep a stack of hour indexes with rising free bikes. When hour i has no more bikes than the top, pop the top. Its block runs from just after the new top (or -1) to just before i, worth (long) bikes * (i - left - 1)."
review: true

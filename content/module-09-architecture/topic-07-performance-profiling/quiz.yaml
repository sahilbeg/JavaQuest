topic: module-09-architecture/topic-07-performance-profiling
drawCount: 6
passPercent: 80
questions:
  - id: q01
    type: order
    concept: measure-first
    prompt: "Put the steps of performance work in order."
    items:
      - "Measure the symptom, such as p99 = 5 s"
      - "Profile to find where the time goes"
      - "Fix that one hotspot"
      - "Measure again, the same way"
    explain: "Measure, profile, fix, measure again. Skipping the profile means fixing a guess, and skipping the second measurement means you never know if it helped."
    reteach: "### Measure before you optimise"

  - id: q02
    type: predict-output
    concept: percentiles
    prompt: "Nearest rank: sort, rank = percent × n / 100 rounded up, counting from 1. What does this print?"
    code: |
      import java.util.Arrays;

      public class Main {
          public static void main(String[] args) {
              long[] millis = {30, 10, 50, 20, 40};
              long[] sorted = Arrays.copyOf(millis, millis.length);
              Arrays.sort(sorted);
              long rank = Math.ceilDiv(70L * sorted.length, 100L);
              System.out.println(sorted[(int) rank - 1]);
          }
      }
    answer: "40"
    explain: "Sorted: 10 20 30 40 50. 70 × 5 / 100 = 3.5, which rounds up to rank 4. The 4th value is 40."
    reteach: "### Percentiles: p50, p95, p99, p99.9"

  - id: q03
    type: mcq
    concept: percentiles
    variants:
      - { prompt: "98 requests took 100 ms and 2 took 5,000 ms. Which number shows what the unluckiest riders felt?", choices: ["p99: 5,000 ms", "The average: 198 ms", "p50: 100 ms", "p95: 100 ms"], answer: 0 }
      - { prompt: "Why do teams report p99 instead of the average?", choices: ["The average blends a few very slow requests into many fast ones, so it describes nobody", "p99 is cheaper to compute than an average", "Averages cannot be computed for times in milliseconds", "p99 is always lower than the average, so targets are easier to meet"], answer: 0 }
    explain: "An average adds everything up and divides, so a few huge values vanish into many small ones. p50 shows the typical rider and p99 the unlucky one."
    reteach: "### Why averages lie"

  - id: q04
    type: mcq
    concept: percentiles
    variants:
      - { prompt: "A page calls 100 backends at once and waits for all of them. Each is slow 1% of the time. Roughly how often is the page slow?", choices: ["About 63% of the time, since 1 − 0.99¹⁰⁰ ≈ 0.63", "1% of the time, the same as each backend", "100% of the time", "0.01% of the time, since the chances multiply"], answer: 0 }
      - { prompt: "A screen calls 10 backends at once. Each is slow 1% of the time. Roughly how often is the screen slow?", choices: ["About 10% of the time, since 1 − 0.99¹⁰ ≈ 0.096", "1% of the time", "0.1% of the time", "Never, because the calls run in parallel"], answer: 0 }
    explain: "A fan-out request waits for its slowest call. The chance that at least one of n calls is slow is 1 − 0.99ⁿ, so a rare tail on each backend becomes common for the page."
    reteach: "### Tail latency grows with fan-out"

  - id: q05
    type: fill-blank
    concept: capacity-math
    goal: "Work out how many requests are in the system at once, on average."
    prompt: "L = 40 requests/s × 0.18 s = ___ requests in flight"
    answers: ["7.2"]
    explain: "Little's law: L = λ × W. 40 requests a second, each in the system for 0.18 s, means 7.2 in flight on average. On 8 threads that is 90% busy."
    reteach: "### Little's law: how many are in flight"

  - id: q06
    type: mcq
    concept: capacity-math
    variants:
      - { prompt: "Serving takes 50 ms. Using time = S / (1 − busy), what happens when a server goes from 90% to 99% busy?", choices: ["Requests take about ten times longer: 500 ms becomes 5,000 ms", "Requests take 9% longer", "Nothing, until it reaches 100%", "Requests get faster, since the server is warmed up"], answer: 0 }
      - { prompt: "Why do teams plan for 60-70% utilisation at peak instead of 95%?", choices: ["Near 100% busy there is no slack for bursts, so queues and latency grow very fast", "Servers overheat above 70%", "Java cannot use more than 70% of a CPU", "Utilisation above 70% cannot be measured"], answer: 0 }
    explain: "Requests arrive in bursts. Time in the system grows like S / (1 − busy), the hockey stick, so going from 90% to 99% busy makes requests ten times slower. Headroom keeps p99 sane."
    reteach: "### Why latency explodes near 100% busy"

  - id: q07
    type: mcq
    concept: capacity-math
    variants:
      - { prompt: "90% of a job can run in parallel. With unlimited cores, what is the most it can speed up?", choices: ["10 times, because the serial 10% still takes its full time", "Unlimited, if you add enough cores", "90 times", "2 times"], answer: 0 }
      - { prompt: "A job is 90% parallel. Roughly how much faster is it on 8 cores than on 1?", choices: ["About 4.7 times", "8 times", "7.2 times", "0.9 times"], answer: 0 }
    explain: "Amdahl's law: speedup = 1 / ((1 − p) + p / n). With p = 0.9: 8 cores give 1 / 0.2125 ≈ 4.7, and infinite cores give 1 / 0.1 = 10."
    reteach: "### Amdahl's law: the part you cannot split"

  - id: q08
    type: mcq
    concept: profiling
    variants:
      - { prompt: "In a flame graph, what does the width of a box show?", choices: ["How much of the time was spent in that method and the methods it called", "The order in which methods ran", "How many lines of code the method has", "How much memory the method uses"], answer: 0 }
      - { prompt: "In a flame graph, which box points most directly at the code burning the time?", choices: ["A wide box with nothing on top of it", "The narrowest box at the very top", "The box at the bottom, Thread.run", "The box with the brightest colour"], answer: 0 }
    explain: "Width is the share of samples, so the share of time. Colours and left-to-right order mean nothing. A wide plateau, with nothing above it, is a method that spends the time itself."
    reteach: "### Reading a flame graph"

  - id: q09
    type: mcq
    concept: profiling
    variants:
      - { prompt: "CPU use is 5%, but most threads in the thread dump are BLOCKED on the same monitor. What kind of slow is this?", choices: ["Lock contention: threads wait for one lock", "CPU-bound: the processor is too slow", "A memory leak", "JIT warm-up"], answer: 0 }
      - { prompt: "CPU is near 100%, and every thread dump shows threads RUNNABLE inside the same loop. What kind of slow is this?", choices: ["CPU-bound: fix the algorithm or data structure", "I/O-bound: add more threads", "Lock contention", "Network latency"], answer: 0 }
      - { prompt: "CPU is low and threads wait on database calls. Which change is most likely to help?", choices: ["Fewer round trips, such as one query instead of one per row", "A faster CPU", "Rewriting the loop with bit shifts", "Removing all logging"], answer: 0 }
    explain: "Find out what slow code is doing before you fix it. Busy CPU means CPU-bound, waiting on the network or disk means I/O-bound, and BLOCKED threads mean a hot lock."
    reteach: "### CPU-bound, I/O-bound or waiting on a lock"

  - id: q10
    type: spot-the-bug
    concept: benchmarking
    prompt: "This tries to time Math.sqrt. Which line lets the JIT delete the very work being timed?"
    code: |
      long start = System.nanoTime();
      for (int i = 0; i < 1_000_000; i++) {
          Math.sqrt(i);
      }
      long took = System.nanoTime() - start;
      System.out.println(took + " ns");
    bugLine: 3
    explain: "The result of Math.sqrt is never used, so the JIT may remove the call: dead-code elimination. In JMH, return the result or pass it to Blackhole.consume."
    reteach: "### Microbenchmarks lie"

  - id: q11
    type: mcq
    concept: benchmarking
    variants:
      - { prompt: "A load tester waits for each answer before sending the next request. During a 2-second stall it records one slow request. What is this trap called?", choices: ["Coordinated omission", "Dead-code elimination", "Constant folding", "Lock contention"], answer: 0 }
      - { prompt: "Why do you throw away the first minutes of a load test?", choices: ["The JIT and connection pools are still warming up, so those numbers are not normal", "The first requests are always errors", "Load tools cannot measure the first minutes", "The database deletes the first requests"], answer: 0 }
      - { prompt: "You ramp up a load test in steps. Which number tells you where real capacity ends?", choices: ["The step where p99 starts to bend upward", "The step where the average first changes", "The step where CPU reaches 100%", "The last step the tool can send"], answer: 0 }
    explain: "Warm up, then ramp the rate and watch p99. Send at a fixed arrival rate, or a stall hides the requests that would have waited: coordinated omission."
    reteach: "### Load testing without fooling yourself"

  - id: q12
    type: spot-the-bug
    concept: hotspots
    prompt: "This CSV export gets much slower as the number of rides grows: O(n²). Which line causes it?"
    code: |
      String csv = "";
      long total = 0;
      for (Ride ride : rides) {
          csv += ride.rentalId() + "," + ride.fareCents() + "\n";
          total += ride.fareCents();
      }
      return csv;
    bugLine: 4
    explain: "A String never changes, so += copies the whole CSV so far on every ride. Use one StringBuilder and append, which is O(n) in total."
    reteach: "### Hotspot: repeated work inside a loop"

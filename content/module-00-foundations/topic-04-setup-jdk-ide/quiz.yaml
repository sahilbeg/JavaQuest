    concept: jdk-jre-jvm
    variants:
      - { prompt: "Which one do you install to build Java programs?", choices: ["The JDK", "The JRE", "The JVM", "A web browser"], answer: 0 }
      - { prompt: "Which piece contains the javac compiler?", choices: ["The JDK", "The JRE", "The JVM", "The IDE settings file"], answer: 0 }
    explain: "The JDK is the full toolbox. It holds javac, the compiler, and the JVM that runs code."

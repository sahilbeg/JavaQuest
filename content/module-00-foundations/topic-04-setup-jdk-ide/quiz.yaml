  - id: q02
    type: mcq
    concept: jdk-jre-jvm
    prompt: "What does the JVM do?"
    choices: ["It runs Java programs", "It edits Java files", "It downloads JUnit", "It names your classes"]
    answer: 0
    explain: "The JVM is like the bike stand. It holds your program and runs it."
    reteach: "## Concept"

  - id: q03
    type: mcq
    concept: lts-version
    prompt: "Why does Spoke use Java 21?"
    choices: ["It is an LTS version with years of updates", "It is the newest version ever", "It is the only free version", "It runs without a JVM"]
    answer: 0
    explain: "LTS means long-term support. An LTS version gets fixes and security updates for years."
    reteach: "## Concept"

  - id: q04
    type: fill-blank
    concept: check-version
    goal: "Ask Java which release is installed on this laptop."
    prompt: "java ___"
    answers: ["-version", "--version"]
    explain: "java -version prints the version of the JVM on your laptop."
    reteach: "## Concept"

  - id: q05
    type: mcq
    concept: check-version
    prompt: "javac -version prints javac 21.0.5. What does that tell you?"
    choices: ["A full JDK 21 is installed", "Only the JRE is installed", "VS Code is installed", "Java 17 is installed"]
    answer: 0
    explain: "javac only comes with the JDK. Version 21 means you have the right one."
    reteach: "## Worked example"

  - id: q06
    type: mcq
    concept: install-jdk
    prompt: "Which Homebrew command installs Temurin 21?"
    choices: ["brew install --cask temurin@21", "brew install java-runtime", "brew open temurin", "brew install vscode@21"]
    answer: 0
    explain: "brew install --cask temurin@21 installs the Temurin build of JDK 21."
    reteach: "## Concept"

  - id: q07
    type: order
    concept: install-jdk
    prompt: "Put the setup steps in order."
    items:
      - "Install Temurin 21 from adoptium.net"
      - "Open a new Terminal window"
      - "Run java -version and javac -version"
      - "Open the practice folder in VS Code"
    explain: "Install first, then check in a fresh Terminal, then open the project."
    reteach: "## Try it"

  - id: q08
    type: spot-the-bug
    concept: check-version
    code: |
      java -version
      openjdk version "21.0.5" 2024-10-15 LTS
      javac -verison
      error: invalid flag: -verison
    bugLine: 3
    explain: "The word version is misspelled. Type javac -version."
    reteach: "## Concept"

  - id: q09
    type: mcq
    concept: ide-project
    prompt: "Your IDE shows red errors under the JUnit imports. What is the likely fix?"
    choices: ["Open the whole practice folder, with its pom.xml", "Delete the import lines", "Reinstall macOS", "Rename the file to .txt"]
    answer: 0
    explain: "Opening the practice folder lets the IDE read pom.xml and find JUnit."
    reteach: "## Common mistakes"

  - id: q10

ticket:
  key: SPK-0002
  from: priya
  title: "Why does the kiosk software need a build?"
  body: >
    The new station kiosks arrive next week. Every time I ask for a change, the team says they
    need to "build" it first. I don't understand what a build does or why the code can't just run.
    Could you find out and explain it to me in plain words?
hints:
  - "Think about who writes source code and who reads bytecode."
  - "javac turns a .java file into a .class file. The JVM runs the .class file."
  - "The order is: write Hello.java, run javac Hello.java, then run java Hello."
review: true

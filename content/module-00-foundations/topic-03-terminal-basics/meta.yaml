  from: theo
  title: "Find yesterday's ride log on the test server"
  body: >
    Morning! A rider says their ride yesterday never showed up on the bill. The test server keeps
    a log file for every day, somewhere under the spoke folder. There's no mouse on that box, only a
    terminal. Can you dig out yesterday's log and tell me what's in it?
hints:
  - "The terminal always works from one folder at a time. Ask it where you are first."
  - "pwd shows where you are, ls lists what is here, and cd moves you into a folder."
  - "Try: cd ~/spoke/logs, then ls, then cat 2026-11-11.txt"
review: true

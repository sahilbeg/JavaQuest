id: module-09a-platform/topic-07-config-and-secrets
title: "Configuration and secrets: twelve-factor apps and secret stores"
order: 7
minutes: 15
prerequisites: [module-09a-platform/topic-06-infrastructure-as-code]
concepts: [twelve-factor-config, property-precedence, relaxed-binding, fail-fast-validation, secret-stores, secret-hygiene, environment-guards]
practice:
  kind: code
  runner: plain
xp: { quiz: 50, code: 100 }
ticket:
  key: SPK-1107
  from: theo
  title: "The production password lived in git for a year"
  body: >
    I found the production database password in application.yml. It has been in git for a year, so every laptop and every CI run had it.
    Worse, last week staging quietly connected to the production database, and its test runs wrote fake rides next to real ones.
    Can you learn how config and secrets should reach the app, and make a wrong setting stop the app before it starts?
hints:
  - "Stack the sources from lowest to highest priority: defaults, application file, profile file, environment variables, command line. Each later putAll overwrites the earlier ones."
  - "For an environment variable, compare its key with each existing key after relaxed() removes the dashes. For placeholders, keep a path of the keys you are resolving right now: meeting a key that is already on the path means a cycle."
  - "Redact by the key's name: ends with password, secret, token or key, or contains credentials. For the safety check, take the host after ://, drop user:password@ and the :port, then compare: host contains prod exactly when spoke.env is prod."
review: true

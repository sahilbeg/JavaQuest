  title: "Station extends Dock, and Riverside thinks it is one dock"
  body: >
    Someone made Station extend Dock last sprint. Now Riverside reports one free dock instead of 12,
    and calling park on the station overwrites the only bike it knows about. A station is not a dock.
    It has twelve of them. Can you rebuild Station so it holds its docks?
hints:
  - "A Dock only needs to know one thing: which Bike is parked in it. The dock is free when that field is null."
  - "In the Station constructor, docks = new Dock[12] only makes 12 empty slots. Loop over the slots and put a new Dock() in each one."
  - "dock(bike): loop i from 0 to 11. If docks[i].isFree(), call docks[i].park(bike) and return i + 1. After the loop, return -1. findDock does the same loop and checks docks[i].getBike() != null && docks[i].getBike().getId().equals(bikeId)."
review: true

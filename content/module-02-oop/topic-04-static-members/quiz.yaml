  - id: q07
    type: spot-the-bug
    concept: static-vs-instance
    code: |
      class Bike {
          private String type;

          public static String label() {
              return "Bike: " + type;
          }
      }
    bugLine: 5
    explain: "label() is static, so it has no bike and cannot read the instance field type. Remove static from label."
    reteach: "## Common mistakes"

  - id: q08
    type: mcq
    concept: class-name-access
    prompt: "bike is a Bike object. Which call is correct for an instance method getId() and a static method created()?"
    choices: ["bike.getId() and Bike.created()", "Bike.getId() and bike.created()", "Bike.getId() and Bike.created()", "getId(bike) and created(Bike)"]
    answer: 0
    explain: "Call an instance method on an object and a static method on the class name."

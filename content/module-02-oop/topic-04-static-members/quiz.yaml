  - id: q09
    type: order
    concept: static-methods
    prompt: "Put the lines in order to make a static method that hands out the next bike id."
    items:
      - "private static String nextId() {"
      - "    counter++;"
      - "    return \"B-\" + (1000 + counter);"
      - "}"
    explain: "Raise the shared counter first, then build the id from it, so the first id is B-1001."
    reteach: "## Worked example"

  - id: q10

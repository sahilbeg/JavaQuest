questions:
  - id: q01
    type: mcq
    concept: static-fields
    variants:
      - { prompt: "A class has private static int counter; and you create 5 objects. How many counter values exist?", choices: ["1", "5", "6", "0"], answer: 0 }
      - { prompt: "What does static mean on a field?", choices: ["The field belongs to the class and all objects share one copy", "Each object gets its own copy of the field", "The field can never change", "The field can only be read by main"], answer: 0 }
    explain: "A static field belongs to the class, so there is exactly one copy, shared by every object."
    reteach: "## Concept"

  - id: q02
    type: fill-blank
    concept: constants
    prompt: "public static ___ double UNLOCK_FEE = 1.00;"
    answers: ["final"]
    explain: "static final makes a constant: one shared value that never changes."
    reteach: "## Concept"

  - id: q03
    type: predict-output
    concept: static-fields
    code: |
      public class Main {
          public static void main(String[] args) {
              new Bike();
              new Bike();
              new Bike();
              System.out.println(Bike.count);
          }
      }

      class Bike {
          static int count = 0;

          Bike() {
              count++;
          }
      }
    answer: "3"
    explain: "All three bikes add 1 to the same shared count."
    reteach: "## Concept"

  - id: q04
    type: predict-output
    concept: static-vs-instance
    code: |
      public class Main {
          public static void main(String[] args) {
              Bike a = new Bike();
              Bike b = new Bike();
              System.out.println(a.trips + " " + Bike.total);
          }
      }

      class Bike {
          static int total = 0;
          int trips = 0;

          Bike() {
              total++;
              trips++;
          }
      }
    answer: "1 2"
    explain: "trips is an instance field, so each bike has its own, at 1. total is static and shared, so it reaches 2."
    reteach: "## Concept"

  - id: q05
    type: mcq
    concept: static-methods
    prompt: "Why can a static method not use this?"
    choices: ["It runs without any object, so there is no this to point at", "this only works inside main", "this is a reserved word that only constructors use", "Static methods cannot use any variables"]
    answer: 0
    explain: "this means the object the method runs on. A static method runs on no object."
    reteach: "## Concept"


  - id: q02
    type: mcq
    concept: inherited-members
    prompt: "Bike has a private field id and a public method getId(). EBike extends Bike. Which statement is true?"
    choices: ["EBike code can call getId() but cannot use id by name", "EBike code can use id by name", "EBike inherits the Bike constructor", "EBike objects have no id at all"]
    answer: 0
    explain: "Public methods are inherited. Private fields exist in the object but only Bike's own code can name them. Constructors are never inherited."
    reteach: "## Concept"

  - id: q03
    type: fill-blank
    concept: super-constructor
    prompt: "public EBike(String id, int battery) { ___; this.battery = battery; }"
    answers: ["super(id)"]
    explain: "super(id) runs the Bike constructor first so the id is stored."
    reteach: "## Concept"

  - id: q04
    type: predict-output
    concept: overriding
    code: |
      public class Main {
          public static void main(String[] args) {
              Bike b = new Bike();
              EBike e = new EBike();
              System.out.println(b.pricePerMinute());
              System.out.println(e.pricePerMinute());
          }
      }

      class Bike {
          public double pricePerMinute() {
              return 0.15;
          }
      }

      class EBike extends Bike {
          @Override
          public double pricePerMinute() {
              return 0.30;
          }
      }
    answer: "0.15\n0.3"
    explain: "Each object runs its own version. Java prints 0.30 as 0.3."
    reteach: "## Worked example"

  - id: q05
    type: predict-output
    concept: super-method
    code: |
      public class Main {
          public static void main(String[] args) {
              CargoBike c = new CargoBike("B-1042");
              System.out.println(c.describe());
          }
      }

      class Bike {
          private String id;

          public Bike(String id) {
              this.id = id;
          }

          public String describe() {
              return "Bike " + id;
          }
      }

      class CargoBike extends Bike {
          public CargoBike(String id) {
              super(id);
          }

          @Override
          public String describe() {
              return super.describe() + " [cargo]";
          }
      }
    answer: "Bike B-1042 [cargo]"
    explain: "super.describe() gives Bike B-1042, and the override adds [cargo]."
    reteach: "## Concept"


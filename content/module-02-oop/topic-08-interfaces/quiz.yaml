  - id: q06
    type: predict-output
    concept: default-method
    code: |
      public class Main {
          public static void main(String[] args) {
              Chargeable c = new Scooter();
              System.out.println(c.needsCharge());
          }
      }

      interface Chargeable {
          int batteryLevel();

          default boolean needsCharge() {
              return batteryLevel() < 20;
          }
      }

      class Scooter implements Chargeable {
          public int batteryLevel() {
              return 12;
          }
      }
    answer: "true"
    explain: "Scooter gets needsCharge for free. It calls Scooter's batteryLevel(), which is 12, and 12 < 20."
    reteach: "## Worked example"

  - id: q07
    type: predict-output
    concept: interface-type
    code: |
      public class Main {
          public static void main(String[] args) {
              Chargeable[] dock = { new EBike(), new Scooter() };
              for (Chargeable item : dock) {
                  item.charge(10);
                  System.out.println(item.batteryLevel());
              }
          }
      }

      interface Chargeable {
          int batteryLevel();
          void charge(int percent);
      }

      class EBike implements Chargeable {
          private int battery = 50;

          public int batteryLevel() {
              return battery;
          }

          public void charge(int percent) {
              battery = battery + percent;
          }
      }

      class Scooter implements Chargeable {
          private int battery = 10;

          public int batteryLevel() {
              return battery;
          }

          public void charge(int percent) {
              battery = battery + percent * 2;
          }
      }
    answer: "60\n30"
    explain: "Each object runs its own charge. The EBike adds 10 to 50. The Scooter adds 10 * 2 to 10."
    reteach: "## Worked example"


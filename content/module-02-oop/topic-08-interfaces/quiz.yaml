  - id: q12
    type: mcq
    concept: abstract-vs-interface
    prompt: "Every Vehicle needs an id field and a constructor that sets it. Which tool fits that shared part?"
    choices: ["An abstract class, because it can hold fields and constructors", "An interface, because it can hold fields and constructors", "An interface with a default constructor", "Neither: shared fields are not possible in Java"]

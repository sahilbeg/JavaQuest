  - id: q01
    type: mcq
    concept: interface
    variants:
      - { prompt: "What is an interface?", choices: ["A list of methods that a class promises to have", "A class with only static fields", "A parent class you extend", "A method with no return type"], answer: 0 }
      - { prompt: "What does an interface describe?", choices: ["What a thing can do", "Which fields an object stores", "How fast a program runs", "Which package a class lives in"], answer: 0 }

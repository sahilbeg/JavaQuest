ticket:
  key: SPK-0607
  from: theo
  title: "Draw billing before anyone rewrites it"
  body: >
    Before Tsunade's team rewrites billing, I want one picture that everyone agrees on. The last
    whiteboard photo from the Riverside meeting was a blur of arrows nobody could read. Can you
    draw how riders, rides, bikes and payments fit together, and what happens when someone taps
    unlock?
hints:
  - "A class box has three parts: the name, the fields, then the methods."
  - "A filled diamond means the part dies with the whole. A hollow diamond means the part can live on its own."
  - "In a sequence diagram, time runs down the page. A solid arrow is a call, a dashed arrow is the answer coming back."
review: true

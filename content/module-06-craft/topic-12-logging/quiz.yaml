questions:
  - id: q01
    type: mcq
    concept: println-vs-logging
    prompt: "Why can the night shift not find errors among the kiosk's println lines?"
    choices: ["Every println line looks the same, with no level, time or source", "println only works during the day", "println deletes old lines after ten thousand", "println cannot print text that contains the word error"]
    answer: 0
    explain: "A logger stamps each line with a level, a time and the class that wrote it, so errors stand out."
    reteach: "## Concept"

  - id: q02
    type: mcq
    concept: slf4j-logback
    variants:
      - { prompt: "Which statement about SLF4J and Logback is true?", choices: ["Your code calls SLF4J, and Logback writes the lines behind it", "Your code calls Logback, and SLF4J writes the lines", "SLF4J and Logback are two names for the same jar", "Logback replaces System.out, so println becomes logging"], answer: 0 }
      - { prompt: "What does it mean that SLF4J is a facade?", choices: ["It is a simple front door that hides the logging library behind it", "It only logs errors", "It draws a picture of the log file", "It needs no library behind it to print anything"], answer: 0 }
    explain: "SLF4J is the facade your classes import. Logback is the implementation that formats and writes each line."
    reteach: "## Concept"


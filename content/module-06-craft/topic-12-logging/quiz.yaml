  - id: q04
    type: order
    concept: log-levels
    prompt: "Order the levels from lowest to highest importance."
    items: ["TRACE", "DEBUG", "INFO", "WARN", "ERROR"]
    explain: "Setting a level shows that level and everything above it."
    reteach: "## Concept"

  - id: q05
    type: mcq
    concept: log-levels
    prompt: "The payment provider timed out once. The kiosk retried, and the retry worked. Which level fits?"
    choices: ["WARN", "TRACE", "DEBUG", "ERROR"]
    answer: 0
    explain: "The event is odd but handled, which is WARN. ERROR is for failures that need a human. A normal decline by the bank is just INFO."
    reteach: "## Concept"

  - id: q06
    type: predict-output
    concept: log-levels
    code: |
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<String> levels = List.of("TRACE", "DEBUG", "INFO", "WARN", "ERROR");
              int threshold = levels.indexOf("INFO");
              for (String level : levels) {
                  if (levels.indexOf(level) >= threshold) {
                      System.out.println(level);
                  }
              }
          }
      }
    answer: "INFO\nWARN\nERROR"
    explain: "With the level set to INFO, you see INFO and every level above it."
    reteach: "## Concept"

  - id: q07
    type: mcq
    concept: parameterized-messages
    prompt: "Why use log.debug(\"ride {}\", ride) instead of log.debug(\"ride \" + ride)?"
    choices: ["With {}, SLF4J skips building the text and calling ride.toString() when DEBUG is switched off", "The + version does not compile", "The {} version also prints a stack trace", "The + version always logs at ERROR"]
    answer: 0
    explain: "Joining with + builds the text every time. Placeholders let SLF4J skip the formatting for hidden lines and keep one template. The arguments themselves are still evaluated."
    reteach: "## Concept"

  - id: q08
    type: spot-the-bug
    concept: logging-exceptions
    prompt: "The night shift sees the message but no stack trace. Which line causes it?"
    code: |
      try {
          dock.unlock("B-1042");
      } catch (IllegalStateException e) {
          log.error("unlock failed: " + e.getMessage());
      }
    bugLine: 4
    explain: "Only the message text is logged. Pass the exception itself as the last argument: log.error(\"unlock failed for {}\", \"B-1042\", e);"
    reteach: "## Common mistakes"

  - id: q09
    type: predict-output
    concept: masking-secrets
    code: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(mask("4000 0566 5566 5556"));
              System.out.println(mask("12"));
          }

          static String mask(String cardNumber) {
              String digits = cardNumber.replaceAll("[^0-9]", "");
              if (digits.length() < 4) {
                  return "****";
              }
              return "**** **** **** " + digits.substring(digits.length() - 4);
          }
      }
    answer: "**** **** **** 5556\n****"
    explain: "mask keeps only the last 4 digits. With fewer than 4 digits it shows none at all."
    reteach: "## Worked example"

  - id: q10
    type: mcq
    concept: masking-secrets
    prompt: "Which log line is safe to write for a card payment?"
    choices: ["payment ok for R-17 card **** **** **** 4242", "payment ok for R-17 card 4242 4242 4242 4242", "payment ok for R-17 card 4242424242424242 cvc 123", "payment ok for R-17 card 4242 4242 **** ****"]
    answer: 0
    explain: "Only the last 4 digits may appear. Logs are copied and kept for months."
    reteach: "## Concept"

  - id: q11
    type: mcq
    concept: parameterized-messages
    prompt: "DEBUG is switched off. The code runs log.debug(\"report {}\", buildReport()). What happens?"
    choices: ["buildReport() still runs, but no line is written", "Nothing runs: SLF4J skips buildReport() too", "The line is written anyway, because it uses {}", "It throws, because DEBUG is off"]
    answer: 0
    explain: "Java evaluates every argument before the call. Guard slow arguments with if (log.isDebugEnabled()) or a supplier: log.atDebug().addArgument(() -> buildReport())."
    reteach: "### Expensive arguments still run"

  - id: q12
    type: mcq
    concept: logging-in-production
    prompt: "A server thread runs MDC.put(\"ride\", \"rental-17\") but never removes it. The pool reuses that thread for the next request. What goes wrong?"
    choices: ["The next request's log lines are labelled rental-17 too", "The next request crashes with an exception", "Nothing: the MDC clears itself after each log line", "The label is written to the database"]
    answer: 0
    explain: "The MDC belongs to the thread, not the request. Clear it in finally, or use MDC.putCloseable in try-with-resources."
    reteach: "### Syntax: clearing the MDC"

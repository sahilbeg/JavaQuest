ticket:
  key: SPK-0605
  from: priya
  title: "Prices that change with the weather, and an undo button"
  body: >
    When it rains we want half price, and on marathon day Uptown needs a surge, so pricing has to
    switch without a redeploy. When a ride on B-1042 ends, the app, the email service and the dashboard
    all need to hear about it. And Sam's team set Harbor to 2 docks by mistake last week, so admins need
    an undo.
hints:
  - "Each pricing class has one job. RainDiscount and Surge do not know the fare rule: they ask the strategy they wrap."
  - "RideEvents needs a List<Consumer<String>>. The Runnable that subscribe returns can be a lambda that removes the same subscriber."
  - "SetDocks.execute saves station.docks() in a field before calling setDocks. CommandHistory keeps an ArrayDeque: push in run, pop in undo, and return false if it is empty."
review: true

  - id: q02
    type: fill-blank
    concept: strategy
    goal: "Write a pricing strategy that ignores the minutes and always charges 0 cents."
    prompt: "PricingStrategy free = minutes ___ 0;"
    answers: ["->"]
    explain: "PricingStrategy has one abstract method, so a lambda written with -> can be a strategy."
    reteach: "## Concept"

  - id: q03
    type: predict-output
    concept: strategy
    code: |
      public class Main {
          public static void main(String[] args) {
              Pricing standard = minutes -> 100 + 15 * minutes;
              Pricing rain = minutes -> standard.price(minutes) / 2;
              System.out.println(standard.price(2));
              System.out.println(rain.price(1));
          }
      }

      interface Pricing {
          long price(int minutes);
      }
    answer: "130\n57"
    explain: "Two minutes cost 100 + 30 = 130. One minute costs 115, and half of 115 as a long is 57, because division drops the half cent."
    reteach: "## Concept"

  - id: q04
    type: mcq
    concept: observer
    prompt: "In the observer pattern, what does the subject do when the event happens?"
    choices: ["It calls every subscriber in its list", "It calls only the newest subscriber", "It returns the list so the caller can pick one", "It deletes all subscribers"]
    answer: 0
    explain: "The subject walks its list of subscribers and notifies each one."
    reteach: "## Concept"

  - id: q05
    type: predict-output
    concept: unsubscribe
    code: |
      import java.util.ArrayList;
      import java.util.List;
      import java.util.function.Consumer;

      public class Main {
          public static void main(String[] args) {
              List<Consumer<String>> subscribers = new ArrayList<>();
              Consumer<String> app = id -> System.out.println("app " + id);
              Consumer<String> email = id -> System.out.println("email " + id);
              subscribers.add(app);
              subscribers.add(email);
              subscribers.remove(app);
              for (Consumer<String> s : subscribers) {
                  s.accept("B-1042");
              }
          }
      }
    answer: "email B-1042"
    explain: "The app subscriber was removed before the event, so only the email subscriber hears it."
    reteach: "## Concept"

  - id: q06
    type: mcq
    concept: unsubscribe
    prompt: "A dashboard screen subscribes to ride events and is closed, but never unsubscribes. What happens?"
    choices: ["The subject still points to it, so the garbage collector cannot free it", "Java unsubscribes it automatically when the screen closes", "The program fails to compile", "The subject throws an exception on the next event"]
    answer: 0
    explain: "The subject's list holds a reference to the listener. The listener stays in memory as long as the subject lives. This is a listener leak."
    reteach: "## Concept"

  - id: q07
    type: mcq
    concept: command
    prompt: "Why does the command pattern make undo possible?"
    choices: ["Each action is an object that can be stored and has its own undo method", "Commands run faster than plain method calls", "Commands can only be run once", "Commands make every field final"]
    answer: 0
    explain: "Because the action is an object, you can keep it in a history and call its undo later."
    reteach: "## Concept"

  - id: q08
    type: spot-the-bug
    concept: command
    prompt: "After execute and then undo, Harbor still has the new docks value. Which line is wrong?"
    code: |
      public void execute() {
          oldDocks = newDocks;
          station.setDocks(newDocks);
      }

      public void undo() {
          station.setDocks(oldDocks);
      }
    bugLine: 2
    explain: "oldDocks stores the new value instead of the current one. Read station.docks() before calling setDocks."
    reteach: "## Common mistakes"

  - id: q09
    type: order
    concept: undo-history
    prompt: "Put the steps of CommandHistory.undo in order."
    items:
      - "Check whether the stack is empty"
      - "Return false if it is empty"
      - "Pop the newest command"
      - "Call undo on that command"
      - "Return true"
    explain: "Check first so an empty history does not crash, then pop the newest command and reverse it."
    reteach: "## Concept"

  - id: q10
    type: predict-output
    concept: undo-history
    code: |
      import java.util.ArrayDeque;
      import java.util.Deque;

      public class Main {
          public static void main(String[] args) {
              Deque<String> done = new ArrayDeque<>();
              done.push("set Harbor to 10");
              done.push("set Harbor to 2");
              System.out.println("Undo: " + done.pop());
              System.out.println(done.size());
          }
      }
    answer: "Undo: set Harbor to 2\n1"
    explain: "A stack is last in, first out. The newest command comes off first, and one command stays."
    reteach: "## Concept"

  - id: q11
    type: mcq
    concept: more-patterns
    variants:
      - { prompt: "A bike can be AVAILABLE, RENTED or IN_REPAIR, and each status allows different actions. Which pattern lets each status decide what is allowed and what comes next?", choices: ["State", "Observer", "Facade", "Template method"], answer: 0 }
      - { prompt: "Every Spoke report has the same header and footer, set in a final build() method of a parent class. Each subclass fills in only the middle. Which pattern is this?", choices: ["Template method", "Chain of responsibility", "Observer", "Command"], answer: 0 }
      - { prompt: "Before an unlock, an account check, a balance check and a bike check run in a line. Each one either refuses or passes the request to the next. Which pattern is this?", choices: ["Chain of responsibility", "Template method", "State", "Strategy"], answer: 0 }
    explain: "State lets each state object decide the next move. Template method fixes the steps in a final parent method and leaves blanks for subclasses. Chain of responsibility passes a request along a line of handlers."
    reteach: "## Concept"

  - id: q12
    type: mcq
    concept: pattern-choice
    prompt: "Spoke has one pricing rule today and no plan for another. A teammate wants a PricingStrategy interface, a factory and a registry for it. What is the best advice?"
    choices: ["Keep one plain method for now, and refactor to a strategy when a second rule really arrives", "Add the interface, factory and registry now, because patterns always make code better", "Use observer instead, because it is more flexible", "Write the rule as a chain of responsibility with one handler"]
    answer: 0
    explain: "YAGNI: a pattern with one case adds classes without removing any pain. Add it when the second or third case shows up."
    reteach: "### When not to use a pattern"

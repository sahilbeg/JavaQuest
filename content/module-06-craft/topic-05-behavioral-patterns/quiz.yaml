  - id: q01
    type: mcq
    concept: strategy
    variants:
      - { prompt: "Rain discount, marathon surge and normal pricing must be swappable at run time. Which pattern fits?", choices: ["Strategy", "Observer", "Command", "Singleton"], answer: 0 }
      - { prompt: "You want to pick one of several fare rules while the app runs, without an if chain. Which pattern fits?", choices: ["Observer", "Strategy", "Command", "Builder"], answer: 1 }
    explain: "Strategy puts each version of a rule behind one interface, so the caller can swap the rule."

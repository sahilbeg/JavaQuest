  - id: q01
    type: mcq
    concept: static-factory
    variants:
      - { prompt: "What is a static factory method?", choices: ["A static method that creates and returns an object of its class", "A constructor with the word static in front", "A method that deletes old objects", "A class that holds only constants"], answer: 0 }
      - { prompt: "Why does Ride.classic(\"B-1042\") read better than new Ride(\"B-1042\", \"classic\")?", choices: ["The method name says which kind of ride you get", "It runs faster than a constructor", "It skips the constructor completely", "It makes the Ride object mutable"], answer: 0 }
    explain: "A static factory is a named constructor. The name tells the reader what comes back."

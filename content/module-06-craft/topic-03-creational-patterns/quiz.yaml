  - id: q04
    type: predict-output
    concept: simple-factory
    code: |
      public class Main {
          public static void main(String[] args) {
              Bike b = create("cargo");
              System.out.println(b.centsPerMinute());
              System.out.println(b instanceof CargoBike);
          }

          static Bike create(String type) {
              return switch (type) {
                  case "ebike" -> new EBike();
                  case "cargo" -> new CargoBike();
                  default -> new ClassicBike();
              };
          }
      }

      interface Bike { int centsPerMinute(); }
      class ClassicBike implements Bike { public int centsPerMinute() { return 15; } }
      class EBike implements Bike { public int centsPerMinute() { return 30; } }
      class CargoBike implements Bike { public int centsPerMinute() { return 25; } }
    answer: "25\ntrue"
    explain: "The word cargo picks CargoBike, which charges 25 cents a minute."
    reteach: "## Concept"

  - id: q05
    type: predict-output
    concept: builder
    code: |
      public class Main {
          public static void main(String[] args) {
              Trip t = Trip.builder().to("Uptown").from("Harbor").build();
              System.out.println(t.from() + " -> " + t.to() + " " + t.minutes());
          }
      }

      record Trip(String from, String to, int minutes) {
          static Builder builder() { return new Builder(); }

          static class Builder {
              private String from;
              private String to;
              private int minutes = 15;
              Builder from(String from) { this.from = from; return this; }
              Builder to(String to) { this.to = to; return this; }
              Trip build() { return new Trip(from, to, minutes); }
          }
      }
    answer: "Harbor -> Uptown 15"
    explain: "Each value is stored by name, so the call order does not matter. minutes was never set, so it keeps its default of 15."
    reteach: "## Worked example"


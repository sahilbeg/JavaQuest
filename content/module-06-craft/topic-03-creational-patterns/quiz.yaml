  - id: q09
    type: mcq
    concept: dependency-injection
    prompt: "Why is a singleton often called a code smell?"
    choices: ["Any class can reach it, so dependencies are hidden and hard to swap in tests", "It uses too much memory", "Java does not allow enums with methods", "It makes the program single-threaded"]
    answer: 0
    explain: "A global object hides who needs it. Passing it through the constructor makes the need visible."
    reteach: "## Concept"

  - id: q10
    type: order
    concept: dependency-injection
    prompt: "Put the lines in order to write a FareService that receives its PriceTable. Put the field first, then the constructor."
    items:
      - "class FareService {"
      - "    private final PriceTable prices;"
      - "    FareService(PriceTable prices) {"
      - "        this.prices = prices;"
      - "    }"
      - "}"
    explain: "The field holds the dependency, and the constructor receives it from outside. That is dependency injection."
    reteach: "## Concept"

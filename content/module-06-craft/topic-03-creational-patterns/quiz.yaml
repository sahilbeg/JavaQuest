  - id: q07
    type: spot-the-bug
    concept: builder
    prompt: "Which line will not compile?"
    code: |
      record Trip(String from, String to) {
          static class Builder {
              private String from;
              private String to;
              Builder from(String from) { this.from = from; return this; }
              Builder to(String to) { this.to = to; }
              Trip build() { return new Trip(from, to); }
          }
      }
    bugLine: 6
    explain: "The to setter promises to return a Builder but has no return statement. Add return this;."
    reteach: "## Common mistakes"


  - id: q04
    type: predict-output
    concept: open-closed
    code: |
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<PaymentMethod> methods = List.of(new Card(), new Wallet());
              for (PaymentMethod m : methods) {
                  System.out.println(m.name() + " " + m.pay(100));
              }
          }
      }

      interface PaymentMethod {
          String name();
          String pay(long cents);
      }

      class Card implements PaymentMethod {
          public String name() { return "card"; }
          public String pay(long cents) { return "charged " + cents; }
      }

      class Wallet implements PaymentMethod {
          public String name() { return "wallet"; }
          public String pay(long cents) { return "charged " + (cents + 5); }
      }
    answer: "card charged 100\nwallet charged 105"
    explain: "The loop calls each object's own methods. Wallet adds 5 to the cents before printing."
    reteach: "## Concept"

  - id: q05
    type: mcq
    concept: liskov-substitution
    prompt: "TransitRefund implements Refundable, but its refund method always throws UnsupportedOperationException. Which principle does it break?"
    choices: ["Liskov substitution", "Single responsibility", "Open/closed", "Dependency inversion"]
    answer: 0
    explain: "Code that trusts Refundable crashes on this subtype. A subtype must keep its parent's promises."
    reteach: "## Concept"

  - id: q06
    type: predict-output
    concept: dependency-inversion
    code: |
      public class Main {
          public static void main(String[] args) {
              Checkout a = new Checkout(new Card());
              Checkout b = new Checkout(new Wallet());
              System.out.println(a.finish());
              System.out.println(b.finish());
          }
      }

      interface PaymentMethod {
          String pay(long cents);
      }

      class Card implements PaymentMethod {
          public String pay(long cents) { return "card " + cents; }
      }

      class Wallet implements PaymentMethod {
          public String pay(long cents) { return "wallet " + cents; }
      }

      class Checkout {
          private final PaymentMethod payment;

          Checkout(PaymentMethod payment) {
              this.payment = payment;
          }

          String finish() {
              return payment.pay(250);
          }
      }
    answer: "card 250\nwallet 250"
    explain: "Checkout depends only on the interface. Each checkout uses whatever payment method was handed to its constructor."
    reteach: "## Concept"

  - id: q07
    type: mcq
    concept: interface-segregation
    prompt: "A dock sensor must implement printReceipt and scanCard just to report docks. What is the best fix?"
    choices: ["Split the big interface into small ones such as DockSensor, ReceiptPrinter and CardReader", "Make printReceipt and scanCard throw exceptions", "Add more methods to the big interface", "Make the dock sensor extend the kiosk class"]
    answer: 0
    explain: "Interface segregation says no class should be forced to write methods it does not use."
    reteach: "## Concept"

  - id: q08
    type: spot-the-bug
    concept: interface-segregation
    prompt: "The code does not compile. Which line breaks the interface rules?"
    code: |
      interface DockSensor {
          boolean isDocked(String bikeId);
      }
      class HarborSensor implements DockSensor {
          boolean isDocked(String bikeId) { return true; }
      }
    bugLine: 5
    explain: "Interface methods are public. The class must write public boolean isDocked, or javac reports weaker access privileges."
    reteach: "## Common mistakes"


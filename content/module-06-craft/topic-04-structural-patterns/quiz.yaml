  - id: q08
    type: mcq
    concept: composition
    prompt: "Why do these patterns prefer composition over inheritance?"
    choices: ["You can choose and combine the inner object while the program runs", "Composition makes code run faster", "Java does not allow inheritance from interfaces", "Inheritance cannot call methods"]
    answer: 0
    explain: "A field can hold any object of the right type, so you can stack and swap wrappers. extends is fixed at compile time."

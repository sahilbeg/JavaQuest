  - id: q06
    type: spot-the-bug
    concept: delegation
    prompt: "Lock is an interface with one method, open. This decorator compiles but crashes with a StackOverflowError. Which line is wrong?"
    code: |
      class LoudLock implements Lock {
          private final Lock inner;
          LoudLock(Lock inner) { this.inner = inner; }
          public boolean open(String id) {
              System.out.println("opening " + id);
              return open(id);
          }
      }
    bugLine: 6
    explain: "open calls itself forever and ends in a StackOverflowError. It should call inner.open(id)."
    reteach: "## Common mistakes"

  - id: q07
    type: mcq
    concept: facade
    prompt: "What does a facade give its callers?"
    choices: ["One simple method in front of several parts", "A copy of every part's methods", "A way to change a class without wrapping it", "Exactly one object for the whole program"]
    answer: 0
    explain: "A facade hides the steps. The kiosk calls unlock once, and the facade checks the rider and opens the lock."

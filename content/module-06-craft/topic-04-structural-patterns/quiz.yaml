  - id: q03
    type: mcq
    concept: decorator
    prompt: "What makes a class a decorator?"
    choices: ["It implements an interface and wraps another object of the same interface", "It extends the class it changes", "It has only static methods", "It hides several different subsystems"]
    answer: 0
    explain: "Same interface outside, same interface inside. That is why decorators can be stacked."
    reteach: "## Concept"

  - id: q04
    type: predict-output
    concept: decorator
    code: |
      public class Main {
          public static void main(String[] args) {
              Counter outer = new Counter(new Retry(new Flaky()));
              System.out.println(outer.open("B-1042"));
              System.out.println(outer.count);
          }
      }

      interface Lock { boolean open(String id); }

      class Flaky implements Lock {
          int tries = 0;
          public boolean open(String id) {
              tries++;
              return tries > 1;
          }
      }

      class Retry implements Lock {
          private final Lock inner;
          Retry(Lock inner) { this.inner = inner; }
          public boolean open(String id) {
              if (inner.open(id)) {
                  return true;
              }
              return inner.open(id);
          }
      }

      class Counter implements Lock {
          private final Lock inner;
          int count = 0;
          Counter(Lock inner) { this.inner = inner; }
          public boolean open(String id) {
              count++;
              return inner.open(id);
          }
      }
    answer: "true\n1"
    explain: "The counter sits outside the retry, so it sees one call. The retry hides the first failure."
    reteach: "## Concept"


          }
      }

      interface Lock { boolean open(String id); }

      class Flaky implements Lock {
          int tries = 0;
          public boolean open(String id) {
              tries++;
              return tries > 1;
          }
      }

      class Retry implements Lock {
          private final Lock inner;
          Retry(Lock inner) { this.inner = inner; }
          public boolean open(String id) {
              if (inner.open(id)) {
                  return true;
              }
              return inner.open(id);
          }
      }

      class Counter implements Lock {
          private final Lock inner;
          int count = 0;
          Counter(Lock inner) { this.inner = inner; }
          public boolean open(String id) {
              count++;
              return inner.open(id);
          }
      }
    answer: "true\n2"

  - id: q08
    type: mcq
    concept: interval-scheduling
    prompt: "To fit the most bookings on one dock, how should you sort the requests before the greedy pass?"
    choices: ["By end time", "By start time", "By length, shortest first", "By length, longest first"]
    answer: 0
    explain: "Earliest end leaves the most room for later bookings. Earliest start and shortest first both have counterexamples."
    reteach: "### The most bookings on one dock"

  - id: q09
    type: mcq
    concept: interval-scheduling
    prompt: "Why does mostBookings cost O(n log n) time?"
    choices: ["The sort costs O(n log n), and the greedy pass is only O(n)", "Every request is compared with every other request", "It uses a table with n times n cells", "It binary searches for each request"]
    answer: 0
    explain: "Sorting dominates. After the sort, one pass looks at each request once."
    reteach: "### How fast is each?"

  - id: q10
    type: predict-output
    concept: docks-sweep
    code: |
      public class Main {
          public static void main(String[] args) {
              int[] starts = {600, 610, 660, 700};
              int[] ends = {650, 660, 720, 760};
              int inUse = 0;
              int most = 0;
              int e = 0;
              for (int s = 0; s < starts.length; s++) {
                  while (ends[e] <= starts[s]) {
                      inUse--;
                      e++;
                  }
                  inUse++;
                  most = Math.max(most, inUse);
              }
              System.out.println(most);
          }
      }
    answer: "2"
    explain: "Two bookings are active at 610. At 660 both of them have ended, so the count drops to 1. At 700 it rises to 2 again. The most is 2."
    reteach: "### How many docks at once"

  - id: q11
    type: order

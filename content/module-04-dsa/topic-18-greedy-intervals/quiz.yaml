  - id: q01
    type: mcq
    concept: greedy-choice
    prompt: "What does a greedy algorithm do?"
    choices: ["Makes the best-looking choice at each step and never goes back to change it", "Tries every mix of choices and keeps the best one", "Fills a table from the smallest case upward", "Sorts the input and then binary searches it"]
    answer: 0
    explain: "Greedy commits to the local best choice. Trying every mix and keeping the best is what DP does."
    reteach: "### What greedy means"

  - id: q02
    type: mcq
    concept: greedy-choice
    prompt: "The kiosk has coins of 1, 3 and 4 cents. Why does 'biggest coin first' fail for 6 cents?"
    choices: ["Taking the 4 leaves 2 cents, which needs two 1s, but 3 + 3 uses only 2 coins", "It cannot pay 6 cents at all", "It uses 2 coins, but the best uses 3", "It only fails when the amount is odd"]
    answer: 0
    explain: "Greedy pays 4 + 1 + 1, three coins. The local best choice, the 4, ruined a later step. 3 + 3 is two coins."
    reteach: "### When greedy fails"

  - id: q03
    type: mcq
    concept: exchange-argument
    prompt: "Why is it safe to take the booking that ends first?"
    choices: ["Swapping it into any best plan keeps the plan valid and the same size, because it ends no later", "It is always the shortest booking", "It always starts first", "It never overlaps any other booking"]
    answer: 0
    explain: "That is the exchange argument. The earliest-ending booking ends no later than the best plan's first booking, so nothing after it can clash."
    reteach: "### Arguing greedy is right: the exchange argument"


  - id: q06
    type: predict-output
    concept: merge-intervals
    code: |
      import java.util.ArrayList;
      import java.util.Comparator;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<Interval> sorted = new ArrayList<>(List.of(
                      new Interval(700, 730), new Interval(600, 660),
                      new Interval(650, 720), new Interval(800, 820)));
              sorted.sort(Comparator.comparingInt(Interval::start));
              List<Interval> merged = new ArrayList<>();
              for (Interval booking : sorted) {
                  if (!merged.isEmpty() && booking.start() < merged.get(merged.size() - 1).end()) {
                      Interval last = merged.remove(merged.size() - 1);
                      merged.add(new Interval(last.start(), Math.max(last.end(), booking.end())));
                  } else {
                      merged.add(booking);
                  }
              }
              for (Interval m : merged) {
                  System.out.println(m.start() + "-" + m.end());
              }
          }
      }

      record Interval(int start, int end) {
      }
    answer: "600-730\n800-820"
    explain: "Sorted: 600-660, 650-720, 700-730, 800-820. The first three chain into 600-730. 800-820 starts after 730, so it stays alone."
    reteach: "### Merging busy periods"


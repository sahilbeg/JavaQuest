  - id: q05
    type: predict-output
    concept: bfs
    code: |
      import java.util.ArrayDeque;
      import java.util.HashSet;
      import java.util.List;
      import java.util.Map;
      import java.util.Queue;
      import java.util.Set;

      public class Main {
          public static void main(String[] args) {
              Map<String, List<String>> lanes = Map.of(
                      "Uptown", List.of("Harbor", "Depot"),
                      "Harbor", List.of("Uptown", "Riverside"),
                      "Depot", List.of("Uptown"),
                      "Riverside", List.of("Harbor"));
              Set<String> visited = new HashSet<>();
              Queue<String> queue = new ArrayDeque<>();
              visited.add("Uptown");
              queue.offer("Uptown");
              while (!queue.isEmpty()) {
                  String current = queue.poll();
                  System.out.println(current);
                  for (String next : lanes.get(current)) {
                      if (!visited.contains(next)) {
                          visited.add(next);
                          queue.offer(next);
                      }
                  }
              }
          }
      }
    answer: "Uptown\nHarbor\nDepot\nRiverside"
    explain: "Harbor and Depot are one lane from Uptown, so they come out first. Riverside is two lanes away."
    reteach: "## Concept"

  - id: q06
    type: predict-output
    concept: dfs
    code: |
      import java.util.HashSet;
      import java.util.List;
      import java.util.Map;
      import java.util.Set;

      public class Main {
          static Map<String, List<String>> lanes = Map.of(
                  "Uptown", List.of("Harbor", "Depot"),
                  "Harbor", List.of("Uptown", "Riverside"),
                  "Depot", List.of("Uptown"),
                  "Riverside", List.of("Harbor"));

          static void dfs(String station, Set<String> visited) {
              if (visited.contains(station)) {
                  return;
              }
              visited.add(station);
              System.out.println(station);
              for (String next : lanes.get(station)) {
                  dfs(next, visited);
              }
          }

          public static void main(String[] args) {
              dfs("Uptown", new HashSet<>());
          }
      }
    answer: "Uptown\nHarbor\nRiverside\nDepot"
    explain: "DFS goes deep first: Uptown, then Harbor, then on to Riverside. Only then does it back up and visit Depot."
    reteach: "## Try it"


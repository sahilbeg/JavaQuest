  - id: q09
    type: spot-the-bug
    concept: dfs
    code: |
      static void dfs(String station, Set<String> visited) {
          if (visited.contains(station)) {
              return;
          }
          visited.remove(station);
          for (String next : lanes.get(station)) {
              dfs(next, visited);
          }
      }
    prompt: "This DFS never ends on a graph with a loop. Which line is wrong?"
    bugLine: 5
    explain: "Line 5 should be visited.add(station);. The set stays empty, so DFS walks around the loop until the stack overflows."
    reteach: "## Common mistakes"


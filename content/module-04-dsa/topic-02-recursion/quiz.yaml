    prompt: "A recursive method has no base case. What happens when you call it?"
    choices: ["It throws StackOverflowError", "It returns 0", "It does not compile", "It runs forever without any error"]
    answer: 0
    explain: "Each call adds a note to the call stack. With no base case the stack fills up and Java throws StackOverflowError."

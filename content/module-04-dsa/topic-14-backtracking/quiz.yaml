questions:
  - id: q01
    type: order
    concept: choose-explore-unchoose
    prompt: "Put the three steps inside a backtracking loop in order."
    items:
      - "current.add(items.get(i));"
      - "explore(i + 1, current, result);"
      - "current.remove(current.size() - 1);"
    explain: "Choose an item, explore the choices that follow it, then un-choose it so the loop can try the next item."
    reteach: "### Syntax: choose, explore, un-choose"

  - id: q02
    type: mcq
    concept: choose-explore-unchoose
    prompt: "Why does backtracking remove the item after the recursive call returns?"
    choices: ["So the path is back to what it was, ready for the next choice in the loop", "To free memory before Java runs out", "To stop the recursion from running forever", "Because List cannot hold more than one item"]
    answer: 0
    explain: "Un-choosing walks back to the fork. The next loop step must start from the same path the last one started from."
    reteach: "### What backtracking is"

  - id: q03
    type: predict-output
    concept: copy-the-path
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          static List<List<String>> result = new ArrayList<>();

          static void explore(List<String> stations, int start, List<String> current) {
              result.add(current);
              for (int i = start; i < stations.size(); i++) {
                  current.add(stations.get(i));
                  explore(stations, i + 1, current);
                  current.remove(current.size() - 1);
              }
          }

          public static void main(String[] args) {
              explore(List.of("Harbor", "Depot"), 0, new ArrayList<>());
              System.out.println(result);
          }
      }
    answer: "[[], [], [], []]"
    explain: "result holds four arrows to the same list, current. When the search ends, current is empty, so all four look empty."
    reteach: "### Record a copy, never the path itself"

  - id: q04
    type: fill-blank
    concept: copy-the-path
    goal: "Record a copy of the path being built right now, so later changes to the path cannot touch the saved answer."
    prompt: "result.add(new ArrayList<>(___));"
    answers: ["current"]
    explain: "new ArrayList<>(current) copies the path as it is right now, so later changes cannot touch the recorded answer."
    reteach: "### Record a copy, never the path itself"

  - id: q05
    type: predict-output
    concept: subsets
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          static void explore(List<String> stations, int start, List<String> current) {
              System.out.println(current);
              for (int i = start; i < stations.size(); i++) {
                  current.add(stations.get(i));
                  explore(stations, i + 1, current);
                  current.remove(current.size() - 1);
              }
          }

          public static void main(String[] args) {
              explore(List.of("Harbor", "Depot"), 0, new ArrayList<>());
          }
      }
    answer: "[]\n[Harbor]\n[Harbor, Depot]\n[Depot]"
    explain: "Every call prints its path first. The search goes deep with Harbor, then backs up and tries Depot alone."
    reteach: "### Subsets: every set of promos"


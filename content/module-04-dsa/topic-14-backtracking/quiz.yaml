  - id: q08
    type: spot-the-bug
    concept: permutations
    code: |
      static void explore(List<String> stations, boolean[] used, List<String> current) {
          if (current.size() == stations.size()) {
              result.add(new ArrayList<>(current));
              return;
          }
          for (int i = 0; i < stations.size(); i++) {
              if (used[i]) {
                  continue;
              }
              used[i] = true;
              current.add(stations.get(i));
              explore(stations, used, current);
              current.remove(current.size() - 1);
              used[i] = true;
          }
      }
    prompt: "This finds only one order for three stations. Which line is wrong?"
    bugLine: 14
    explain: "Un-choosing must undo both changes. Line 14 should set used[i] = false, or the station stays blocked for every later branch."
    reteach: "### Permutations: every order to visit stations"

  - id: q09
    type: mcq
    concept: combination-sum
    prompt: "In a combination sum where each crate size may be used again and again, what start do you pass to the next call?"
    choices: ["i, so the next level may pick the same size again", "i + 1, so each size is used once", "0, so every size can be picked in any order", "start + 1, whatever i is"]
    answer: 0
    explain: "Passing i allows the same item again but never an earlier one. Passing 0 would list the same answer in many orders."
    reteach: "### Combination sum: reuse or no reuse"

  - id: q10
    type: mcq
    concept: skip-duplicates
    prompt: "After sorting, why is the skip rule i > start && sorted[i] == sorted[i - 1], and not i > 0?"
    choices: ["A repeated value may still be the first choice at a deeper level, as in [2, 2, 3]", "i > 0 does not compile inside a loop", "i > start makes the loop run faster", "Sorting puts duplicates far apart"]
    answer: 0
    explain: "Only a second equal value in the same loop repeats a branch. With i > 0, loads like [2, 2, 3] are lost."
    reteach: "### Skipping duplicates after sorting"

  - id: q11
    type: mcq
    concept: pruning-and-cost
    prompt: "The values are sorted and sorted[i] > remaining. Why can you break instead of continue?"
    choices: ["Every later value is at least as big, so none of them can fit either", "break is faster to type than continue", "The path is already full", "remaining can never go down again"]
    answer: 0
    explain: "Sorting means the rest of the loop only holds bigger values. Pruning cuts all of those branches at once."
    reteach: "### Pruning: stop early"

  - id: q12
    type: mcq
    concept: pruning-and-cost
    prompt: "What is the time cost of listing every subset of n items?"
    choices: ["O(n × 2^n)", "O(n²)", "O(n log n)", "O(n)"]
    answer: 0
    explain: "There are 2^n subsets and copying each one costs up to n steps. No method can beat the size of its output."
    reteach: "### How much does it cost?"

  - id: q09
    type: spot-the-bug
    concept: balanced-brackets
    prompt: "balanced(\"((\") returns true. Which line is wrong?"
    code: |
      static boolean balanced(String text) {
          java.util.ArrayDeque<Character> open = new java.util.ArrayDeque<>();
          for (char c : text.toCharArray()) {
              if (c == '(') {
                  open.push(c);
              } else if (c == ')') {
                  if (open.isEmpty()) {
                      return false;
                  }
                  open.pop();
              }
          }
          return true;
      }
    bugLine: 13
    explain: "balanced(\"((\") returns true. The method must end with return open.isEmpty(); so unclosed brackets fail."
    reteach: "## Common mistakes"

  - id: q10

    prompt: "This undo stack prints log in instead of select bike. Which line is wrong?"
    code: |
      import java.util.ArrayDeque;

      public class Main {
          public static void main(String[] args) {
              ArrayDeque<String> undo = new ArrayDeque<>();
              undo.push("log in");
              undo.offer("select bike");
              System.out.println(undo.pop()); // should undo select bike
          }
      }
    bugLine: 7
    explain: "offer adds at the back, but pop takes from the front, so this prints log in. Use push for every stack item."
    reteach: "## Common mistakes"


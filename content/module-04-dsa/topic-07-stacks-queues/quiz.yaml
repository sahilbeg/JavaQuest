  - id: q04
    type: predict-output
    concept: stack-lifo
    prompt: "What does this program print?"
    code: |
      import java.util.ArrayDeque;

      public class Main {
          public static void main(String[] args) {
              ArrayDeque<String> undo = new ArrayDeque<>();
              undo.push("log in");
              undo.push("scan card");
              undo.push("select bike");
              System.out.println(undo.pop());
              System.out.println(undo.peek());
              System.out.println(undo.size());
          }
      }
    answer: "select bike\nscan card\n2"
    explain: "pop removes the newest action. peek shows the new top without removing it, so 2 items remain."
    reteach: "## Concept"


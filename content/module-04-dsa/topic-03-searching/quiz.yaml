  - id: q01
    type: mcq
    concept: binary-search
    variants:
      - { prompt: "What must be true of an array before you run binary search on it?", choices: ["It must be sorted", "It must have an even length", "It must hold no duplicates", "It must have fewer than 1,000 items"], answer: 0 }
      - { prompt: "Binary search on an unsorted array returns -1 for a value that is there. Why?", choices: ["It throws away the half it thinks cannot hold the value, and on unsorted data that guess is wrong", "Binary search only works on arrays of Strings", "The midpoint overflows on small arrays", "Binary search always returns -1 the first time"], answer: 0 }

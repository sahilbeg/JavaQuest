  - id: q11
    type: predict-output
    concept: lower-bound
    code: |
      public class Main {
          public static void main(String[] args) {
              int[] a = {10, 20, 20, 20, 30};
              int low = 0;
              int high = a.length;
              while (low < high) {
                  int mid = low + (high - low) / 2;
                  if (a[mid] >= 20) {
                      high = mid;
                  } else {
                      low = mid + 1;
                  }
              }
              System.out.println(low);
          }
      }
    answer: "1"
    explain: "This is a lower bound search. It finds the first index whose value is >= 20. That is the first copy of 20, at index 1."
    reteach: "### Lower and upper bound"

  - id: q12
    type: mcq
    concept: search-on-answer
    prompt: "You binary search for the smallest truck size that moves all the bikes in 3 trips. What makes binary search work here?"
    choices: ["The yes-or-no test flips once: every size below the answer fails, and every size from it upward works", "The piles of bikes must be sorted first", "The answer must be a power of two", "The piles must hold no duplicate numbers"]
    answer: 0
    explain: "Binary search needs a yes-or-no test that flips only once, like no, no, yes, yes. The piles themselves can be in any order."
    reteach: "### Binary search on the answer"

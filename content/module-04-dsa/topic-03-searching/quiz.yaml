  - id: q05
    type: predict-output
    concept: binary-search
    code: |
      public class Main {
          public static void main(String[] args) {
              int[] a = {3, 6, 9, 12, 15, 18, 21};
              int low = 0;
              int high = a.length - 1;
              while (low <= high) {
                  int mid = low + (high - low) / 2;
                  System.out.println(a[mid]);
                  if (a[mid] == 18) {
                      break;
                  } else if (a[mid] < 18) {
                      low = mid + 1;
                  } else {
                      high = mid - 1;
                  }
              }
          }
      }
    answer: "12\n18"
    explain: "The first mid is index 3, value 12. 12 is less than 18, so low becomes 4. The next mid is index 5, value 18, so the loop stops."
    reteach: "## Worked example"

  - id: q06
    type: predict-output
    concept: linear-search
    code: |
      public class Main {
          static int linear(int[] values, int target) {
              for (int i = 0; i < values.length; i++) {
                  if (values[i] == target) {
                      return i;
                  }
              }
              return -1;
          }

          public static void main(String[] args) {
              int[] docks = {4, 8, 4, 2};
              System.out.println(linear(docks, 4));
              System.out.println(linear(docks, 5));
          }
      }
    answer: "0\n-1"
    explain: "Linear search returns the first match, index 0. The value 5 is missing, so the second call returns -1."
    reteach: "## Concept"

  - id: q07
    type: spot-the-bug
    concept: binary-search
    prompt: "This binary search misses the value when only one item is left in the range. Which line is wrong?"
    code: |
      static int binary(int[] sorted, int target) {
          int low = 0;
          int high = sorted.length - 1;
          while (low < high) {
              int mid = low + (high - low) / 2;
              if (sorted[mid] == target) {
                  return mid;
              } else if (sorted[mid] < target) {
                  low = mid + 1;
              } else {
                  high = mid - 1;
              }
          }
          return -1;
      }
    bugLine: 4
    explain: "With low < high, the loop stops when low equals high and never checks that last item. Use low <= high."
    reteach: "## Common mistakes"

  - id: q08
    type: order
    concept: recursive-search
    prompt: "Put the lines of the recursive helper in order."
    items:
      - "if (low > high) { return -1; }"
      - "int mid = low + (high - low) / 2;"
      - "if (sorted[mid] == target) {"
      - "    return mid;"
      - "} else if (sorted[mid] < target) {"
      - "    return search(sorted, target, mid + 1, high);"
      - "} else {"
      - "    return search(sorted, target, low, mid - 1);"
      - "}"
    explain: "The base case comes first: an empty range means not found. Then compute mid and recurse into one half."
    reteach: "## Concept"

  - id: q09
    type: mcq
    concept: library-search
    prompt: "Arrays.binarySearch(ids, 77) returns -4. What does that tell you?"
    choices: ["77 is not in the array", "77 is at index 4", "77 is at index -4 counted from the end", "The array is empty"]
    answer: 0
    explain: "A missing value gives -(insertionPoint) - 1. Here -4 means 77 is missing and would go at index 3. Check for a miss with < 0, not == -1."
    reteach: "## Concept"

  - id: q10

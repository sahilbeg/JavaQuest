  - id: q02
    type: mcq
    concept: search-costs
    prompt: "A sorted list doubles from 50,000 to 100,000 bike ids. About how many more looks does binary search need in the worst case?"
    choices: ["About 1 more", "About 2 times as many", "About 50,000 more", "No change at all"]
    answer: 0
    explain: "Binary search is O(log n). Doubling the data adds one halving step."
    reteach: "## Concept"


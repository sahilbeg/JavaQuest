ticket:
  key: INC-04
  from: priya
  title: "The route planner sends riders to full stations"
  body: >
    Riders at a full station ask the app for the nearest station with a free dock.
    Last night it sent a rider from Harbor to Uptown, which was full too.
    Then it crashed for every rider near the new Depot station.
hints:
  - "Bronze: a station with 0 free docks is full. Check the condition that decides whether a station is good enough."
  - "Silver: Depot is missing from the free-docks map, so get returns null. Use getOrDefault with 0."
  - "Gold: search one distance level at a time. Among the free stations at the nearest level, pick the most free docks, then the name that comes first alphabetically."

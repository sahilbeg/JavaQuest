  title: "Six planning questions, one way to answer them"
  body: >
    The planning desk keeps asking me things like which stations the promo team should visit,
    how few coins the kiosk can give back, and which crates fit on the truck. Every answer is
    worked out by hand, and some are wrong. They all look like dynamic programming to me.
    Can you build one PlanningDesk that answers all six?
hints:
  - "For each method, say the recipe first: what one cell means, how it is built from earlier cells, the base cases, the answer cell and the fill order."
  - "fewestCoins starts every cell at amount + 1 (impossible) except fewest[0] = 0. waysToPay starts with ways[0] = 1 and puts the coins in the outer loop. bestTruckLoad loops w from capacity down to the crate's weight."
  - "routesThroughGrid can keep one long[] row: routes[0] = 1, then for each square, routes[c] = 0 if it is blocked, else routes[c] += routes[c - 1] when c > 0. editDistance sets dist[i][0] = i and dist[0][j] = j, then copies the diagonal on a match or takes 1 + the smallest of the diagonal, the cell above and the cell to the left."
review: true

  - id: q03
    type: predict-output
    concept: take-or-skip
    code: |
      public class Main {
          public static void main(String[] args) {
              int[] riders = {2, 7, 9, 3, 1};
              int twoBack = 0;
              int oneBack = 0;
              for (int r : riders) {
                  int best = Math.max(oneBack, twoBack + r);
                  twoBack = oneBack;
                  oneBack = best;
              }
              System.out.println(oneBack);
          }
      }
    answer: "12"
    explain: "The best picks are stations 0, 2 and 4: 2 + 9 + 1 = 12. Taking 7 and 3 only gives 10."
    reteach: "### Pattern 1: take or skip"


  - id: q08
    type: predict-output
    concept: grid-paths
    code: |
      public class Main {
          public static void main(String[] args) {
              long[][] routes = new long[2][3];
              boolean[][] closed = new boolean[2][3];
              closed[0][1] = true;
              for (int r = 0; r < 2; r++) {
                  for (int c = 0; c < 3; c++) {
                      if (closed[r][c]) {
                          routes[r][c] = 0;
                      } else if (r == 0 && c == 0) {
                          routes[r][c] = 1;
                      } else {
                          long fromAbove = r > 0 ? routes[r - 1][c] : 0;
                          long fromLeft = c > 0 ? routes[r][c - 1] : 0;
                          routes[r][c] = fromAbove + fromLeft;
                      }
                  }
              }
              System.out.println(routes[1][2]);
          }
      }
    answer: "1"
    explain: "The closed square cuts off the top row, so row 0 is 1, 0, 0. Row 1 is 1, 1, 1. Only the route down first, then right, is left."
    reteach: "### Pattern 3: paths through a grid"

  - id: q09
    type: spot-the-bug
    concept: knapsack
    code: |
      static int bestTruckLoad(int[] weights, int[] values, int capacity) {
          int[] best = new int[capacity + 1];
          for (int i = 0; i < weights.length; i++) {
              for (int w = weights[i]; w <= capacity; w++) {
                  best[w] = Math.max(best[w], best[w - weights[i]] + values[i]);
              }
          }
          return best[capacity];
      }
    prompt: "Each crate may go on the truck only once, but this code can load the same crate twice. Which line is wrong?"
    bugLine: 4
    explain: "Going up, best[w - weights[i]] already includes this crate. Loop w from capacity down to weights[i] instead."
    reteach: "### Syntax: one row, filled backwards"


  - id: q06
    type: predict-output
    concept: coin-change
    code: |
      public class Main {
          public static void main(String[] args) {
              int[] coins = {1, 2};
              long[] ways = new long[5];
              ways[0] = 1;
              for (int coin : coins) {
                  for (int a = coin; a <= 4; a++) {
                      ways[a] += ways[a - coin];
                  }
              }
              System.out.println(ways[4]);
          }
      }
    answer: "3"
    explain: "The coins are in the outer loop, so it counts mixes: 1+1+1+1, 1+1+2 and 2+2. That is 3."
    reteach: "### Counting ways: loop order matters"


  - id: q06
    type: predict-output
    concept: memoization
    code: |
      import java.util.HashMap;
      import java.util.Map;

      public class Main {
          static int calls = 0;
          static Map<Integer, Long> memo = new HashMap<>();

          static long fib(int n) {
              calls++;
              if (n < 2) {
                  return n;
              }
              if (memo.containsKey(n)) {
                  return memo.get(n);
              }
              long answer = fib(n - 1) + fib(n - 2);
              memo.put(n, answer);
              return answer;
          }

          public static void main(String[] args) {
              System.out.println(fib(6));
              System.out.println(calls);
          }
      }
    answer: "8\n11"
    explain: "fib(6) is 8. Each n from 6 down to 2 does real work once, and the memo answers the repeats, so there are only 11 calls."
    reteach: "## Concept"


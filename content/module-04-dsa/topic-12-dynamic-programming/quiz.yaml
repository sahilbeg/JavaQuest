    code: |
      static long fib(int n) {
          if (n < 2) {
              return n;
          }
          long[] table = new long[n];
          table[1] = 1;
          for (int i = 2; i <= n; i++) {
              table[i] = table[i - 1] + table[i - 2];
          }
          return table[n];
      }
    prompt: "fib(10) crashes with ArrayIndexOutOfBoundsException. Which line is wrong?"
    bugLine: 5
    explain: "The table needs cells 0 to n, which is n + 1 cells. Use new long[n + 1]."
    reteach: "## Common mistakes"


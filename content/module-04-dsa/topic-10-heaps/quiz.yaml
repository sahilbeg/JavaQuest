  - id: q04
    type: predict-output
    concept: sift-up
    code: |
      import java.util.Arrays;

      public class Main {
          static int[] items = new int[6];
          static int size = 0;

          static void add(int value) {
              items[size] = value;
              size++;
              int i = size - 1;
              while (i > 0 && items[i] < items[(i - 1) / 2]) {
                  int parent = (i - 1) / 2;
                  int temp = items[i];
                  items[i] = items[parent];
                  items[parent] = temp;
                  i = parent;
              }
          }

          public static void main(String[] args) {
              add(4);
              add(6);
              add(5);
              add(1);
              System.out.println(Arrays.toString(Arrays.copyOf(items, size)));
          }
      }
    answer: "[1, 4, 5, 6]"
    explain: "1 lands at index 3 under 6, swaps to index 1, then swaps with 4 at the root. 4 and 6 move down one step each."
    reteach: "## Concept"

  - id: q05
    type: predict-output
    concept: priority-queue
    code: |
      import java.util.Comparator;
      import java.util.PriorityQueue;

      public class Main {
          public static void main(String[] args) {
              PriorityQueue<String> queue = new PriorityQueue<>(Comparator.comparingInt(String::length));
              queue.add("Harbor");
              queue.add("Uptown");
              queue.add("Old Mill");
              queue.add("Dock");
              System.out.println(queue.poll());
              System.out.println(queue.peek().length());
              System.out.println(queue.size());
          }
      }
    answer: "Dock\n6\n3"
    explain: "The comparator makes the shortest name the smallest. poll removes Dock. peek looks at a 6-letter name without removing it, so 3 are left."
    reteach: "## Try it"

  - id: q06

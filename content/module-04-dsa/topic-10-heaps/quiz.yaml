  - id: q08
    type: spot-the-bug
    concept: sift-down
    code: |
      int left = 2 * i + 1;
      int right = 2 * i + 2;
      int smallest = i;
      if (left < size && items[left] < items[smallest]) {
          smallest = left;
      }
      if (right < size && items[right] > items[smallest]) {
          smallest = right;
      }
    bugLine: 7
    explain: "The right child must be picked when it is smaller. Line 7 uses > and picks a bigger child, which breaks the heap order."
    reteach: "## Concept"


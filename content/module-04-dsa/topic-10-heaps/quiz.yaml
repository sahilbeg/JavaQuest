    concept: heapify
    prompt: "You turn an array of n values into a heap by sifting down every parent, from the last parent back to the root. How long does that take?"
    choices: ["O(n), because most nodes are near the bottom and barely move", "O(n log n), because every node sifts down log n levels", "O(log n), because the tree has log n levels", "O(n²), because every node is compared with every other"]
    answer: 0
    explain: "Half the nodes are leaves and do nothing, a quarter move at most one level, and so on. The total work is about n, so heapify is O(n)."
    reteach: "### Building a heap in O(n)"

  - id: q12
    type: predict-output
    concept: comparator-pitfalls
    code: |
      public class Main {
          public static void main(String[] args) {
              Integer a = 100;
              Integer b = 100;
              Integer c = 1000;
              Integer d = 1000;
              System.out.println(a == b);
              System.out.println(c == d);
          }
      }
    answer: "true\nfalse"
    explain: "Java reuses Integer objects from -128 to 127, so a and b are the same object. 1000 is boxed into two different objects, and == compares objects. Use equals or Integer.compare."
    reteach: "## Common mistakes"

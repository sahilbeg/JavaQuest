    prompt: "Put the steps of poll on a min-heap in order."
    items:
      - "Save items[0] as the value to return"
      - "Shrink size by one and move the last value into index 0"
      - "Swap the top down with its smaller child until no child is smaller"
      - "Return the saved value"
    explain: "Keep the top, fill the hole with the last value, then sift down to repair the order."
    reteach: "## Concept"


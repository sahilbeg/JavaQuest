  - id: q02
    type: predict-output
    concept: trie
    code: |
      import java.util.Map;
      import java.util.TreeMap;

      public class Main {
          static class Node {
              Map<Character, Node> children = new TreeMap<>();
              boolean endsWord;
          }

          static Node root = new Node();

          static void insert(String word) {
              Node node = root;
              for (char c : word.toCharArray()) {
                  node = node.children.computeIfAbsent(c, key -> new Node());
              }
              node.endsWord = true;
          }

          static Node walk(String text) {
              Node node = root;
              for (char c : text.toCharArray()) {
                  node = node.children.get(c);
                  if (node == null) {
                      return null;
                  }
              }
              return node;
          }

          public static void main(String[] args) {
              insert("dock");
              insert("docks");
              Node a = walk("doc");
              Node b = walk("docks");
              Node c = walk("dot");
              System.out.println((a != null) + " " + (a != null && a.endsWord));
              System.out.println((b != null) + " " + (b != null && b.endsWord));
              System.out.println(c != null);
          }
      }
    answer: "true false\ntrue true\nfalse"
    explain: "doc is a path but not a stored word. docks is stored, so its flag is set. No word has the letters dot, so walk returns null."
    reteach: "### Insert, contains and startsWith"


  - id: q08
    type: spot-the-bug
    concept: union-find
    prompt: "After connect(0, 1) and connect(0, 2), stations 1 and 2 are not connected. Which line is wrong?"
    code: |
      static int find(int s) {
          while (parent[s] != s) {
              s = parent[s];
          }
          return s;
      }

      static void connect(int a, int b) {
          parent[a] = b;
      }
    bugLine: 9
    explain: "connect must link the two roots: parent[find(b)] = find(a). Linking the stations overwrites a's old link and splits its group."
    reteach: "### Syntax: connect with union by size"

  - id: q09
    type: predict-output
    concept: union-find
    code: |
      public class Main {
          static int[] parent = {0, 1, 2, 3, 4, 5};
          static int groups = 6;

          static int find(int s) {
              while (parent[s] != s) {
                  s = parent[s];
              }
              return s;
          }

          static boolean connect(int a, int b) {
              int ra = find(a);
              int rb = find(b);
              if (ra == rb) {
                  return false;
              }
              parent[rb] = ra;
              groups--;
              return true;
          }

          public static void main(String[] args) {
              System.out.print(connect(0, 1) + " ");
              System.out.print(connect(2, 3) + " ");
              System.out.print(connect(1, 3) + " ");
              System.out.println(connect(0, 2));
              System.out.println(groups);
          }
      }
    answer: "true true true false\n3"
    explain: "Three lanes merge groups, so 6 becomes 3. By then 0 and 2 share a root, so the last connect returns false."
    reteach: "### Union-find: groups that only merge"


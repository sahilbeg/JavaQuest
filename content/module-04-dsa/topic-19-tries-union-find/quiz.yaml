  - id: q11
    type: order
    concept: cycle-detection-kruskal
    prompt: "Put the steps of Kruskal's algorithm in order."
    items:
      - "Sort the lanes by cost, cheapest first, and make every station its own group"
      - "Take the next lane and check whether its stations already share a root"
      - "If they do not, connect them and add the lane's cost"
      - "When the lanes run out, check that one group is left"
    explain: "Kruskal is greedy: it takes the cheapest lane that does not close a loop, and union-find spots the loops."
    reteach: "### Kruskal: the cheapest lane network"


  - id: q02
    type: predict-output
    concept: merging
    code: |
      import java.util.Arrays;

      public class Main {
          static int[] merge(int[] left, int[] right) {
              int[] result = new int[left.length + right.length];
              int i = 0;
              int j = 0;
              int k = 0;
              while (i < left.length && j < right.length) {
                  if (left[i] <= right[j]) {
                      result[k] = left[i];
                      i++;
                  } else {
                      result[k] = right[j];
                      j++;
                  }
                  k++;
              }
              while (i < left.length) {
                  result[k] = left[i];
                  i++;
                  k++;
              }
              while (j < right.length) {
                  result[k] = right[j];
                  j++;
                  k++;
              }
              return result;
          }

          public static void main(String[] args) {
              System.out.println(Arrays.toString(merge(new int[] {2, 8}, new int[] {5})));
          }
      }
    answer: "[2, 5, 8]"
    explain: "2 is smaller than 5, then 5 is smaller than 8. The right side runs out, so 8 is copied as a leftover."
    reteach: "## Concept"


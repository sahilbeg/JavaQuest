  - id: q06
    type: predict-output
    concept: partition
    code: |
      import java.util.Arrays;

      public class Main {
          static int partition(int[] a, int low, int high) {
              int pivot = a[high];
              int i = low;
              for (int j = low; j < high; j++) {
                  if (a[j] <= pivot) {
                      int temp = a[i];
                      a[i] = a[j];
                      a[j] = temp;
                      i++;
                  }
              }
              int temp = a[i];
              a[i] = a[high];
              a[high] = temp;
              return i;
          }

          public static void main(String[] args) {
              int[] a = {7, 2, 9, 4};
              int p = partition(a, 0, 3);
              System.out.println(p);
              System.out.println(Arrays.toString(a));
          }
      }
    answer: "1\n[2, 4, 9, 7]"
    explain: "The pivot is 4. Only 2 is <= 4, so 2 moves to index 0 and the pivot lands at index 1."
    reteach: "## Concept"


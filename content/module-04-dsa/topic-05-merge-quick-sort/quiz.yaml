  - id: q09
    type: spot-the-bug
    concept: quicksort
    prompt: "This quicksort crashes with StackOverflowError on some arrays. Which line is wrong?"
    code: |
      static void quickSort(int[] a, int low, int high) {
          if (low >= high) {
              return;
          }
          int p = partition(a, low, high);
          quickSort(a, low, p);
          quickSort(a, p + 1, high);
      }
    bugLine: 6
    explain: "The pivot at p is already in place. The left call must stop at p - 1, or it can repeat the same range until the stack overflows."
    reteach: "## Common mistakes"


    choices: ["Each call peels off one item, so the calls nest about n deep", "The array is too big for the heap", "partition swaps items past the end of the array", "Sorted arrays cannot be partitioned"]
    answer: 0
    explain: "On sorted input every split is n - 1 and 0 items, so the calls go n deep. A random pivot and recursing on the smaller side keep the depth near log n."

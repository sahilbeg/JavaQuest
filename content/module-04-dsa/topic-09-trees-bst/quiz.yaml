  - id: q08
    type: spot-the-bug
    concept: bst-insert-search
    code: |
      static boolean contains(Node node, int bike) {
          if (node == null) {
              return true;
          }
          if (bike == node.bike) {
              return true;
          }
          if (bike < node.bike) {
              return contains(node.left, bike);
          }
          return contains(node.right, bike);
      }
    bugLine: 3
    explain: "Reaching null means the search fell off the tree, so the bike is missing. Line 3 must return false, or every search says yes."
    reteach: "## Concept"


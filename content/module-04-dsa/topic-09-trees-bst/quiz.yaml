  - id: q12
    type: predict-output
    concept: treemap-navigation
    code: |
      import java.util.TreeMap;

      public class Main {
          public static void main(String[] args) {
              TreeMap<Integer, String> bikes = new TreeMap<>();
              bikes.put(1003, "Uptown");
              bikes.put(1042, "Harbor");
              bikes.put(1088, "Depot");
              System.out.println(bikes.floorKey(1050));
              System.out.println(bikes.ceilingKey(1050));
              System.out.println(bikes.floorKey(1000));
          }
      }
    answer: "1042\n1088\nnull"
    explain: "floorKey gives the largest key at or below 1050, which is 1042. ceilingKey gives the smallest key at or above 1050, which is 1088. No key is at or below 1000, so floorKey returns null."
    reteach: "### TreeMap navigation"

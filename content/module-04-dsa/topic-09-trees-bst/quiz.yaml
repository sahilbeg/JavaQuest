  - id: q04
    type: predict-output
    concept: traversals
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          static Node insert(Node node, int bike) {
              if (node == null) {
                  return new Node(bike);
              }
              if (bike < node.bike) {
                  node.left = insert(node.left, bike);
              } else if (bike > node.bike) {
                  node.right = insert(node.right, bike);
              }
              return node;
          }

          static void inOrder(Node node, List<Integer> out) {
              if (node == null) {
                  return;
              }
              inOrder(node.left, out);
              out.add(node.bike);
              inOrder(node.right, out);
          }

          public static void main(String[] args) {
              Node root = null;
              int[] arrivals = {50, 30, 70, 30, 60, 10};
              for (int bike : arrivals) {
                  root = insert(root, bike);
              }
              List<Integer> out = new ArrayList<>();
              inOrder(root, out);
              System.out.println(out);
          }
      }

      class Node {
          int bike;
          Node left;
          Node right;

          Node(int bike) {
              this.bike = bike;
          }
      }
    answer: "[10, 30, 50, 60, 70]"
    explain: "In-order visits left, node, right, so a BST comes out sorted. The second 30 is a duplicate and is ignored."
    reteach: "## Worked example"

  - id: q05
    type: predict-output
    concept: tree-height
    code: |
      public class Main {
          static Node insert(Node node, int bike) {
              if (node == null) {
                  return new Node(bike);
              }
              if (bike < node.bike) {
                  node.left = insert(node.left, bike);
              } else if (bike > node.bike) {
                  node.right = insert(node.right, bike);
              }
              return node;
          }

          static int height(Node node) {
              if (node == null) {
                  return 0;
              }
              return 1 + Math.max(height(node.left), height(node.right));
          }

          public static void main(String[] args) {
              Node sorted = null;
              Node mixed = null;
              int[] a = {1, 2, 3, 4};
              int[] b = {3, 1, 4, 2};
              for (int i = 0; i < 4; i++) {
                  sorted = insert(sorted, a[i]);
                  mixed = insert(mixed, b[i]);
              }
              System.out.println(height(sorted));
              System.out.println(height(mixed));
          }
      }

      class Node {
          int bike;
          Node left;
          Node right;

          Node(int bike) {
              this.bike = bike;
          }
      }
    answer: "4\n3"
    explain: "Sorted input always goes right, so it builds a chain of 4. The mixed order puts 1 and 4 on both sides of 3, and 2 under 1, so the height is 3."
    reteach: "## Try it"


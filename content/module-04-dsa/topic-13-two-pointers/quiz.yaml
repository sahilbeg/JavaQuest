  - id: q06
    type: mcq
    concept: variable-window
    prompt: "Why does a shrinking window only work when no value is negative?"
    choices: ["With negatives, a total that is too big now might drop later, so shrinking can throw away good stretches", "Java arrays cannot hold negative numbers", "Negative values make the loop run forever", "Math.max does not work with negative numbers"]
    answer: 0
    explain: "With values of 0 or more, adding can only raise the total and removing can only lower it. Negatives break that, so shrinking is no longer safe."
    reteach: "### Variable-size window"

  - id: q07
    type: mcq
    concept: variable-window
    prompt: "A variable window has a while loop inside a for loop. Why is it still O(n)?"
    choices: ["left only moves forward, so it moves at most n times in the whole run", "The while loop runs at most once per step", "Java optimises nested loops away", "The array is always sorted"]
    answer: 0
    explain: "right moves n times and left moves at most n times in total. That is at most 2n moves, so O(n)."

  - id: q12
    type: predict-output
    concept: frequency-counting
    code: |
      public class Main {
          public static void main(String[] args) {
              int[] counts = new int[26];
              for (char c : "harbor".toCharArray()) {
                  counts[c - 'a']++;
              }
              System.out.println(counts['r' - 'a']);
              System.out.println(counts['z' - 'a']);
          }
      }
    answer: "2\n0"
    explain: "harbor has two r letters, so slot 'r' - 'a' holds 2. There is no z, so its slot stays 0."
    reteach: "### Frequency counting"

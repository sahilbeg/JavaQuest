  - id: q01
    type: mcq
    concept: opposite-pointers
    variants:
      - { prompt: "Fares are sorted from cheap to expensive. fares[left] + fares[right] is smaller than the target. What should you do?", choices: ["Move left up by one", "Move right down by one", "Move both pointers", "Start again from the beginning"], answer: 0 }
      - { prompt: "Fares are sorted from cheap to expensive. fares[left] + fares[right] is bigger than the target. What should you do?", choices: ["Move right down by one", "Move left up by one", "Move both pointers", "Sort the fares again"], answer: 0 }
    explain: "A sum that is too small needs a bigger left fare, so left moves up. A sum that is too big needs a smaller right fare, so right moves down. Each move rules out one fare for good."
    reteach: "### Opposite ends: a pair with a target total"

  - id: q02
    type: predict-output
    concept: opposite-pointers
    code: |
      public class Main {
          public static void main(String[] args) {
              int[] fares = {100, 300, 450, 600, 800};
              int target = 1050;
              int left = 0;
              int right = fares.length - 1;
              while (left < right) {
                  int sum = fares[left] + fares[right];
                  if (sum == target) {
                      System.out.println(left + " " + right);
                      return;
                  } else if (sum < target) {
                      left++;
                  } else {
                      right--;
                  }
              }
              System.out.println("none");
          }
      }
    answer: "2 3"
    explain: "100 + 800 is too small, so left moves to 300. 300 + 800 is too big, so right moves to 600. 300 + 600 is too small, so left moves to 450. 450 + 600 is 1050."
    reteach: "### Opposite ends: a pair with a target total"

  - id: q03
    type: predict-output
    concept: fast-slow-pointers
    code: |
      public class Main {
          public static void main(String[] args) {
              int[] ids = {3, 3, 3, 5, 5, 8};
              int slow = 0;
              for (int fast = 1; fast < ids.length; fast++) {
                  if (ids[fast] != ids[slow]) {
                      slow++;
                      ids[slow] = ids[fast];
                  }
              }
              System.out.println(slow + 1);
              System.out.println(ids[1]);
          }
      }
    answer: "3\n5"
    explain: "There are 3 different values, 3, 5 and 8. They are copied to the front, so ids[1] now holds 5."
    reteach: "### Same direction: fast and slow pointers"


  - id: q08
    type: predict-output
    concept: prefix-sums
    code: |
      public class Main {
          public static void main(String[] args) {
              int[] rides = {3, 1, 4, 1, 5};
              long[] prefix = new long[rides.length + 1];
              for (int i = 0; i < rides.length; i++) {
                  prefix[i + 1] = prefix[i] + rides[i];
              }
              System.out.println(prefix[4] - prefix[1]);
          }
      }
    answer: "6"
    explain: "prefix[4] - prefix[1] is the total of indexes 1 to 3: 1 + 4 + 1 = 6."
    reteach: "### Prefix sums"

  - id: q09
    type: spot-the-bug
    concept: prefix-sums
    code: |
      static long[] prefixSums(int[] values) {
          long[] prefix = new long[values.length];
          for (int i = 0; i < values.length; i++) {
              prefix[i + 1] = prefix[i] + values[i];
          }
          return prefix;
      }
    prompt: "prefixSums crashes with ArrayIndexOutOfBoundsException. Which line is wrong?"
    bugLine: 2
    explain: "The prefix array needs one more cell than the data, for the 0 at the front. Use new long[values.length + 1]."
    reteach: "### Syntax: prefix sums"

  - id: q10
    type: order
    concept: prefix-sum-hashmap
    prompt: "Put the steps for counting stretches that add up to k in order."
    items:
      - "Seed the map with seen.put(0L, 1)"
      - "Add the next value to running"
      - "Add seen.getOrDefault(running - k, 0) to count"
      - "Record running with seen.merge(running, 1, Integer::sum)"
    explain: "Seed first, so stretches from index 0 count. In each step, update the total, look up before you store, then record the new total."
    reteach: "### Prefix sums and a HashMap"


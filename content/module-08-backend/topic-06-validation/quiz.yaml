    variants:
      - prompt: "Which ProblemDetail field holds the path of the request that failed?"
        choices: ["instance", "type", "title", "detail"]
        answer: 0
      - prompt: "Which ProblemDetail field is a web address that names the kind of problem, so the app can compare it?"
        choices: ["type", "instance", "status", "detail"]
        answer: 0
      - prompt: "Which Content-Type does Spring send with a ProblemDetail body?"
        choices: ["application/problem+json", "text/plain", "application/xml", "text/html"]

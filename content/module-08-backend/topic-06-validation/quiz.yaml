    variants:
      - prompt: "A rider asks for bike B-2001, which another rider is using. Which status fits?"
        choices: ["409 Conflict", "404 Not Found", "400 Bad Request", "500 Internal Server Error"]
        answer: 0
      - prompt: "A rider asks for bike B-9999, and no bike has that id. Which status fits?"
        choices: ["404 Not Found", "409 Conflict", "400 Bad Request", "500 Internal Server Error"]
        answer: 0
      - prompt: "A NullPointerException is thrown inside our own service. Which status fits?"
        choices: ["500 Internal Server Error", "400 Bad Request", "404 Not Found", "409 Conflict"]
        answer: 0
    explain: "4xx means the request needs to change: 400 bad input, 404 no such thing, 409 a clash with the current state. 5xx means our server has a problem."

ticket:
  key: SPK-0808
  from: maya
  title: "Rentals service must read and write rides, safely"
  body: >
    The rentals service needs to save rides and read them back itself, without an engineer running SQL by hand.
    Also, Itachi forwarded a rider report: typing ' OR '1'='1 into the rider search showed everybody's rides.
    Can you build JdbcRideRepository so it does both jobs, and make sure that trick finds nothing?
hints:
  - "Copy the shape of createSchema: try-with-resources around the Connection and the statement, and a catch that throws RideRepositoryException."
  - "Use connection.prepareStatement(sql) with ? in the SQL, then statement.setString(1, riderId) before executeQuery(). For save, pass Statement.RETURN_GENERATED_KEYS as the second argument."
  - "findByRider: try (ResultSet rows = statement.executeQuery()) { while (rows.next()) { rides.add(toRide(rows)); } }. In save, after executeUpdate(), read keys.next() and keys.getLong(1) from statement.getGeneratedKeys()."
review: true

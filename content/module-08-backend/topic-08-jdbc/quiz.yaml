  - id: q10
    type: mcq
    concept: generated-keys
    prompt: "After executeUpdate() inserts a ride whose id the database generates, how do you read the new id?"
    choices:
      - "Call statement.getGeneratedKeys(), then next() and getLong(1)"
      - "Read the return value of executeUpdate(), which is the new id"
      - "Run SELECT MAX(id) FROM ride and hope no one else inserted"
      - "Read the id field of the NewRide you passed in"
    answer: 0
    explain: "executeUpdate returns the number of rows changed, not the id. getGeneratedKeys() returns a small ResultSet holding the new id."
    reteach: "## Concept"

  - id: q11
    type: predict-output
    concept: sql-injection
    code: |
      import java.sql.*;

      public class Main {
          public static void main(String[] args) throws SQLException {
              try (Connection connection = DriverManager.getConnection("jdbc:h2:mem:quiz");
                   Statement statement = connection.createStatement()) {
                  statement.executeUpdate("CREATE TABLE ride (id INT PRIMARY KEY, rider_id VARCHAR(20))");
                  statement.executeUpdate("INSERT INTO ride VALUES (1, 'r-17'), (2, 'r-23'), (3, 'r-42')");
                  String input = "r-99' OR '1'='1";

                  int unsafe = 0;
                  try (ResultSet rows = statement.executeQuery(
                          "SELECT id FROM ride WHERE rider_id = '" + input + "'")) {
                      while (rows.next()) unsafe++;
                  }

                  int safe = 0;
                  try (PreparedStatement search = connection.prepareStatement("SELECT id FROM ride WHERE rider_id = ?")) {
                      search.setString(1, input);
                      try (ResultSet rows = search.executeQuery()) {
                          while (rows.next()) safe++;
                      }
                  }
                  System.out.println("unsafe: " + unsafe);
                  System.out.println("safe: " + safe);
              }
          }
      }
    answer: "unsafe: 3\nsafe: 0"
    explain: "Glued into the SQL, the input adds OR '1'='1', which is true for all 3 rows. Sent as a ? value, it is just a strange rider id that matches nothing."
    reteach: "## Concept"

  - id: q12
    type: mcq
    concept: sql-injection
    prompt: "Which change stops SQL injection in the rider search?"
    choices:
      - "Put a ? in the SQL and pass the input with setString"
      - "Remove the spaces from the input before gluing it into the SQL"
      - "Use executeUpdate instead of executeQuery"
      - "Write the SQL keywords in lower case"
    answer: 0
    explain: "With a ? parameter the SQL text and the value travel separately, so typed input can never become part of the SQL."
    reteach: "## Concept"

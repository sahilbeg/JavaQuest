    reteach: "## Concept"

  - id: q07
    type: mcq
    concept: resource-cleanup
    prompt: "A repository opens a connection on every request and never closes it. What happens as riders keep using the service?"
    choices:
      - "Open sessions pile up until the database or the pool has none left, and requests hang"
      - "Nothing, because Java's garbage collector closes connections at once"
      - "Each new connection closes the previous one"
      - "The compiler refuses to build the code"
    answer: 0
    explain: "Each open connection is a session holding memory in the database. Servers and pools allow only a few, so leaks end with requests waiting forever."
    reteach: "## Concept"

  - id: q08
    type: mcq
    concept: resource-cleanup
    prompt: "A try-with-resources opens a Connection, then a PreparedStatement, then a ResultSet. In what order are they closed?"
    choices:
      - "ResultSet, then PreparedStatement, then Connection"
      - "Connection, then PreparedStatement, then ResultSet"
      - "Only the Connection is closed"
      - "In a random order"
    answer: 0
    explain: "Resources close in reverse order of opening, so the rows go first and the connection last. They close even when an exception is thrown."
    reteach: "## Concept"

  - id: q09

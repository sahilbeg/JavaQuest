  - id: q04
    type: spot-the-bug
    concept: prepared-statements
    code: |
      PreparedStatement statement = connection.prepareStatement(
              "SELECT id FROM ride WHERE rider_id = ?");
      statement.setString(0, "r-17");
      ResultSet rows = statement.executeQuery();
    bugLine: 3
    explain: "Parameters are numbered from 1, so the first ? is setString(1, ...). Index 0 throws Invalid value \"0\" for parameter \"parameterIndex\"."
    reteach: "## Common mistakes"

  - id: q05
    type: predict-output
    concept: result-sets
    code: |
      import java.sql.*;

      public class Main {
          public static void main(String[] args) throws SQLException {
              try (Connection connection = DriverManager.getConnection("jdbc:h2:mem:quiz");
                   Statement statement = connection.createStatement()) {
                  statement.executeUpdate("CREATE TABLE ride (id INT PRIMARY KEY, minutes INT)");
                  statement.executeUpdate("INSERT INTO ride VALUES (1, 12), (2, NULL), (3, 30)");
                  try (ResultSet rows = statement.executeQuery("SELECT id, minutes FROM ride ORDER BY id")) {
                      while (rows.next()) {
                          System.out.println(rows.getInt("id") + ":" + rows.getInt("minutes"));
                      }
                  }
              }
          }
      }
    answer: "1:12\n2:0\n3:30"
    explain: "next() visits each row in turn. getInt returns 0 for a NULL value, so ride 2 prints 0. Call wasNull() if you must tell them apart."
    reteach: "## Concept"

  - id: q06
    type: order
    concept: result-sets
    prompt: "Put the lines in order to print the id of r-17's first ride."
    items:
      - "PreparedStatement statement = connection.prepareStatement(\"SELECT id FROM ride WHERE rider_id = ?\");"
      - "statement.setString(1, \"r-17\");"
      - "ResultSet rows = statement.executeQuery();"
      - "rows.next();"
      - "System.out.println(rows.getLong(\"id\"));"

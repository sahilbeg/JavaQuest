questions:
  - id: q01
    type: mcq
    concept: connections
    variants:
      - prompt: "What is a JDBC driver?"
        choices:
          - "A library that implements the java.sql interfaces for one particular database"
          - "The SQL statement that creates a table"
          - "A Java class you write to hold one row"
          - "The program that runs your JUnit tests"
        answer: 0
      - prompt: "What is the main job of a DataSource?"
        choices:
          - "To hand out connections, so your repository never needs to know the URL"
          - "To store rows in memory instead of a database"
          - "To turn a ResultSet into records"
          - "To check SQL for typing mistakes before it runs"
        answer: 0
      - prompt: "Why does a Spring Boot service get its connections from a pool such as HikariCP?"
        choices:
          - "Opening a connection is slow, so the pool keeps a few open and lends them out again and again"
          - "A pool lets the service open as many connections as it likes, with no limit"
          - "Without a pool, JDBC cannot run SQL at all"
          - "A pool stores query results so the database is never asked twice"
        answer: 0
    explain: "Your code talks to the java.sql interfaces. The driver implements them for one database, and a DataSource, set up once by the app, hands out connections. In production that DataSource is a pool, because opening a connection is slow."
    reteach: "## Concept"

  - id: q02
    type: mcq
    concept: connections
    prompt: "One connection creates the ride table and closes. The next connection to jdbc:h2:mem:spoke says Table \"RIDE\" not found. Why?"
    choices:
      - "The in-memory database disappeared when its last connection closed"
      - "Table names must be written in capitals in Java"
      - "Each connection can only see tables it created itself"
      - "CREATE TABLE needs executeQuery, not executeUpdate"
    answer: 0
    explain: "An in-memory H2 database lives only while a connection is open. Add ;DB_CLOSE_DELAY=-1 to the URL to keep it until the program ends."
    reteach: "## Common mistakes"

  - id: q03
    type: fill-blank
    concept: prepared-statements
    prompt: "statement.___(1, riderId); // riderId is a String"
    answers: ["setString"]
    explain: "setString fills a ? with text. The 1 means the first ?, because JDBC counts from 1."

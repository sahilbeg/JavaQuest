ticket:
  key: SPK-0512
  from: maya
  title: "Dock sensor handler ignored a mystery message"
  body: >
    A dock sensor at Harbor only ever sends three messages: BikeDocked, BikeUndocked and Fault.
    Last week someone added a fourth message class in another package, and our handler skipped it
    without a word. Bike B-1042 sat in a dock for an hour while the app said the dock was free.
    Can you lock the message family down so that can't happen again?
hints:
  - "The interface needs two new words: one that closes it, and one that lists who may implement it."
  - "describe() is an if / else if chain. Each branch uses instanceof with a pattern variable, like e instanceof BikeDocked d."
  - "Try: public sealed interface DockEvent permits BikeDocked, BikeUndocked, Fault { } and in freeDocksChange add -1 for BikeDocked and +1 for BikeUndocked."
review: true

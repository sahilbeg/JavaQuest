  - id: q01
    type: mcq
    concept: race-condition
    variants:
      - { prompt: "Why can count++ lose updates when two threads run it?", choices: ["It is three steps: read, add, write, and another thread can slip in between", "Java skips ++ on threads", "int cannot hold big numbers", "count++ only works in the main thread"], answer: 0 }
      - { prompt: "What is a race condition?", choices: ["A bug whose result depends on which thread happens to run first", "A thread that runs faster than the others", "A loop that never ends", "A compile error about threads"], answer: 0 }
    explain: "count++ reads, adds and writes. Two threads can both read the same old value, so one update is lost."
    reteach: "## Concept"

  - id: q02
    type: mcq
    concept: synchronized
    prompt: "What does marking a method synchronized do?"
    choices: ["Only one thread at a time can run synchronized methods on that object", "The method runs on a new thread", "The method runs twice as fast", "The method can no longer be called from main"]
    answer: 0
    explain: "A synchronized method takes the object's intrinsic lock, and only one thread can hold it."
    reteach: "## Concept"

  - id: q03
    type: mcq
    concept: synchronized
    prompt: "Which word fills the blank, so only one thread at a time can run increment()? ___ void increment() { count++; }"
    choices: ["synchronized", "volatile", "final", "public"]
    answer: 0
    explain: "The synchronized keyword makes the method take the object's lock. final and public do nothing for threads, and volatile is not allowed on a method."
    reteach: "## Concept"

  - id: q04
    type: predict-output
    concept: synchronized
    code: |
      public class Main {
          public static void main(String[] args) throws InterruptedException {
              Counter c = new Counter();
              Runnable job = () -> {
                  for (int i = 0; i < 1000; i++) {
                      c.increment();
                  }
              };
              Thread a = new Thread(job);
              Thread b = new Thread(job);
              a.start();
              b.start();
              a.join();
              b.join();
              System.out.println(c.get());
          }
      }

      class Counter {
          private int count = 0;

          synchronized void increment() {
              count++;
          }

          synchronized int get() {
              return count;
          }
      }
    answer: "2000"
    explain: "Both methods are synchronized, and main joins both threads, so no update is lost."
    reteach: "## Concept"

  - id: q05
    type: order
    concept: reentrant-lock
    prompt: "Put the lines in order to protect count with a ReentrantLock."
    items:
      - "lock.lock();"
      - "try {"
      - "    count++;"
      - "} finally {"
      - "    lock.unlock();"
      - "}"
    explain: "Take the lock, do the work in try, and give the lock back in finally."
    reteach: "## Concept"

  - id: q06
    type: mcq
    concept: reentrant-lock
    prompt: "Why does lock.unlock() go inside a finally block?"
    choices: ["So the lock is given back even if the work throws an exception", "Because unlock() only compiles inside finally", "So the work runs on a new thread", "To make the lock reentrant"]
    answer: 0
    explain: "finally always runs. Without it, an exception would leave the lock held forever."
    reteach: "## Common mistakes"

  - id: q07
    type: spot-the-bug
    concept: check-then-act
    prompt: "Which line is missing a keyword that would stop two riders getting the last bike?"
    code: |
      class Dock {
          private int bikes = 1;

          boolean tryUnlock() {
              if (bikes > 0) {
                  bikes--;
                  return true;
              }
              return false;
          }
      }
    bugLine: 4
    explain: "tryUnlock is not synchronized, so two threads can both pass the check before either takes the bike. Add synchronized to line 4."
    reteach: "## Concept"

  - id: q08
    type: mcq
    concept: deadlock
    prompt: "Thread A locks wallet 17 then wallet 42. Thread B locks wallet 42 then wallet 17. What can happen?"
    choices: ["A deadlock: each holds one lock and waits forever for the other", "Both finish faster", "A compile error", "The count goes negative"]
    answer: 0
    explain: "Taking two locks in opposite order can leave each thread waiting for the other forever."
    reteach: "## Concept"

  - id: q09
    type: mcq
    concept: deadlock
    prompt: "What is the usual fix for a deadlock caused by two locks?"
    choices: ["Every thread takes the locks in the same fixed order", "Call Thread.sleep before each lock", "Remove all locks", "Start the threads in a different order"]
    answer: 0
    explain: "If every thread takes lock 1 before lock 2, no thread can hold lock 2 while waiting for lock 1."
    reteach: "### The four conditions for deadlock"

  - id: q10
    type: fill-blank
    concept: check-then-act
    goal: "Guard the bike count with the lock that belongs to the current object."
    prompt: "synchronized (___) { if (bikes > 0) { bikes--; } }   // lock (the current object)"
    answers: ["this"]
    explain: "A synchronized block names the object whose lock it takes, and this is the current object. In real code, a private final lock object is safer, because outside code cannot grab it."
    reteach: "## Concept"

  - id: q11
    type: mcq
    concept: thread-dump
    variants:
      - { prompt: "The kiosk app has frozen but not crashed. Which command shows what every thread is doing?", choices: ["jcmd <pid> Thread.print", "java -version", "javac -verbose", "jcmd <pid> VM.version"], answer: 0 }
      - { prompt: "A thread dump shows two threads in state BLOCKED, each waiting to lock a monitor held by the other. What is this?", choices: ["A deadlock", "A race condition that lost an update", "A thread waiting in Thread.sleep", "A normal, healthy program"], answer: 0 }
    explain: "jcmd <pid> Thread.print (or jstack <pid>) prints a thread dump. Two BLOCKED threads, each holding what the other wants, is a deadlock, and the JVM reports it as \"Found one Java-level deadlock\"."
    reteach: "### Finding a deadlock"

  - id: q12
    type: mcq
    concept: deadlock
    prompt: "Taking locks in a fixed order prevents deadlock. Which of the four deadlock conditions does it break?"
    choices: ["Circular wait", "Mutual exclusion", "No preemption", "Hold and wait"]
    answer: 0
    explain: "With a fixed lock order, a thread never waits for a lock ranked below one it holds, so no circle of waiting threads can form."
    reteach: "### The four conditions for deadlock"

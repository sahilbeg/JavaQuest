ticket:
  key: SPK-0507
  from: priya
  title: "The Harbor kiosk ran out of memory overnight"
  body: >
    The Harbor kiosk crashed at 3 a.m. and the log says "java.lang.OutOfMemoryError: Java heap space".
    Kakashi wants to buy bigger kiosks with more memory. Before I sign that order, I want to know what
    actually ran out and whether more memory would even fix it.
hints:
  - "Think about where each thing lives: local variables in a frame, objects somewhere shared."
  - "Every new object goes on the heap. A frame on the stack only holds references to it."
  - "Heap space errors mean too many objects stay reachable. A static list that never shrinks is a classic cause."
review: true

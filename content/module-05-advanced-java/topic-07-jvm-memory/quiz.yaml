  - id: q02
    type: mcq
    concept: heap
    prompt: "Where does the object from new Ride(\"B-1042\", \"Harbor\", \"classic\", 12) live?"
    choices: ["On the heap", "In the current stack frame", "In metaspace", "Inside the variable as a copy"]
    answer: 0

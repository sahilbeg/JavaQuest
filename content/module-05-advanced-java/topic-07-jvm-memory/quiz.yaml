  - id: q10
    type: predict-output
    concept: references
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<String> docks = new ArrayList<>();
              List<String> other = docks;
              other.add("Dock 1");
              other.add("Dock 2");
              System.out.println(docks.size());
              System.out.println(docks == other);
          }
      }
    answer: "2\ntrue"
    explain: "Both variables hold a reference to the same list on the heap, so docks sees both adds."
    reteach: "## Concept"

  - id: q11
    type: predict-output
    concept: references
    code: |
      public class Main {
          static void addMinutes(int minutes) {
              minutes = minutes + 10;
          }

          public static void main(String[] args) {
              int minutes = 12;
              addMinutes(minutes);
              System.out.println(minutes);
          }
      }
    answer: "12"
    explain: "The int is copied into the new frame. Changing the copy in addMinutes leaves main's minutes alone."
    reteach: "## Concept"

  - id: q12
    type: order
    concept: stack
    prompt: "main calls fare, and fare calls unlockFee. Put the stack events in order."
    items: ["Push the frame for main", "Push the frame for fare", "Push the frame for unlockFee", "Pop the frame for unlockFee", "Pop the frame for fare"]
    explain: "Frames follow last in, first out. The last method called is the first to return."
    reteach: "## Concept"

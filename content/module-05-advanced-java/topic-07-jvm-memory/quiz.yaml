  - id: q01
    type: mcq
    concept: stack
    variants:
      - { prompt: "How many stacks does a program with 4 threads have?", choices: ["4, one per thread", "1, shared by all threads", "2, one for main and one for the rest", "None, only the heap"], answer: 0 }
      - { prompt: "What does a stack frame hold?", choices: ["One method call's parameters and local variables", "Every object the program created", "The bytecode of every class", "The maximum heap size"], answer: 0 }
    explain: "Each thread gets its own stack. Each method call pushes a frame that holds its parameters and local variables."

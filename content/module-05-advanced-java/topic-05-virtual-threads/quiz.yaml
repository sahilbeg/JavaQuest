  - id: q06
    type: predict-output
    concept: platform-vs-virtual
    code: |
      public class Main {
          public static void main(String[] args) throws InterruptedException {
              Thread t = Thread.ofVirtual().start(() ->
                  System.out.println("inside: " + Thread.currentThread().isVirtual()));
              t.join();
              System.out.println("main: " + Thread.currentThread().isVirtual());
          }
      }
    answer: "inside: true\nmain: false"
    explain: "The lambda runs on the virtual thread. The last line runs on main, which is a platform thread. join() makes the order fixed."
    reteach: "## Concept"

  - id: q07
    type: predict-output
    concept: virtual-executor
    code: |
      import java.util.concurrent.ExecutorService;
      import java.util.concurrent.Executors;
      import java.util.concurrent.atomic.AtomicInteger;

      public class Main {
          public static void main(String[] args) {
              AtomicInteger paid = new AtomicInteger();
              try (ExecutorService pool = Executors.newVirtualThreadPerTaskExecutor()) {
                  for (int i = 0; i < 500; i++) {
                      pool.submit(() -> paid.incrementAndGet());
                  }
              }
              System.out.println(paid.get());
          }
      }
    answer: "500"
    explain: "Closing the executor at the end of the try block waits for all 500 tasks. AtomicInteger never loses an update."
    reteach: "## Concept"

  - id: q08
    type: order
    concept: virtual-executor
    prompt: "Put the lines in order to pay three riders on virtual threads and then print done."
    items:
      - "try (ExecutorService pool = Executors.newVirtualThreadPerTaskExecutor()) {"
      - "    for (int r = 1; r <= 3; r++) {"
      - "        int rider = r;"
      - "        pool.submit(() -> pay(rider));"
      - "    }"
      - "}"
      - "System.out.println(\"done\");"
    explain: "Open the executor, submit inside the loop, close the block so it waits, then print."
    reteach: "## Worked example"

  - id: q09
    type: spot-the-bug
    concept: starting-virtual-threads
    prompt: "This program should print working and then true. Which line gives the wrong answer?"
    code: |
      public class Main {
          public static void main(String[] args) throws InterruptedException {
              Thread t = Thread.startVirtualThread(() -> System.out.println("working"));
              t.join();
              System.out.println(Thread.currentThread().isVirtual());
          }
      }
    bugLine: 5
    explain: "Thread.currentThread() on line 5 is main, a platform thread, so it prints false. Use t.isVirtual() instead."
    reteach: "## Common mistakes"

  - id: q10
    type: mcq
    concept: virtual-executor
    prompt: "What does close() do on a virtual-thread executor at the end of try-with-resources?"
    choices: ["Waits for every submitted task to finish, then shuts the executor down", "Stops all running tasks at once", "Returns the number of finished tasks", "Nothing, virtual executors never need closing"]
    answer: 0
    explain: "close() waits for all submitted tasks and then shuts down, so code after the block sees every result."
    reteach: "## Concept"

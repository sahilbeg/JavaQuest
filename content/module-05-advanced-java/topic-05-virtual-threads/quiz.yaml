questions:
  - id: q01
    type: mcq
    concept: platform-vs-virtual
    variants:
      - { prompt: "What happens to a virtual thread while it waits on the payment service?", choices: ["The JVM parks it and frees its carrier thread", "It keeps its OS thread busy until the answer arrives", "The JVM stops it and starts it again from the top", "It turns into a platform thread"], answer: 0 }
      - { prompt: "Why can you start far more virtual threads than platform threads?", choices: ["Each platform thread holds an expensive OS thread, and virtual threads share a few carriers", "Virtual threads skip the run method", "Virtual threads run only one at a time", "Platform threads are not allowed to sleep"], answer: 0 }
    explain: "A platform thread holds one OS thread for its whole life. Virtual threads ride on a few carrier threads and get parked while they wait."
    reteach: "## Concept"

  - id: q02
    type: mcq
    concept: when-to-use
    prompt: "Which job gains the most from virtual threads?"
    choices: ["5,000 calls to a slow payment service", "Counting primes below 50 million", "Sorting one huge array", "Adding up fares in a tight loop"]
    answer: 0
    explain: "Virtual threads help when tasks spend their time waiting (I/O). CPU-heavy work keeps a carrier busy, so it runs no faster."
    reteach: "## Concept"

  - id: q03
    type: mcq
    concept: pinning
    prompt: "On Java 21, which code risks pinning a virtual thread to its carrier?"
    choices: ["A slow network call inside a synchronized block", "A call to Thread.sleep outside any lock", "Calling isVirtual()", "Submitting a task to newVirtualThreadPerTaskExecutor"]
    answer: 0
    explain: "On Java 21, waiting inside synchronized code can pin the virtual thread, so its carrier stays blocked. Java 24 fixed this; on 21, use a ReentrantLock around slow work."
    reteach: "### Pinning, in one line"

  - id: q04
    type: fill-blank
    concept: virtual-executor
    goal: "Make a pool that starts a fresh virtual thread for every task you submit."
    prompt: "try (ExecutorService pool = Executors.___()) {"
    answers: ["newVirtualThreadPerTaskExecutor"]
    explain: "newVirtualThreadPerTaskExecutor starts one new virtual thread for each submitted task."
    reteach: "## Concept"

  - id: q05
    type: fill-blank
    concept: starting-virtual-threads
    goal: "Build and launch a lightweight virtual thread that pays for ride 7."
    prompt: "Thread t = Thread.___().start(() -> pay(7));"
    answers: ["ofVirtual"]
    explain: "Thread.ofVirtual() returns a builder, and start(...) creates and starts the virtual thread."
    reteach: "## Concept"

  - id: q06
    type: predict-output
    concept: platform-vs-virtual
    code: |
      public class Main {
          public static void main(String[] args) throws InterruptedException {
              Thread t = Thread.ofVirtual().start(() ->
                  System.out.println("inside: " + Thread.currentThread().isVirtual()));
              t.join();
              System.out.println("main: " + Thread.currentThread().isVirtual());
          }
      }
    answer: "inside: true\nmain: false"
    explain: "The lambda runs on the virtual thread. The last line runs on main, which is a platform thread. join() makes the order fixed."
    reteach: "## Concept"

  - id: q07
    type: predict-output
    concept: virtual-executor
    code: |
      import java.util.concurrent.ExecutorService;
      import java.util.concurrent.Executors;
      import java.util.concurrent.atomic.AtomicInteger;

      public class Main {
          public static void main(String[] args) {
              AtomicInteger paid = new AtomicInteger();
              try (ExecutorService pool = Executors.newVirtualThreadPerTaskExecutor()) {
                  for (int i = 0; i < 500; i++) {
                      pool.submit(() -> paid.incrementAndGet());
                  }
              }
              System.out.println(paid.get());
          }
      }
    answer: "500"
    explain: "Closing the executor at the end of the try block waits for all 500 tasks. AtomicInteger never loses an update."
    reteach: "## Concept"

  - id: q08
    type: order
    concept: virtual-executor
    prompt: "Put the lines in order to pay three riders on virtual threads and then print done."
    items:
      - "try (ExecutorService pool = Executors.newVirtualThreadPerTaskExecutor()) {"
      - "    for (int r = 1; r <= 3; r++) {"
      - "        int rider = r;"
      - "        pool.submit(() -> pay(rider));"
      - "    }"
      - "}"
      - "System.out.println(\"done\");"
    explain: "Open the executor, submit inside the loop, close the block so it waits, then print."
    reteach: "## Worked example"

  - id: q09
    type: spot-the-bug
    concept: starting-virtual-threads
    prompt: "This program should print working and then true. Which line gives the wrong answer?"
    code: |
      public class Main {
          public static void main(String[] args) throws InterruptedException {
              Thread t = Thread.startVirtualThread(() -> System.out.println("working"));
              t.join();
              System.out.println(Thread.currentThread().isVirtual());
          }
      }
    bugLine: 5
    explain: "Thread.currentThread() on line 5 is main, a platform thread, so it prints false. Use t.isVirtual() instead."
    reteach: "## Common mistakes"

  - id: q10
    type: mcq
    concept: virtual-executor
    prompt: "What does close() do on a virtual-thread executor at the end of try-with-resources?"
    choices: ["Waits for every submitted task to finish, then shuts the executor down", "Stops all running tasks at once", "Returns the number of finished tasks", "Nothing, virtual executors never need closing"]
    answer: 0
    explain: "close() waits for all submitted tasks and then shuts down, so code after the block sees every result."
    reteach: "## Concept"

  - id: q11
    type: mcq
    concept: limit-concurrency
    prompt: "10,000 virtual threads each call the payment service, which can handle about 10 calls at once. What is the usual fix?"
    choices: ["A Semaphore with 10 permits: acquire before the call, release in finally", "Switch to platform threads so fewer start", "Add Thread.sleep before each call", "Wrap the call in synchronized"]
    answer: 0
    explain: "Virtual threads are cheap, but the payment service and the database are not. A Semaphore caps how many tasks do the risky part at once, while the rest park cheaply."
    reteach: "### Limiting concurrency with a Semaphore"

  - id: q12
    type: mcq
    concept: pinning
    prompt: "On Java 21, a virtual thread must hold a lock while it calls a slow service. Which lock lets it park instead of pinning its carrier?"
    choices: ["A ReentrantLock", "A synchronized block on this", "A synchronized method", "A synchronized block on a private object"]
    answer: 0
    explain: "On Java 21, every form of synchronized pins a waiting virtual thread. A virtual thread waiting inside ReentrantLock code parks normally."
    reteach: "### Pinning, in one line"

  - id: q01
    type: mcq
    concept: thread-pool
    variants:
      - { prompt: "Why does a thread pool help when 60 docks need checking?", choices: ["It reuses a few threads instead of creating 60 new ones", "It makes each sensor read faster", "It runs the checks without any threads", "It removes the need to wait for results"], answer: 0 }
      - { prompt: "What does starting a brand new thread for every task cost?", choices: ["Memory for its stack and time to create and destroy it", "Nothing, threads are free", "Only disk space", "One extra line of output"], answer: 0 }
    explain: "Each thread needs its own stack memory and setup work. A pool keeps a few threads alive and gives them task after task."

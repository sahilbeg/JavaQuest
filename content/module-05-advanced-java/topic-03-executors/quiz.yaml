  - id: q10
    type: spot-the-bug
    concept: callable-future
    prompt: "This task should hand back a result line. Which line will not compile?"
    code: |
      try (ExecutorService pool = Executors.newFixedThreadPool(2)) {
          Runnable task = () -> "Harbor-1: ok";
          Future<?> f = pool.submit(task);
      }
    bugLine: 2
    explain: "A Runnable returns nothing, so its lambda cannot hand back a String. Use Callable<String> task = () -> \"Harbor-1: ok\";"

  - id: q03
    type: mcq
    concept: callable-future
    prompt: "What is the difference between a Runnable and a Callable<String>?"
    choices: ["A Callable returns a value and may throw a checked exception", "A Runnable returns a String", "A Callable can only run on the main thread", "There is no difference"]
    answer: 0
    explain: "Runnable gives nothing back. Callable<String> gives back a String, which you collect with Future.get()."
    reteach: "## Concept"

  - id: q04
    type: predict-output
    concept: callable-future
    code: |
      import java.util.ArrayList;
      import java.util.List;
      import java.util.concurrent.ExecutorService;
      import java.util.concurrent.Executors;
      import java.util.concurrent.Future;

      public class Main {
          public static void main(String[] args) throws Exception {
              List<Future<Integer>> futures = new ArrayList<>();
              try (ExecutorService pool = Executors.newFixedThreadPool(2)) {
                  for (int dock = 1; dock <= 3; dock++) {
                      int d = dock;
                      futures.add(pool.submit(() -> d * 10));
                  }
                  for (Future<Integer> f : futures) {
                      System.out.println(f.get());
                  }
              }
          }
      }
    answer: "10\n20\n30"
    explain: "The tasks may finish in any order, but the loop calls get() on the futures in the order they were submitted."
    reteach: "## Worked example"

  - id: q05
    type: predict-output
    concept: task-exceptions
    code: |
      import java.util.concurrent.ExecutionException;
      import java.util.concurrent.ExecutorService;
      import java.util.concurrent.Executors;
      import java.util.concurrent.Future;

      public class Main {
          public static void main(String[] args) throws InterruptedException {
              try (ExecutorService pool = Executors.newFixedThreadPool(1)) {
                  Future<String> f = pool.submit(() -> {
                      if (true) {
                          throw new IllegalStateException("sensor offline");
                      }
                      return "ok";
                  });
                  try {
                      System.out.println(f.get());
                  } catch (ExecutionException e) {
                      System.out.println("failed: " + e.getCause().getMessage());
                  }
              }
          }
      }
    answer: "failed: sensor offline"
    explain: "get() throws an ExecutionException. Its cause is the IllegalStateException the task threw."
    reteach: "## Concept"

  - id: q06
    type: mcq
    concept: task-exceptions
    prompt: "A task throws IllegalStateException. What does future.get() throw?"
    choices: ["ExecutionException, with the IllegalStateException as its cause", "IllegalStateException directly", "Nothing, it returns null", "InterruptedException"]
    answer: 0
    explain: "The pool keeps the task's exception and wraps it in an ExecutionException when you call get()."
    reteach: "## Common mistakes"

  - id: q07
    type: mcq
    concept: shutdown
    variants:
      - { prompt: "What happens at the closing brace of try (ExecutorService pool = ...) { } in Java 21?", choices: ["close() shuts the pool down and waits for every task to finish", "The pool is thrown away while tasks are still running", "Nothing, you still have to call shutdown()", "The program exits at once"], answer: 0 }
      - { prompt: "After pool.shutdown(), pool.awaitTermination(200, TimeUnit.MILLISECONDS) returns false. What is true?", choices: ["Time ran out and some tasks are still running", "Every task finished", "Every task was cancelled", "The pool threw away the queued tasks"], answer: 0 }
    explain: "Since Java 19, ExecutorService is AutoCloseable: close() calls shutdown and waits for the tasks. awaitTermination returns false when time runs out. It stops nothing, so the next step is shutdownNow()."
    reteach: "### Shutting down and timeouts"

  - id: q08
    type: order
    concept: shutdown
    prompt: "Put the steps in order to run tasks on a pool and wait for them without try-with-resources."
    items:
      - "ExecutorService pool = Executors.newFixedThreadPool(4);"
      - "pool.submit(task);"
      - "pool.shutdown();"
      - "pool.awaitTermination(5, TimeUnit.SECONDS);"
    explain: "Make the pool, give it work, stop it from taking new work, then wait for the work to finish."
    reteach: "## Concept"

  - id: q09
    type: fill-blank
    concept: invoke-all
    goal: "Hand the pool every task in the list, wait until all are done, and collect their futures in order."
    prompt: "List<Future<String>> futures = pool.___(tasks);"
    answers: ["invokeAll"]
    explain: "invokeAll submits a list of callables, waits for all of them, and returns the futures in the same order."

  - id: q04
    type: predict-output
    concept: callable-future
    code: |
      import java.util.ArrayList;
      import java.util.List;
      import java.util.concurrent.ExecutorService;
      import java.util.concurrent.Executors;
      import java.util.concurrent.Future;

      public class Main {
          public static void main(String[] args) throws Exception {
              List<Future<Integer>> futures = new ArrayList<>();
              try (ExecutorService pool = Executors.newFixedThreadPool(2)) {
                  for (int dock = 1; dock <= 3; dock++) {
                      int d = dock;
                      futures.add(pool.submit(() -> d * 10));
                  }
                  for (Future<Integer> f : futures) {
                      System.out.println(f.get());
                  }
              }
          }
      }
    answer: "10\n20\n30"
    explain: "The tasks may finish in any order, but the loop calls get() on the futures in the order they were submitted."
    reteach: "## Worked example"

  - id: q05
    type: predict-output
    concept: task-exceptions
    code: |
      import java.util.concurrent.ExecutionException;
      import java.util.concurrent.ExecutorService;
      import java.util.concurrent.Executors;
      import java.util.concurrent.Future;

      public class Main {
          public static void main(String[] args) throws InterruptedException {
              try (ExecutorService pool = Executors.newFixedThreadPool(1)) {
                  Future<String> f = pool.submit(() -> {
                      if (true) {
                          throw new IllegalStateException("sensor offline");
                      }
                      return "ok";
                  });
                  try {
                      System.out.println(f.get());
                  } catch (ExecutionException e) {
                      System.out.println("failed: " + e.getCause().getMessage());
                  }
              }
          }
      }
    answer: "failed: sensor offline"
    explain: "get() throws an ExecutionException. Its cause is the IllegalStateException the task threw."
    reteach: "## Concept"


ticket:
  key: SPK-0506
  from: sam
  title: "Live map says Harbor has -3 free docks"
  body: >
    A rider sent me a screenshot of the live station map showing Harbor with -3 free docks.
    Another rider got an error page that mentioned ConcurrentModificationException.
    Tsunade says the dock sensors update one HashMap from many threads at once. Can you make the map trustworthy?
hints:
  - "Swap each plain collection for a thread-safe one: ConcurrentHashMap for the docks, AtomicInteger for the ride count, LinkedBlockingQueue for telemetry."
  - "In dockEvent, merge adds the change in one safe step: docks.merge(station, change, Integer::sum). In free, use getOrDefault(station, 0). In snapshot, return new TreeMap<>(docks)."
  - "record() is rides.incrementAndGet(); total() is rides.get(). send(...) calls queue.put(item). drain loops expected times and adds pipe.queue.take() to a list."
review: true

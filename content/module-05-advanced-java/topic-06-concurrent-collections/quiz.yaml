  - id: q06
    type: predict-output
    concept: atomics
    code: |
      import java.util.concurrent.atomic.AtomicInteger;

      public class Main {
          public static void main(String[] args) {
              AtomicInteger free = new AtomicInteger(12);
              free.decrementAndGet();
              System.out.println(free.compareAndSet(12, 5));
              System.out.println(free.compareAndSet(11, 5));
              System.out.println(free.get());
          }
      }
    answer: "false\ntrue\n5"
    explain: "After the decrement the value is 11. The first swap expects 12, so it fails. The second expects 11, so it sets 5."
    reteach: "## Concept"

  - id: q07
    type: predict-output
    concept: concurrent-hash-map
    code: |
      import java.util.Map;
      import java.util.concurrent.ConcurrentHashMap;

      public class Main {
          public static void main(String[] args) {
              Map<String, Integer> docks = new ConcurrentHashMap<>();
              docks.merge("Harbor", 3, Integer::sum);
              docks.merge("Harbor", -1, Integer::sum);
              System.out.println(docks.get("Harbor"));
              System.out.println(docks.getOrDefault("Uptown", 0));
          }
      }
    answer: "2\n0"
    explain: "The first merge stores 3, the second adds -1. Uptown is missing, so getOrDefault returns 0."
    reteach: "## Concept"

  - id: q08
    type: order
    concept: blocking-queue
    prompt: "Put the lines in order: a sensor thread sends one message and main prints it."
    items:
      - "BlockingQueue<String> q = new LinkedBlockingQueue<>();"
      - "Thread sensor = new Thread(() -> q.add(\"Harbor:dock-1\"));"
      - "sensor.start();"
      - "System.out.println(q.take());"
    explain: "Create the queue, create and start the producer, then take the item. take() waits if the item has not arrived yet."
    reteach: "## Worked example"

  - id: q09
    type: spot-the-bug
    concept: concurrent-hash-map
    prompt: "Eight threads call dockEvent at once. Which line can write over another thread's update?"
    code: |
      Map<String, Integer> docks = new ConcurrentHashMap<>();
      void dockEvent(String station, int change) {
          int old = docks.getOrDefault(station, 0);
          docks.put(station, old + change);
      }
    bugLine: 4
    explain: "The read on line 3 and the put on line 4 are two steps. Another thread can update in between, and the put overwrites it. Use docks.merge(station, change, Integer::sum)."
    reteach: "## Common mistakes"


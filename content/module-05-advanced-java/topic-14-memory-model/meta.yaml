ticket:
  key: SPK-0514
  from: theo
  title: "The Harbor sensor will not stop"
  body: >
    Last night I pressed Stop on the Harbor dock sensor. The dashboard said "stopped", but the sensor
    thread kept spinning at 100% CPU until I restarted the server. In the middle of rush hour the
    "peak riders online" number on the dashboard went down. That should never happen. The fare
    table also seems to get built more than once. Can you make these classes safe to share between threads?
hints:
  - "When one thread writes a field and another reads it, Java needs a rule that makes the write visible. For a simple on/off flag, that rule is volatile."
  - "volatile does not make rides++ or a check-then-write max safe. Immutable means a final class, private final fields, a List.copyOf copy in the constructor, and with-methods that return a new object."
  - "Write private volatile boolean running = true; and running = false; in stop(). In RideStats use a LongAdder (increment, sum) and an AtomicInteger with accumulateAndGet(ridersOnline, Math::max). In FareTable add private static final class Holder { static final FareTable INSTANCE = new FareTable(); } and return Holder.INSTANCE."
review: true

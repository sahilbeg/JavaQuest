  - id: q03
    type: mcq
    concept: annotation-elements
    prompt: "Range declares int min() default 0; and int max() default 100;. What does @Range on a field mean?"
    choices: ["min is 0 and max is 100", "The code does not compile", "min and max are both 0", "There is no range at all"]

topic: module-07-tooling/topic-03-git-workflow
drawCount: 6
passPercent: 80
questions:
  - id: q01
    type: mcq
    concept: branches
    variants:
      - { prompt: "What is a Git branch?", choices: ["A movable label that points at one commit", "A full copy of every file in a new folder", "A backup of the repository on the server", "A list of files waiting to be committed"], answer: 0 }
      - { prompt: "What is HEAD in Git?", choices: ["A marker for where you are now, usually a branch", "The oldest commit in the repository", "The server copy of main", "The person who reviews your pull request"], answer: 0 }
      - { prompt: "You commit on fix/harbor-fare-rounding. What happens to the main label?", choices: ["It stays where it was", "It moves to your new commit too", "It is deleted", "It moves back one commit"], answer: 0 }
    explain: "A branch is just a label on a commit. Committing moves only the branch HEAD points at."
    reteach: "## Concept"

  - id: q02
    type: fill-blank
    concept: branches
    goal: "Create the branch fix/harbor-fare-rounding and move onto it, in one step."
    prompt: "git ___ -c fix/harbor-fare-rounding"
    answers: ["switch"]
    explain: "git switch -c creates a new branch and moves you onto it in one step."
    reteach: "## Concept"

  - id: q03
    type: mcq
    concept: merging
    variants:
      - { prompt: "When can git merge do a fast-forward?", choices: ["When main got no new commits since you branched", "When both branches changed the same line", "Only when you add --no-ff", "Only after a rebase on the server"], answer: 0 }
      - { prompt: "What does git merge --no-ff fix/harbor-fare-rounding do?", choices: ["It always makes a merge commit, even if a fast-forward was possible", "It refuses to merge if there is a conflict", "It merges without running the tests", "It deletes the branch after merging"], answer: 0 }
      - { prompt: "What is a merge commit?", choices: ["A commit with two parents that joins two lines of history", "A commit that undoes a merge", "The first commit on a new branch", "A commit that only CI can make"], answer: 0 }
    explain: "If main has not moved, Git slides the label forward. If both sides moved, Git joins them with a two-parent merge commit."
    reteach: "## Concept"

  - id: q04
    type: mcq
    concept: merging
    variants:
      - { prompt: "Only the server's main has new commits. What does git pull do on your main?", choices: ["git fetch, then brings the new commits into your main", "Uploads your main to origin", "Downloads new commits but never changes your files", "Deletes branches that were merged"], answer: 0 }
      - { prompt: "Your main and the server's main both have new commits. Which command pulls and merges them?", choices: ["git pull --no-rebase", "git fetch", "git push -u origin main", "git merge --abort"], answer: 0 }
      - { prompt: "What does git fetch do?", choices: ["Downloads new commits from origin without changing your files", "Downloads new commits and merges them into your branch", "Uploads your commits to origin", "Creates a pull request"], answer: 0 }
    explain: "git fetch only downloads and updates origin/main. git pull fetches, then brings the commits in. If both sides moved, choose --no-rebase to merge or --rebase to rebase."
    reteach: "## Concept"

  - id: q05
    type: mcq
    concept: merge-conflicts
    variants:
      - { prompt: "In a merge conflict, which code sits between <<<<<<< HEAD and =======?", choices: ["Your version, from the branch you are on", "The incoming version, from the branch being merged in", "The version from the first commit", "Code Git wrote to fix the conflict"], answer: 0 }
      - { prompt: "Halfway through a messy merge, you want everything back as it was before git merge. What do you run?", choices: ["git merge --abort", "git merge --no-ff", "git push --force", "git branch -d main"], answer: 0 }
      - { prompt: "When does Git stop a merge with a conflict?", choices: ["When both branches changed the same lines", "Whenever both branches have new commits", "When the branch name has a slash in it", "When the tests fail"], answer: 0 }
    explain: "Git only stops when both sides changed the same lines. The top half is HEAD, your side. git merge --abort undoes the whole merge."
    reteach: "## Concept"

  - id: q06
    type: spot-the-bug
    concept: merge-conflicts
    prompt: "Someone resolved this conflict and ran git commit. Which line will stop javac?"
    code: |
      public class FareCalculator {
          public long fareCents(int minutes) {
              long fare = roundUpToTen(120 + minutes * 15L);
      >>>>>>> origin/main
              return fare;
          }

          private long roundUpToTen(long cents) {
              return (cents + 9) / 10 * 10;
          }
      }
    bugLine: 4
    explain: "A leftover >>>>>>> marker is not Java. Delete every marker line and compile before you finish the merge."
    reteach: "## Common mistakes"

  - id: q07
    type: order
    concept: merge-conflicts
    prompt: "git merge just reported a conflict in FareCalculator.java. Put the steps to finish it in order."
    items:
      - "Open FareCalculator.java and find the <<<<<<< line"
      - "Rewrite those lines into the final code and delete all three marker lines"
      - "git add FareCalculator.java"
      - "git commit"
    explain: "Fix the code and remove the markers first. Then git add marks the file as resolved, and git commit finishes the merge."
    reteach: "## Concept"

  - id: q08
    type: mcq
    concept: rebasing
    variants:
      - { prompt: "What does git rebase main do on your branch?", choices: ["Replays your commits as new commits on top of the newest main", "Merges your branch into main with a merge commit", "Deletes main and renames your branch to main", "Uploads your branch to origin"], answer: 0 }
      - { prompt: "During a rebase you fixed a conflict and ran git add. What next?", choices: ["git rebase --continue", "git merge --abort", "git push --force", "git switch -c rebase"], answer: 0 }
      - { prompt: "What does git pull --rebase do?", choices: ["git fetch, then rebases your commits on top of the new commits", "git fetch, then makes a merge commit", "Uploads your rebased branch", "Undoes the last pull"], answer: 0 }
    explain: "A rebase lifts your commits off and replays them on top of the new base, giving a straight line of history."
    reteach: "## Concept"

  - id: q09
    type: mcq
    concept: history-safety
    variants:
      - { prompt: "Which branch is it safe to rebase?", choices: ["Your own branch that nobody else has pulled", "main", "A branch another intern also pushes to", "Any branch, as long as you use --force"], answer: 0 }
      - { prompt: "Why use git push --force-with-lease instead of git push --force?", choices: ["It refuses if someone else pushed to the branch since your last fetch", "It is faster on big repositories", "It also creates a pull request", "It merges instead of overwriting"], answer: 0 }
      - { prompt: "You rebase a branch another intern also uses and run git push --force. What happens?", choices: ["The other intern's pushed commits disappear from the server", "Git merges both versions for you", "Git refuses with (stale info)", "Nothing, rebasing never changes commits"], answer: 0 }
      - { prompt: "A teammate pushed to your branch, then your IDE fetched in the background. You run git push --force-with-lease after a rebase. What happens?", choices: ["The push succeeds, and the teammate's commit is gone from the server", "Git refuses with (stale info)", "Git merges the teammate's commit in for you", "The push waits for a review"], answer: 0 }
      - { prompt: "What does --force-if-includes add to --force-with-lease?", choices: ["It also refuses unless the server's newest commit is in your own branch's history", "It skips the lease check to push faster", "It force-pushes every branch at once", "It opens a pull request after the push"], answer: 0 }
    explain: "Rebasing makes new commits. Never rebase commits others already have. A background fetch can make --force-with-lease pass anyway, so push your own rebased branch with --force-with-lease --force-if-includes."
    reteach: "## Concept"

  - id: q10
    type: fill-blank
    concept: history-safety
    goal: "Overwrite your own rebased branch on the server, but only if nobody else has added work there since you last fetched."
    prompt: "git push ___   # overwrite your own rebased branch safely"
    answers: ["--force-with-lease"]
    explain: "--force-with-lease overwrites your branch on the server only if nobody else pushed to it since your last fetch."
    reteach: "## Concept"

  - id: q11
    type: order
    concept: pull-requests
    prompt: "Put the steps for Tsunade's new rule in order, from fresh main to cleanup."
    items:
      - "git switch main, then git pull"
      - "git switch -c fix/harbor-fare-rounding"
      - "Edit, git add and git commit"
      - "git push -u origin fix/harbor-fare-rounding"
      - "Open a pull request on GitHub"
      - "Wait for green checks and an approval"
      - "Merge the pull request and delete the branch"
    explain: "Start from the newest main, work on a branch, push it, then let review and CI check it before it merges."
    reteach: "## Worked example"

  - id: q12
    type: mcq
    concept: pull-requests
    variants:
      - { prompt: "What does Squash and merge put on main?", choices: ["One new commit holding all the branch's changes", "Every branch commit plus a merge commit", "Every branch commit replayed with no merge commit", "Nothing until someone runs git pull"], answer: 0 }
      - { prompt: "Why keep pull requests small?", choices: ["Reviewers can read them carefully, and they merge sooner with fewer conflicts", "GitHub rejects pull requests over 100 lines", "Small pull requests skip the CI checks", "Big pull requests delete the branch"], answer: 0 }
      - { prompt: "What is a pull request?", choices: ["A page asking to merge your branch, with review and checks", "A command that downloads the newest main", "A branch that only Tsunade can push to", "A way to undo a merge"], answer: 0 }
      - { prompt: "Which commit subject line follows the usual conventions?", choices: ["Round Harbor fares up to the next 10 cents", "rounded fares.", "WIP", "Fixed the Harbor thing Tsunade mentioned and also tidied some files"], answer: 0 }
      - { prompt: "With Conventional Commits, which subject marks a bug fix?", choices: ["fix: round Harbor fares up to 10 cents", "feat: round Harbor fares up to 10 cents", "docs: round Harbor fares up to 10 cents", "Round Harbor fares up to 10 cents!"], answer: 0 }
    explain: "A pull request asks to merge a branch, with a diff, review comments and CI checks. Small PRs get real reviews. Good commits have a short subject written as an order, and a body that says why. Conventional Commits put a type such as fix: or feat: in front."
    reteach: "## Concept"

ticket:
  key: SPK-0701
  from: maya
  title: "The kiosk only builds on my laptop"
  body: >
    Right now the kiosk is built from a text file of javac commands, and it only works on my
    laptop. Two new teammates lost a whole day trying to build it, and last week someone shipped
    an old jar to the Harbor kiosk. I want one command that builds and tests the kiosk the same
    way on every machine. Can you set that up?
hints:
  - "Every Maven project has a name in three parts: groupId, artifactId and version. Look for them near the top of the POM."
  - "Phases run in order. Asking for package also runs compile and test first. A test-scope jar is only there for the code in src/test/java."
  - "Use ./mvnw, not mvn, so every laptop gets the same Maven. ./mvnw clean package builds a fresh jar in target/, and ./mvnw dependency:tree lists every jar you pull in."
review: true

  - id: q10
    type: mcq
    concept: loop-condition
    prompt: "A counter starts at int n = 10; and goes n--; each turn. Which condition makes the loop stop?"
    choices: ["while (n > 0)", "while (n < 20)", "while (n != 11)", "while (n <= 10)"]
    answer: 0
    explain: "n gets smaller, so n > 0 turns false when n reaches 0. The other conditions stay true forever."
    reteach: "## Concept"

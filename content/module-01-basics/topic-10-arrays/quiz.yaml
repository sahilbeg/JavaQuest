  - id: q03
    type: mcq
    concept: index-out-of-bounds
    prompt: "int[] rides = {12, 45, 7}; What happens when the program reads rides[3]?"
    choices: ["It crashes with ArrayIndexOutOfBoundsException", "It returns 0", "It returns 7", "The compiler refuses to compile it"]
    answer: 0
    explain: "Valid indexes are 0, 1 and 2. Index 3 compiles but crashes when it runs."
    reteach: "## Concept"

  - id: q04

    prompt: "Which check is true for typed = \"b-1042\" and the stored code \"B-1042\"?"
    choices: ["typed.equalsIgnoreCase(\"B-1042\")", "typed.equals(\"B-1042\")", "typed == \"B-1042\"", "typed.startsWith(\"B\")"]
    answer: 0
    explain: "equalsIgnoreCase treats b and B as equal. equals and startsWith care about case."
    reteach: "## Concept"

  - id: q08
    type: spot-the-bug
    concept: string-equality
    code: |
      public class Main {
          public static void main(String[] args) {
              String typed = "b-1042".toUpperCase();
              if (typed == "B-1042") {
                  System.out.println("Unlocked");
              }
          }
      }
    bugLine: 4

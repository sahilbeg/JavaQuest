  - id: q03
    type: fill-blank
    concept: trim-and-case
    goal: "Remove the spaces at the start and end of raw, then make it capital letters."
    prompt: "String clean = raw.___().toUpperCase();"
    answers: ["trim", "strip"]
    explain: "trim() and strip() both remove spaces at the start and the end."
    reteach: "## Concept"

  - id: q04
    type: predict-output
    concept: substring
    code: |
      public class Main {
          public static void main(String[] args) {
              String code = "B-1042";
              System.out.println(code.substring(2));
              System.out.println(code.substring(0, 1));
          }
      }
    answer: "1042\nB"
    explain: "substring(2) copies from index 2 to the end. substring(0, 1) copies index 0 only."
    reteach: "## Concept"

  - id: q05
    type: predict-output
    concept: immutability
    code: |
      public class Main {
          public static void main(String[] args) {
              String station = "old mill";
              station.toUpperCase();
              System.out.println(station);
              station = station.toUpperCase();
              System.out.println(station);
          }
      }
    answer: "old mill\nOLD MILL"
    explain: "The first toUpperCase() result is thrown away. Strings never change, so you must store the new one."
    reteach: "## Concept"


    prompt: "What does \"B-1042\".indexOf(\"X\") give back?"
    choices: ["-1", "0", "6", "false"]
    answer: 0
    explain: "indexOf gives back -1 when the text is missing."
    reteach: "## Concept"

  - id: q07
    type: mcq

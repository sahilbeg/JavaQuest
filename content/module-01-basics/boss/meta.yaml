ticket:
  key: INC-01
  from: theo
  title: "The kiosk charges the wrong fare after midnight"
  body: >
    Night riders at Harbor are getting crazy receipts. A ride from 23:50 to 00:20 shows minus 1410 minutes.
    Members are being charged the unlock fee too. Itachi has a queue of angry emails. Please fix the fare code tonight.
hints:
  - "Bronze: a day has 1440 minutes. When the end is smaller than the start, the ride crossed midnight."
  - "Bronze: (end - start + 1440) % 1440 gives the right minutes in both cases. Silver: compare the member rule in SPK-0105 with the code."
  - "Gold: String.format(\"%02d:%02d\", minuteOfDay / 60, minuteOfDay % 60) turns 1430 into 23:50."
review: false

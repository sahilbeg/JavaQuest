  - id: q09
    type: order
    concept: counting-down
    prompt: "Put the lines in order to print 10, 8, 6, 4, 2."
    items:
      - "for (int i = 10; i >= 2; i -= 2) {"
      - "    System.out.println(i);"
      - "}"
    explain: "Start at 10, keep going while i >= 2, and step down by 2."
    reteach: "## Concept"

  - id: q10
    type: fill-blank
    concept: continue
    goal: "Skip the rest of this turn when the dock is 4, then go on with the next dock."
    prompt: "if (dock == 4) { ___; }"
    answers: ["continue", "continue;"]
    explain: "continue skips the rest of this turn, so dock 4 is left out and the loop goes on."

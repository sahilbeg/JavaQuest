questions:
  - id: q01
    type: mcq
    concept: set-no-duplicates
    variants:
      - { prompt: "What does a Set never contain?", choices: ["The same value twice", "More than ten values", "Strings", "Values added in a loop"], answer: 0 }
      - { prompt: "You add \"B-1042\" to a set three times. How many copies are inside?", choices: ["1", "3", "0", "It throws an error"], answer: 0 }
    explain: "A set keeps one copy of each value. Adding a value that is already inside changes nothing."
    reteach: "## Concept"

  - id: q02
    type: predict-output
    concept: set-no-duplicates
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Set<String> bikes = new HashSet<>();
              System.out.println(bikes.add("B-7"));
              System.out.println(bikes.add("B-7"));
              System.out.println(bikes.size());
          }
      }
    answer: "true\nfalse\n1"
    explain: "The first add is new, so it returns true. The second is a duplicate, so it returns false. One value is inside."
    reteach: "## Concept"

  - id: q03
    type: mcq
    concept: treeset
    prompt: "Which set keeps its values in sorted order?"
    choices: ["TreeSet", "HashSet", "LinkedHashSet", "Every set"]
    answer: 0
    explain: "TreeSet sorts its values. LinkedHashSet keeps insertion order. HashSet promises no order."
    reteach: "## Concept"

  - id: q04
    type: mcq
    concept: hashset
    prompt: "You need the stations in the order riders first used them, with no repeats. Which class fits?"
    choices: ["LinkedHashSet", "HashSet", "TreeSet", "ArrayList"]
    answer: 0
    explain: "LinkedHashSet drops repeats and remembers the order you added values."
    reteach: "## Concept"

  - id: q05
    type: predict-output
    concept: treeset
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Set<String> stations = new TreeSet<>(List.of("Uptown", "Harbor", "Uptown", "Old Mill"));
              System.out.println(stations);
          }
      }
    answer: "[Harbor, Old Mill, Uptown]"
    explain: "The TreeSet drops the second Uptown and sorts the names alphabetically."
    reteach: "## Concept"

  - id: q06
    type: fill-blank
    concept: set-methods
    prompt: "if (bikes.___(\"B-1042\")) { System.out.println(\"Seen it\"); }"
    answers: ["contains"]
    explain: "contains returns true when the value is inside the set."
    reteach: "## Concept"

  - id: q07
    type: fill-blank
    concept: set-operations
    prompt: "both.___(uptown); // keep only bikes that Uptown also has"
    answers: ["retainAll"]
    explain: "retainAll keeps only the values that are also in the other collection."
    reteach: "## Concept"

  - id: q08
    type: spot-the-bug
    concept: set-methods
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Set<String> bikes = new TreeSet<>(List.of("B-2", "B-1"));
              String first = bikes.get(0);
              System.out.println(first);
          }
      }
    bugLine: 6
    explain: "A set has no index, so it has no get method. Loop over it, or copy it into a list first."
    reteach: "## Common mistakes"

  - id: q09
    type: mcq
    concept: equals-hashcode
    prompt: "Your Bike class has no equals or hashCode. You add two new Bike(\"B-1042\") objects to a HashSet. What is the size?"
    choices: ["2", "1", "0", "It does not compile"]
    answer: 0
    explain: "Without equals and hashCode, the set treats two separate objects as different values."
    reteach: "## Common mistakes"

  - id: q10
    type: order
    concept: set-operations
    prompt: "Put the lines in order to print the bikes seen at both Harbor and Uptown, sorted."
    items:
      - "Set<String> both = new TreeSet<>(harbor);"
      - "both.retainAll(uptown);"
      - "System.out.println(both);"
    explain: "Copy Harbor into a new TreeSet, keep only Uptown's bikes, then print."
    reteach: "## Worked example"

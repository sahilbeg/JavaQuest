  - id: q02
    type: fill-blank
    concept: grouping-by
    prompt: "Map<String, Long> m = rides.stream().collect(Collectors.groupingBy(Ride::station, Collectors.___()));"
    answers: ["counting"]
    explain: "counting() is the downstream collector that counts each pile. It gives a Long."
    reteach: "## Concept"

  - id: q03
    type: predict-output
    concept: grouping-by
    code: |
      import java.util.List;
      import java.util.Map;
      import java.util.TreeMap;
      import java.util.stream.Collectors;

      public class Main {
          public static void main(String[] args) {
              List<String> types = List.of("ebike", "classic", "ebike", "cargo", "ebike");
              Map<String, Long> m = types.stream()
                      .collect(Collectors.groupingBy(t -> t, Collectors.counting()));
              System.out.println(new TreeMap<>(m));
          }
      }
    answer: "{cargo=1, classic=1, ebike=3}"
    explain: "Each type becomes a key. counting() counts each pile, and TreeMap prints the keys in alphabetical order."
    reteach: "## Worked example"

  - id: q04
    type: mcq
    concept: partitioning-by
    prompt: "You split rides with partitioningBy(r -> r.minutes() > 60). No ride is longer than 60 minutes. What does split.get(true) give?"
    choices: ["An empty list", "null", "An exception", "Every ride"]
    answer: 0
    explain: "partitioningBy always makes both the true and the false key. An empty pile is an empty list."
    reteach: "## Concept"

  - id: q05
    type: predict-output
    concept: reduce
    code: |
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<Integer> minutes = List.of(25, 10, 40);
              int total = minutes.stream().reduce(5, Integer::sum);
              System.out.println(total);
          }
      }
    answer: "80"
    explain: "reduce starts at the identity 5, then adds 25, 10 and 40. That makes 80."
    reteach: "## Concept"


  - id: q08
    type: predict-output
    concept: joining
    code: |
      import java.util.List;
      import java.util.stream.Collectors;

      public class Main {
          public static void main(String[] args) {
              List<String> stations = List.of("Uptown", "Harbor", "Uptown", "Old Mill");
              String s = stations.stream()
                      .distinct()
                      .sorted()
                      .collect(Collectors.joining(" / "));
              System.out.println(s);
          }
      }
    answer: "Harbor / Old Mill / Uptown"
    explain: "distinct drops the second Uptown, sorted puts the names in order, and joining puts \" / \" between them."
    reteach: "## Try it"

  - id: q09
    type: spot-the-bug
    concept: grouping-by
    code: |
      import java.util.List;
      import java.util.Map;
      import java.util.stream.Collectors;

      public class Main {
          public static void main(String[] args) {
              List<String> types = List.of("ebike", "cargo");
              Map<String, Integer> m = types.stream()
                      .collect(Collectors.groupingBy(t -> t, Collectors.counting()));
              System.out.println(m);
          }
      }
    bugLine: 8
    explain: "counting() gives a Long, so the map must be Map<String, Long>. The compiler points at line 9, but the wrong part is the declared type on line 8."
    reteach: "## Common mistakes"


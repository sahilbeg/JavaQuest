    concept: grouping-by
    variants:
      - { prompt: "What does rides.stream().collect(Collectors.groupingBy(Ride::station)) return?", choices: ["A Map from each station to a List of its rides", "A List of station names", "A Map from each station to a count", "One Ride for each station"], answer: 0 }
      - { prompt: "What does rides.stream().collect(Collectors.groupingBy(Ride::type)) return?", choices: ["A Map from each type to a List of its rides", "A Set of bike types", "A Map from each type to its total minutes", "A sorted List of rides"], answer: 0 }

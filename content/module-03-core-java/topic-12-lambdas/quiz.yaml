  - id: q01
    type: mcq
    concept: lambda-syntax
    variants:
      - { prompt: "Which line is a valid lambda that takes two rides and compares their minutes?", choices: ["(a, b) -> Integer.compare(a.minutes(), b.minutes())", "a, b -> Integer.compare(a.minutes(), b.minutes())", "(a, b) => Integer.compare(a.minutes(), b.minutes())", "(a, b) -> return Integer.compare(a.minutes(), b.minutes())"], answer: 0 }
      - { prompt: "Which line is a valid lambda that checks if a ride is longer than 30 minutes?", choices: ["r -> r.minutes() > 30", "r => r.minutes() > 30", "r -> { r.minutes() > 30 }", "-> r.minutes() > 30"], answer: 0 }
    explain: "A lambda is parameters, then ->, then a body. Two parameters need brackets, and a one-expression body has no return."
    reteach: "## Concept"


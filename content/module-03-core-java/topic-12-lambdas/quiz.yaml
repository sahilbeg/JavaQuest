  - id: q03
    type: predict-output
    concept: comparator-lambda
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<Integer> minutes = new ArrayList<>(List.of(25, 8, 40, 3));
              minutes.sort((a, b) -> b - a);
              System.out.println(minutes);
          }
      }
    answer: "[40, 25, 8, 3]"
    explain: "b - a puts bigger numbers first, so the list goes from longest to shortest."
    reteach: "## Concept"

  - id: q04
    type: predict-output
    concept: foreach-removeif
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<String> stations = new ArrayList<>(List.of("Riverside", "Old Mill", "Harbor", "Uptown"));
              stations.removeIf(s -> s.length() > 6);
              stations.forEach(s -> System.out.println(s.toUpperCase()));
          }
      }
    answer: "HARBOR\nUPTOWN"
    explain: "Riverside (9) and Old Mill (8) are longer than 6 letters, so removeIf deletes them. forEach prints the rest in upper case."
    reteach: "## Concept"

  - id: q05
    type: predict-output
    concept: comparing-then-comparing
    code: |
      import java.util.ArrayList;
      import java.util.Comparator;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<Ride> rides = new ArrayList<>();
              rides.add(new Ride("B-1", "Uptown", "classic", 5));
              rides.add(new Ride("B-2", "Harbor", "ebike", 20));
              rides.add(new Ride("B-3", "Harbor", "cargo", 9));
              rides.sort(Comparator.comparing(Ride::station).thenComparing(Ride::minutes));
              rides.forEach(r -> System.out.println(r.bikeId()));
          }
      }

      record Ride(String bikeId, String station, String type, int minutes) {}
    answer: "B-3\nB-2\nB-1"
    explain: "Harbor comes before Uptown. The two Harbor rides tie on station, so thenComparing puts 9 minutes before 20."
    reteach: "## Worked example"


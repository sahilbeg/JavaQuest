  title: "Switch to Files and archive yesterday's log"
  body: >
    Our java.io file code works, but it is long and hard to review. We are moving to the newer
    Files API. While you are in there, the Harbor kiosk should move yesterday's ride log into an
    archive folder, so today's log starts empty.
hints:
  - "Path.resolve builds a path inside a folder: archiveDir.resolve(\"rides-\" + dateLabel + \".csv\")."
  - "Check Files.exists first. Files.createDirectories makes a folder, and it is fine if the folder is already there."
  - "appendRide can call Files.writeString(log, csvLine + \"\\n\", StandardCharsets.UTF_8, StandardOpenOption.CREATE, StandardOpenOption.APPEND);"

  - id: q06
    type: predict-output
    concept: path
    code: |
      import java.nio.file.Path;

      public class Main {
          public static void main(String[] args) {
              Path folder = Path.of("archive");
              Path file = folder.resolve("rides-2026-11-11.csv");
              System.out.println(file.getFileName());
              System.out.println(folder.getFileName());
          }
      }
    answer: "rides-2026-11-11.csv\narchive"
    explain: "getFileName gives the last part of each path."
    reteach: "## Concept"

  - id: q07
    type: predict-output
    concept: read-write-files
    code: |
      import java.io.IOException;
      import java.nio.charset.StandardCharsets;
      import java.nio.file.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              Path log = Path.of("q7-rides.csv");
              Files.writeString(log, "Riverside\n", StandardCharsets.UTF_8);
              Files.writeString(log, "Old Mill\n", StandardCharsets.UTF_8);
              Files.writeString(log, "Uptown\n", StandardCharsets.UTF_8, StandardOpenOption.APPEND);
              System.out.println(Files.readAllLines(log, StandardCharsets.UTF_8));
          }
      }
    answer: "[Old Mill, Uptown]"
    explain: "The second writeString replaces Riverside. Only the third call appends."
    reteach: "## Common mistakes"

  - id: q08
    type: order
    concept: copy-and-move
    prompt: "Put the lines in order to archive the log."
    items:
      - "Path archive = Path.of(\"archive\");"
      - "Files.createDirectories(archive);"
      - "Path target = archive.resolve(\"rides-2026-11-11.csv\");"
      - "Files.move(log, target);"
    explain: "Name the folder, make sure it exists, build the target path, then move."
    reteach: "## Worked example"


ticket:
  key: SPK-0308
  from: maya
  title: "Error codes that everyone ignores"
  body: >
    When Harbor is full, dock() returns -1, and half our callers never check it. Yesterday a rider was
    charged for a ride at Harbor that never ended in a dock. I want the full-station case to be impossible
    to ignore, so the compiler forces every caller to deal with it.
hints:
  - "A checked exception class extends Exception. An unchecked one extends RuntimeException. Pass the message up with super(\"Station full: \" + station)."
  - "In Station.dock, if docked equals docks, write throw new DockFullException(name); otherwise add 1 to docked and return it. Pricing throws new UnknownBikeTypeException(type) for any other type."
  - "close() sets closed = true. In run, write try (KioskSession session = new KioskSession(s)) { return \"Docked at \" + session.dock(bikeId); } catch (DockFullException e) { return e.getMessage(); }"
review: true

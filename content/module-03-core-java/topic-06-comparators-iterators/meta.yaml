ticket:
  key: SPK-0306
  from: theo
  title: "Ride report comes out in random order"
  body: >
    Itachi asked me which Harbor ride ran 95 minutes last night, and neither of us could find it.
    The ride report prints in whatever order the rides arrived. Support needs it sorted by minutes,
    and sometimes by station and then minutes. Can you also drop the broken rides over the limit?
hints:
  - "compareTo in Ride and compare in ByStationThenMinutes both return a negative, zero or positive int. Integer.compare(a, b) does the work for numbers."
  - "Sort a copy: new ArrayList<>(rides), then call sort on the copy. For longestFirst, pass new ByMinutes().reversed() or build the comparator and call reversed() on it."
  - "In removeAbove, get it = rides.iterator(); loop while it.hasNext(); call it.next() and, when minutes > maxMinutes, call it.remove() and add 1 to a counter."
review: true

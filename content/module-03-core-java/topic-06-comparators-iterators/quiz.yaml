  - id: q05
    type: predict-output
    concept: multi-key-sort
    code: |
      import java.util.ArrayList;
      import java.util.Comparator;
      import java.util.List;

      public class Main {
          record Ride(String station, int minutes) { }

          static class ByStationThenMinutes implements Comparator<Ride> {
              public int compare(Ride a, Ride b) {
                  int byStation = a.station().compareTo(b.station());
                  if (byStation != 0) {
                      return byStation;
                  }
                  return Integer.compare(a.minutes(), b.minutes());
              }
          }

          public static void main(String[] args) {
              List<Ride> rides = new ArrayList<>(List.of(
                      new Ride("Uptown", 10), new Ride("Harbor", 40), new Ride("Harbor", 5)));
              rides.sort(new ByStationThenMinutes().reversed());
              for (Ride r : rides) {
                  System.out.println(r.station() + " " + r.minutes());
              }
          }
      }
    answer: "Uptown 10\nHarbor 40\nHarbor 5"
    explain: "Normal order is Harbor 5, Harbor 40, Uptown 10. reversed() flips the whole list."
    reteach: "## Worked example"


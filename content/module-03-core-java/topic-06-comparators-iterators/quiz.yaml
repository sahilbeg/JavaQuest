  - id: q10
    type: predict-output
    concept: iterator
    code: |
      import java.util.ArrayList;
      import java.util.Iterator;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<Integer> minutes = new ArrayList<>(List.of(25, 95, 8, 140));
              int removed = 0;
              Iterator<Integer> it = minutes.iterator();
              while (it.hasNext()) {
                  if (it.next() > 60) {
                      it.remove();
                      removed++;
                  }
              }
              System.out.println(minutes + " " + removed);
          }
      }
    answer: "[25, 8] 2"
    explain: "95 and 140 are over 60, so the iterator removes them. Two items go."
    reteach: "## Try it"


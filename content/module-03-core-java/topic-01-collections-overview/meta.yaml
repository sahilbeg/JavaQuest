ticket:
  key: SPK-0301
  from: maya
  title: "Kiosk crashes on the 101st ride"
  body: >
    The Riverside kiosk crashed at 6:40 pm yesterday, right as ride 101 of the day ended.
    The ride log lives in a Ride[100] array, and that array is full. We need a log that grows
    as long as riders keep riding. Can you swap it for something that grows?
hints:
  - "The rides field should hold an ArrayList that starts empty. Create it where the field is declared or in the constructor."
  - "add puts a bike id on the end of the list, count returns rides.size(), and get returns rides.get(index)."
  - "In pickCollection, compare job with equals: \"keep rides in order\" gives \"List\", \"unique bike ids\" gives \"Set\", \"minutes per bike\" gives \"Map\"."
review: true

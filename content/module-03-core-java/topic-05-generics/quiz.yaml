  - id: q06
    type: predict-output
    concept: bounded-type
    code: |
      import java.util.List;

      public class Main {
          static <T extends Comparable<T>> T maxOf(List<T> items) {
              T best = items.get(0);
              for (T item : items) {
                  if (item.compareTo(best) > 0) {
                      best = item;
                  }
              }
              return best;
          }

          public static void main(String[] args) {
              System.out.println(maxOf(List.of(7, 42, 19)));
              System.out.println(maxOf(List.of("Harbor", "Riverside", "Old Mill")));
          }
      }
    answer: "42\nRiverside"
    explain: "compareTo orders numbers by size and Strings alphabetically. R comes after H and O."
    reteach: "## Worked example"

  - id: q07
    type: mcq
    concept: invariance
    prompt: "List<String> names = new ArrayList<>(); List<Object> things = names; What happens?"
    choices: ["It does not compile", "It compiles, because String is an Object", "It compiles but crashes when it runs", "things becomes an empty list"]
    answer: 0
    explain: "Generics are invariant. If it compiled, things.add(42) could put a number into a list of Strings."
    reteach: "## Concept"

  - id: q08
    type: spot-the-bug
    concept: bounded-type
    prompt: "Which line must you change so this compiles?"
    code: |
      static <T> double sum(List<T> numbers) {
          double total = 0;
          for (T n : numbers) {
              total += n.doubleValue();
          }
          return total;
      }
    bugLine: 1
    explain: "The compiler reports line 4, because plain T has no doubleValue() method. The fix is the bound on line 1: write <T extends Number> so Java knows T is a number."
    reteach: "## Common mistakes"

  - id: q09
    type: mcq
    concept: bounded-type
    prompt: "Given static <T extends Number> double sum(List<T> numbers), which call does NOT compile?"
    choices: ["sum(List.of(\"10\", \"20\"))", "sum(List.of(10, 20))", "sum(List.of(1.5, 2.5))", "sum(List.of(3L, 4L))"]
    answer: 0
    explain: "String does not extend Number. Integer, Double and Long all do."
    reteach: "## Concept"


  - id: q04
    type: predict-output
    concept: generic-class
    code: |
      public class Main {
          static class Pair<A, B> {
              private final A first;
              private final B second;
              Pair(A first, B second) { this.first = first; this.second = second; }
              A first() { return first; }
              B second() { return second; }
          }

          public static void main(String[] args) {
              Pair<String, Integer> p = new Pair<>("B-1042", 25);
              System.out.println(p.first());
              System.out.println(p.second() * 2);
          }
      }
    answer: "B-1042\n50"
    explain: "first() returns the String. second() returns an Integer, so the maths works with no cast."
    reteach: "## Concept"


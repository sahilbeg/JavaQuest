  - id: q11
    type: predict-output
    concept: immutable-lists
    code: |
      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<String> ids = new ArrayList<>(List.of("B-1042"));
              List<String> view = Collections.unmodifiableList(ids);
              List<String> copy = List.copyOf(ids);
              ids.add("B-2001");
              System.out.println(view.size() + " " + copy.size());
          }
      }
    answer: "2 1"
    explain: "unmodifiableList is a read-only view, so it sees the new item. List.copyOf made a separate copy, so it keeps one item."
    reteach: "### Copies and read-only views"


      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<String> ids = new ArrayList<>(List.of("B-1042", "B-2001", "B-3300"));
              ids.remove(0);
              System.out.println(ids.indexOf("B-3300"));
              System.out.println(ids.contains("B-1042"));
          }
      }
    answer: "1\nfalse"
    explain: "Removing position 0 shifts the others left, so B-3300 is now at 1. B-1042 is gone."
    reteach: "## Concept"


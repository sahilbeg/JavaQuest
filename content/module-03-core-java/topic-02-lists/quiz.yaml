  - id: q05
    type: mcq
    concept: concurrent-modification
    prompt: "You call list.remove(x) inside a for-each loop over the same list. What usually happens?"
    choices: ["ConcurrentModificationException", "The item is removed safely", "A compile error", "The loop starts again from the top"]
    answer: 0
    explain: "The for-each loop usually notices the list changed and throws ConcurrentModificationException. Removing the second-to-last item is the exception: the loop ends early and silently skips the last item."
    reteach: "## Concept"

  - id: q06
    type: spot-the-bug
    concept: concurrent-modification
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<String> ids = new ArrayList<>(List.of("B-1", "T-1", "B-2", "B-3"));
              for (String id : ids) {
                  if (id.startsWith("T")) {
                      ids.remove(id);
                  }
              }
          }
      }
    bugLine: 9
    explain: "Line 9 changes the list while the for-each loop on line 7 is still walking it. Loop backwards with an index instead."
    reteach: "## Common mistakes"


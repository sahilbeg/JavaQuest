  - id: q01
    type: predict-output
    concept: list-methods
    code: |
      import java.util.ArrayList;
      import java.util.List;

      public class Main {
          public static void main(String[] args) {
              List<String> ids = new ArrayList<>();
              ids.add("B-2001");
              ids.add(0, "B-1042");
              ids.add("B-3300");
              ids.set(2, "B-5000");
              System.out.println(ids);
          }
      }
    answer: "[B-1042, B-2001, B-5000]"
    explain: "add(0, ...) puts B-1042 at the front. set(2, ...) replaces the third item."
    reteach: "## Concept"


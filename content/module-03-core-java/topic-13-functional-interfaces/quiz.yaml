    concept: built-in-interfaces
    variants:
      - { prompt: "You need a check that answers true or false for a Ride. Which interface fits?", choices: ["Predicate<Ride>", "Consumer<Ride>", "Supplier<Ride>", "UnaryOperator<Ride>"], answer: 0 }
      - { prompt: "You need something that takes nothing and gives back a station name. Which interface fits?", choices: ["Supplier<String>", "Consumer<String>", "Predicate<String>", "Function<String, String>"], answer: 0 }
    explain: "Predicate takes one value and returns a boolean. Supplier takes nothing and returns a value."
    reteach: "## Concept"


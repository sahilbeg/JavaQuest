  - id: q05
    type: predict-output
    concept: combining-functions
    code: |
      import java.util.function.Predicate;

      public class Main {
          public static void main(String[] args) {
              Predicate<Integer> isLong = minutes -> minutes >= 30;
              Predicate<Integer> isHuge = minutes -> minutes >= 120;
              System.out.println(isLong.and(isHuge.negate()).test(60));
              System.out.println(isLong.negate().or(isHuge).test(150));
          }
      }
    answer: "true\ntrue"
    explain: "60 is long and not huge, so the first is true. 150 is huge, so the or is true."
    reteach: "## Concept"

  - id: q06
    type: predict-output
    concept: combining-functions
    code: |
      import java.util.function.Function;

      public class Main {
          public static void main(String[] args) {
              Function<Integer, Integer> doubleIt = n -> n * 2;
              Function<Integer, Integer> addOne = n -> n + 1;
              System.out.println(doubleIt.andThen(addOne).apply(5));
              System.out.println(addOne.andThen(doubleIt).apply(5));
          }
      }
    answer: "11\n12"
    explain: "andThen runs the first function, then the second. 5 doubled is 10, plus 1 is 11. 5 plus 1 is 6, doubled is 12."
    reteach: "## Concept"

  - id: q07
    type: spot-the-bug
    concept: custom-functional-interface
    prompt: "Which method breaks the one-method rule?"
    code: |
      @FunctionalInterface
      interface Promotion {
          double apply(String type, double fare);
          String name();
      }
    bugLine: 4
    explain: "Line 4 adds a second abstract method. That breaks the one-method rule, so @FunctionalInterface makes the compiler stop."
    reteach: "## Common mistakes"


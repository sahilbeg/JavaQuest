  - id: q10
    type: spot-the-bug
    concept: built-in-interfaces
    code: |
      import java.util.function.Consumer;

      public class Main {
          public static void main(String[] args) {
              Consumer<String> show = text -> System.out.println(text);
              show.apply("Harbor");
          }
      }
    bugLine: 6
    explain: "A Consumer's method is accept. The line should be show.accept(\"Harbor\");"
    reteach: "## Common mistakes"

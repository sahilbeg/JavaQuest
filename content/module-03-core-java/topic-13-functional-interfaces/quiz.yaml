questions:
  - id: q01
    type: mcq
    concept: functional-interface
    variants:
      - { prompt: "What makes an interface a functional interface?", choices: ["It has exactly one abstract method", "It has no methods at all", "It has only static methods", "It extends Function"], answer: 0 }
      - { prompt: "Which interface can a lambda fill in?", choices: ["One with exactly one abstract method", "One with two abstract methods", "One with only default methods", "Any class with a constructor"], answer: 0 }
    explain: "A lambda fills in one method. So the interface needs exactly one abstract method for Java to know which one."
    reteach: "## Concept"

  - id: q02
    type: mcq
    concept: functional-interface-annotation
    prompt: "What does @FunctionalInterface do?"
    choices: ["The compiler checks the interface has exactly one abstract method", "It makes the interface run faster", "It turns every method into a lambda", "It is required, or lambdas will not compile"]
    answer: 0
    explain: "The annotation is a guard. The interface works without it, but with it the compiler rejects a second abstract method."
    reteach: "## Concept"

  - id: q03

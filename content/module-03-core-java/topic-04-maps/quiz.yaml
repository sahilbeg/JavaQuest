  - id: q09
    type: spot-the-bug
    concept: map-methods
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Map<String, Integer> totals = new HashMap<>();
              int uptown = totals.get("Uptown");
              System.out.println(uptown + 10);
          }
      }
    bugLine: 6
    explain: "Uptown is missing, so get returns null. Turning null into an int crashes. Use getOrDefault(\"Uptown\", 0)."
    reteach: "## Common mistakes"

  - id: q10

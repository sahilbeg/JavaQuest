  - id: q02
    type: mcq
    concept: key-value
    prompt: "You call put(\"Harbor\", 30) and then put(\"Harbor\", 45). What does the map hold for Harbor?"
    choices: ["45", "30", "75", "Both 30 and 45"]
    answer: 0
    explain: "A key appears once. A second put with the same key replaces the old value."
    reteach: "## Concept"

  - id: q03
    type: predict-output
    concept: map-methods
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Map<String, Integer> m = new HashMap<>();
              m.put("Harbor", 45);
              System.out.println(m.get("Uptown"));
              System.out.println(m.getOrDefault("Uptown", 0));
              System.out.println(m.containsKey("Harbor"));
          }
      }
    answer: "null\n0\ntrue"
    explain: "get returns null for a missing key. getOrDefault returns the fallback 0. Harbor is a key, so containsKey is true."
    reteach: "## Concept"

  - id: q04
    type: fill-blank
    concept: counting-pattern
    goal: "Read the current count for this bike type, using 0 when the type has no count yet."
    prompt: "counts.put(type, counts.___(type, 0) + 1);"
    answers: ["getOrDefault"]
    explain: "getOrDefault gives 0 the first time a type appears, so the count starts at 1."
    reteach: "## Concept"

  - id: q05
    type: predict-output
    concept: counting-pattern
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Map<String, Integer> counts = new TreeMap<>();
              for (String t : List.of("ebike", "cargo", "ebike")) {
                  counts.put(t, counts.getOrDefault(t, 0) + 1);
              }
              System.out.println(counts);
          }
      }
    answer: "{cargo=1, ebike=2}"
    explain: "ebike is counted twice and cargo once. The TreeMap prints its keys in alphabetical order."
    reteach: "## Try it"


  - id: q08
    type: mcq
    concept: hashmap-vs-treemap
    prompt: "Which map loops over its keys in sorted order?"
    choices: ["TreeMap", "HashMap", "LinkedHashMap", "Every map"]
    answer: 0
    explain: "TreeMap keeps keys sorted. HashMap promises no order. LinkedHashMap keeps the order keys were first put."

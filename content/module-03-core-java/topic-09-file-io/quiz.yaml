  - id: q09
    type: spot-the-bug
    concept: try-with-resources-files
    code: |
      public static void save(File file) throws IOException {
          BufferedWriter w = new BufferedWriter(new FileWriter(file, StandardCharsets.UTF_8));
          w.write("B-1042,Riverside,ebike,25");
          w.newLine();
      }
    bugLine: 2
    explain: "The writer is never closed, so the text may never reach the disk. Open it inside try ( ... )."

  - id: q06
    type: predict-output
    concept: buffered-reader
    code: |
      import java.io.*;
      import java.nio.charset.StandardCharsets;

      public class Main {
          public static void main(String[] args) throws IOException {
              try (BufferedWriter w = new BufferedWriter(new FileWriter("q6.txt", StandardCharsets.UTF_8))) {
                  w.write("Harbor");
                  w.newLine();
                  w.write("Uptown");
                  w.newLine();
              }
              try (BufferedReader r = new BufferedReader(new FileReader("q6.txt", StandardCharsets.UTF_8))) {
                  String line = r.readLine();
                  while (line != null) {
                      System.out.println(line.length());
                      line = r.readLine();
                  }
              }
          }
      }
    answer: "6\n6"
    explain: "The file holds two lines, Harbor and Uptown. Each has 6 letters, and readLine() drops the line break."
    reteach: "## Worked example"

  - id: q07
    type: predict-output
    concept: buffered-reader
    code: |
      import java.io.*;
      import java.nio.charset.StandardCharsets;

      public class Main {
          public static void main(String[] args) throws IOException {
              try (PrintWriter out = new PrintWriter(new FileWriter("q7.txt", StandardCharsets.UTF_8))) {
                  out.println("a");
                  out.println("b");
                  out.println("c");
              }
              try (BufferedReader r = new BufferedReader(new FileReader("q7.txt", StandardCharsets.UTF_8))) {
                  while (r.readLine() != null) {
                      System.out.println(r.readLine());
                  }
              }
          }
      }
    answer: "b\nnull"
    explain: "Each readLine() call reads a new line. The check eats a, the print shows b, the check eats c, and the print shows null."
    reteach: "## Common mistakes"

